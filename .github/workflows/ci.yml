name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart run tool/check_l10n.dart
      - run: flutter analyze
      - run: flutter test --exclude-tags screenshots
      - run: flutter test --tags screenshots
        continue-on-error: true # goldens are rendered on Linux; review diffs manually

  apk:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP lint uses Java 21 APIs (List.removeLast)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Decode keystore (only if the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.STAFF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/staff.jks"
            echo "STAFF_KEYSTORE_PATH=$RUNNER_TEMP/staff.jks" >> "$GITHUB_ENV"
          fi
      - name: Build demo APK
        env:
          STAFF_KEYSTORE_PASSWORD: ${{ secrets.STAFF_KEYSTORE_PASSWORD }}
          STAFF_KEY_ALIAS: ${{ secrets.STAFF_KEY_ALIAS }}
          STAFF_KEY_PASSWORD: ${{ secrets.STAFF_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define=APP_ENV=demo
      - uses: actions/upload-artifact@v4
        with:
          name: staff-app-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # Same APK against the live test server (config/live.env: public values only, ADR-M16).
      - name: Build live APK
        env:
          STAFF_KEYSTORE_PASSWORD: ${{ secrets.STAFF_KEYSTORE_PASSWORD }}
          STAFF_KEY_ALIAS: ${{ secrets.STAFF_KEY_ALIAS }}
          STAFF_KEY_PASSWORD: ${{ secrets.STAFF_KEY_PASSWORD }}
        run: flutter build apk --release --dart-define-from-file=config/live.env
      - uses: actions/upload-artifact@v4
        with:
          name: staff-app-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
