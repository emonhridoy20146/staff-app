name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: dart run tool/check_l10n.dart
      - run: flutter analyze
      - run: flutter test --exclude-tags screenshots
      - run: flutter test --tags screenshots
        continue-on-error: true # goldens are rendered on Linux; review diffs manually

  apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the test release on main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Decode keystore (main must have one)
        env:
          KEYSTORE_B64: ${{ secrets.STAFF_KEYSTORE_B64 }}
          IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/staff.jks"
            echo "STAFF_KEYSTORE_PATH=$RUNNER_TEMP/staff.jks" >> "$GITHUB_ENV"
          elif [ "$IS_MAIN_PUSH" = "true" ]; then
            # A debug key is new on every CI run, so a phone refuses such an APK over the previous one ("App not installed").
            echo "::error title=No release key::STAFF_KEYSTORE_B64 is not set, so main would publish an APK that cannot update an installed app. Make the key once with tool/make_release_keystore.sh and add the four STAFF_* secrets (README, Release signing)."
            exit 1
          else
            echo "::warning title=Debug-signed APK::No STAFF_KEYSTORE_B64 secret: this APK is debug-signed and installs on a phone only after uninstalling the previous build."
          fi
      - name: Build live APK
        env:
          STAFF_KEYSTORE_PASSWORD: ${{ secrets.STAFF_KEYSTORE_PASSWORD }}
          STAFF_KEY_ALIAS: ${{ secrets.STAFF_KEY_ALIAS }}
          STAFF_KEY_PASSWORD: ${{ secrets.STAFF_KEY_PASSWORD }}
        # Every build gets a higher build number, so a phone can install it over the previous one.
        run: |
          NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          echo "APP_VERSION=$NAME+${{ github.run_number }}" >> "$GITHUB_ENV"
          flutter build apk --release --dart-define-from-file=config/live.env --build-name="$NAME" --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/staff-app-$NAME-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: staff-app-live-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # On main: a GitHub release with the APK, so the owner downloads it from the Releases page (no login to Actions needed).
      - name: Publish test release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION/+/-build.}"
          gh release create "$TAG" build/app/outputs/flutter-apk/staff-app-*.apk \
            --title "Staff app $APP_VERSION" --prerelease --target "${{ github.sha }}" \
            --notes "Test build from main ($(git log -1 --format=%s)). What changed: docs/CHANGELOG.md."
