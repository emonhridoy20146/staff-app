    LocationDailySummary:
      type: object
      properties: { distanceKm: { type: number }, movingMin: { type: integer }, stoppedMin: { type: integer }, stopsCount: { type: integer }, customerStops: { type: integer }, gapsMin: { type: integer }, mockPoints: { type: integer } }
    SyncMutation:
      type: object
      required: [mutationId, entity, op, payload]
      properties:
        mutationId: { type: string, format: uuid }
        entity: { type: string, enum: [visit, collection, note, promise, promise_cancel, deposit, attendance_event, tag, location_proposal, visit_checkout, handover_decision, cash_closing, contact_attempt, broadcast_ack, task_resolve_request, attendance_selfie, customer_phone, collection_withdraw, collection_edit, place, place_edit, place_move_request], description: 'place, place_edit, place_move_request (1.38.0): see the payload description. collection_withdraw (1.32.0) payload { collectionId | clientId, reason? }: same as POST /collections/{id}/withdraw; needs collection.withdraw; send it after the collection (dependsOn). collection_edit (1.32.0) payload { collectionId | clientId, amountPoisha?, note?, payerName? }: same as PATCH /collections/{id}; needs collection.edit; a repeat with the same values is a replay. customer_phone (1.23.0) payload { customerId, phones: [{ number, label? }] }: same body as POST /customers/{id}/phones; needs permission customer.phone.manage; a repeat adds nothing. attendance_selfie (1.21.0) payload { eventClientId, selfieMediaId }: adds the photo to an attendance event that was sent before its photo uploaded; send it after that event (dependsOn).' }
        op: { type: string, enum: [create, update] }
        payload:
          type: object
          additionalProperties: true
          description: |
            Same body as the matching REST call (1.2.0 documents the mapping):
            collection → CollectionCreate (+ idempotencyKey) · visit → VisitCreate · note → POST /customers/{id}/notes body (+ customerId) ·
            promise → POST /promises body · deposit → DepositCreate · attendance_event → POST /attendance/events body ·
            tag → PUT /customers/{id}/tag body (+ customerId) · location_proposal → POST /customers/{id}/location-proposals body (+ customerId) ·
            contact_attempt → ContactAttemptCreate
            Declared in 1.5.0: collection and deposit may carry `idempotencyKey` (uuid); without it the mutationId is the key ·
            visit_checkout → { visitId | visitClientId, checkOutAt, outcome? } · promise_cancel → { promiseId, reason } ·
            cash_closing → { businessDate, note? } · handover_decision → { handoverId, decision: accept|reject, reason? (required to reject) } ·
            tag payload may carry `ifMatch` (customer version).
            1.12.0: broadcast_ack → { broadcastId, at? } (when the staff tapped "read"; kept between sending and now).
            1.20.0: task_resolve_request → { taskId, note?, requestedAt? } (the staff member says the task is done; idempotent, a repeat is a replay). Needs permission task.work.
            1.38.0: place → PlaceCreate (same as POST /places; needs place.create; the result entityId is the server id) ·
            place_edit → { placeId | placeClientId, name?, icon?, note? } (same as PATCH /places/{id} without location; placeClientId = the clientId of a place this user created, for edits made before the create was synced) ·
            place_move_request → { placeId | placeClientId, clientId, location, reason? } (same as POST /places/{id}/move-request). Both need place.create.
            Every mutation is idempotent by mutationId; the same id with a different payload is rejected with IDEMPOTENCY_MISMATCH.
        createdAt: { type: string, format: date-time }
    SyncPushRequest:
      type: object
