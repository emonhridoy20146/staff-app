    SyncMutation:
      type: object
      required: [mutationId, entity, op, payload]
      properties:
        mutationId: { type: string, format: uuid }
        entity: { type: string, enum: [visit, collection, note, promise, promise_cancel, deposit, attendance_event, tag, location_proposal, visit_checkout, handover_decision, cash_closing, contact_attempt] }
        op: { type: string, enum: [create, update] }
        payload:
          type: object
          additionalProperties: true
          description: |
            Same body as the matching REST call (1.2.0 documents the mapping):
            collection → CollectionCreate (+ idempotencyKey) · visit → VisitCreate · note → POST /customers/{id}/notes body (+ customerId) ·
            promise → POST /promises body · deposit → DepositCreate · attendance_event → POST /attendance/events body ·
            tag → PUT /customers/{id}/tag body (+ customerId) · location_proposal → POST /customers/{id}/location-proposals body (+ customerId) ·
            contact_attempt → ContactAttemptCreate
            Declared in 1.5.0: collection and deposit may carry `idempotencyKey` (uuid); without it the mutationId is the key ·
            visit_checkout → { visitId | visitClientId, checkOutAt, outcome? } · promise_cancel → { promiseId, reason } ·
            cash_closing → { businessDate, note? } · handover_decision → { handoverId, decision: accept|reject, reason? (required to reject) } ·
            tag payload may carry `ifMatch` (customer version).
            Every mutation is idempotent by mutationId; the same id with a different payload is rejected with IDEMPOTENCY_MISMATCH.
        createdAt: { type: string, format: date-time }
    SyncPushRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId: { type: string }
        lastPullCursor: { type: string }
        pendingCount: { type: integer, minimum: 0, description: 'Mutations still queued on the device after this batch; shown in sync health (1.5.0)' }
        mutations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SyncMutation' } }
    SyncPushResponse:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            properties:
              mutationId: { type: string }
              result: { type: string, enum: [applied, replayed, conflict, rejected] }
              entityId: { type: string }
              status: { type: string }
              conflict: { type: object, properties: { code: { type: string }, message: { $ref: '#/components/schemas/I18nText' } } }
              error: { $ref: '#/components/schemas/Problem' }
              retryable: { type: boolean, description: 'Only on rejected: true means a transient server failure, keep the item queued (1.5.0)' }
              receiptNo: { type: string }
              eventId: { type: string }
    SyncChange:
      type: object
      properties:
        seq: { type: integer }
        entity: { type: string, enum: [customer, collection, visit, note, promise, tag, handover, assignment, area, deposit, attendance_day, notification, broadcast, setting, contact_attempt, location_proposal, cowork_session] }
        op: { type: string, enum: [upsert, delete] }
        id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: |
            Present for op=upsert. Shape per entity (1.2.0 documents the mapping; values unchanged):
            customer → CustomerDetail · collection → Collection · visit → Visit · note → Note · promise → Promise ·
            tag → Tag (with customerId) · handover → Handover · assignment → Assignment · area → Area · deposit → Deposit ·
            attendance_day → AttendanceDay · notification → Notification · broadcast → Broadcast · setting → { key, value } ·
            contact_attempt → ContactAttempt · location_proposal → OwnLocationProposal (1.7.0; sent only to the staff member who proposed, on create and on the manager's decision) ·
            cowork_session → CoworkSession (1.9.0; sent to every invited or member user on each change)
        reason: { type: string }
