      description: 'Sessions in scope for managers, newest first, with visitsCount (1.9.0). Permission cowork.view.'
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CoworkSession' } }, nextCursor: { type: [string, 'null'] } } } } } }
  /cowork/sessions/{id}:
    get:
      tags: [cowork]
      operationId: getCoworkSession
      description: 'One session with visitsCount (1.9.0). Permission cowork.view; out of scope is 404. Its visits: GET /visits?coWorkSessionId='
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
