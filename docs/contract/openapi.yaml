        endReason: { type: [string, 'null'], description: "The office user's reason (1.34.0); present with endedBy" }
        visitsCount: { type: integer, description: 'Co-work visits recorded in this session (manager list and detail only)' }
    PlaceIcon: { type: string, enum: [shop, market, mosque, school, bank, hospital, bus_stop, office, landmark, other], description: '1.38.0. A short fixed list; the clients draw their own symbol for each.' }
