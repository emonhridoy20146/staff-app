        visitCredit: { type: number }
        promisesKept: { type: integer }
        amountAchievement: { type: [number, 'null'] }
        presentDays: { type: integer }
        eligible: { type: boolean }
        me: { type: boolean, description: 'The caller' }
    Leaderboard:
