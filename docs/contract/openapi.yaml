      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContactAttempt' } } } } }
    post:
      tags: [notes]
      operationId: logContactAttempt
      description: Added in 1.2.0 (FR-M-014). Idempotent by clientId.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttemptCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttempt' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttempt' } } } }
  /promises:
    get:
      tags: [promises]
      operationId: listPromises
      description: |
        Promised dates `from` / `to` work for future days too: "next 7 days" is `from=<today>&to=<today+7>` (1.45.0, verified).
        1.45.0 (FR-PRM-006): `createdBy` = who made the promise (staff filter; `ownerId` is the customer's assignee);
        `brokenWithoutFollowUp=true` = broken or partially kept promises that have no follow-up promise (cancelled follow-ups
        do not count), newest first, so the office can see who was not followed up; with `status` it narrows to that status.
        `followUpOf=<id>` lists the follow-ups of one promise.
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: ownerId, in: query, schema: { type: string } }, { name: createdBy, in: query, schema: { type: string }, description: 'Added in 1.45.0. Who made the promise' }, { name: brokenWithoutFollowUp, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'Added in 1.45.0' }, { name: followUpOf, in: query, schema: { type: string }, description: 'Added in 1.45.0' }, { name: customerId, in: query, schema: { type: string }, description: 'Documented in 1.4.0' }, { name: date, in: query, schema: { type: string, format: date }, description: 'Promised date; wins over from/to' }, { name: from, in: query, schema: { type: string, format: date }, description: 'Promised date from, inclusive (1.4.0)' }, { name: to, in: query, schema: { type: string, format: date }, description: 'Promised date to, inclusive (1.4.0)' }, { name: status, in: query, schema: { $ref: '#/components/schemas/PromiseStatus' } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PromiseListItem' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [promises]
      operationId: createPromise
      description: |
        Permission promise.create (field staff, branch managers and super admins by default, so the office can record a
        promise from admin-web too). Same rules as the sync mutation `promise`, idempotent by clientId.
        1.45.0 (FR-PRM-006): `followUpOf` links the new promise to a broken (or partially kept) promise of the same customer.
        The broken promise keeps its status; the new one is an ordinary promise with `attempt` = previous attempt + 1.
        422 BUSINESS_RULE `PROMISE_FOLLOW_UP_INVALID` (details.reason NOT_FOUND | OTHER_CUSTOMER | NOT_BROKEN) when it
        cannot be linked. A promise made from admin-web (web client) is audited (`promise.created`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromiseCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Promise' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /promises/{id}/cancel:
    post:
      tags: [promises]
      operationId: cancelPromise
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }

  /prospects:
    get:
      tags: [prospects]
      operationId: listProspects
      description: |
        Added in 1.45.0 (FR-PRO-001, module `prospects`, flag `module.prospects`). Possible customers in the caller's branch
        scope, newest first. Permission prospect.view; a caller with only prospect.create (field staff) sees the ones they
        created. `from` / `to` = Asia/Dhaka business date of creation (inclusive); `q` matches name, phone digits, address and note.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProspectStatus' } }
        - { name: createdBy, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items, nextCursor, total], properties: { items: { type: array, items: { $ref: '#/components/schemas/Prospect' } }, nextCursor: { type: [string, 'null'] }, total: { type: integer, description: 'Rows matching the filters (all pages)' } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [prospects]
      operationId: createProspect
      description: |
        Added in 1.45.0. Permission prospect.create. Same as the sync mutation `prospect`. Idempotent by clientId: the same
        clientId again answers 200 with the stored prospect (another user's clientId → 409 IDEMPOTENCY_MISMATCH).
        The branch is the creator's home branch, or `branchId` (in scope) for office users. `fromProspectId` copies nothing
        but records that this is a re-entry of an older prospect (the office "create new from old").
        An unknown or out-of-scope `branchId` or `fromProspectId` is 400 VALIDATION_FAILED.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProspectCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /prospects/{id}:
    get:
      tags: [prospects]
      operationId: getProspect
      description: 'Added in 1.45.0. prospect.view in scope, or the creator. Out of scope is 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [prospects]
      operationId: updateProspect
      description: |
        Added in 1.45.0. prospect.manage. Edits the details and/or moves the status between new, contacted and dropped
        (converted only through /convert; a converted prospect is re-opened through /reopen). Every status change is kept
        in `history`. Audited (`prospect.updated`). Edit, convert and reopen answer 409 INVALID_STATE (reason PROSPECT_CHANGED)
        when another change landed at the same moment; reload and retry. A repeat with nothing new changes nothing.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProspectUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /prospects/{id}/convert:
    post:
      tags: [prospects]
      operationId: convertProspect
      description: |
        Added in 1.45.0. prospect.manage. Marks the prospect converted and links it to the FOS customer (`customerId`) or
        to an ERP customer code (`erpCustomerCode`; resolved to the FOS customer when that customer is already synced,
        else kept as the code). Unknown or out-of-scope customerId → 404. Already converted → 409 INVALID_STATE
        (reason PROSPECT_CONVERTED). Audited (`prospect.converted`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { customerId: { type: string }, erpCustomerCode: { type: string, maxLength: 64 }, note: { type: string, maxLength: 500 } }, description: 'customerId or erpCustomerCode is required' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /prospects/{id}/reopen:
    post:
      tags: [prospects]
      operationId: reopenProspect
      description: 'Added in 1.45.0. prospect.manage. A converted or dropped prospect goes back to `new` (re-entry); the conversion link is cleared on the prospect and kept in `history`. Other statuses → 409 INVALID_STATE (reason PROSPECT_OPEN). Audited (`prospect.reopened`).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Prospect' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /requests:
    get:
      tags: [requests]
      operationId: listRequests
      description: |
        Added in 1.48.0 (FR-REQ-001..006, module `requests`, flag `module.requests`, ADR-066). Requests / tickets newest first.
        Scope: request.view sees the caller's branches (super admin and area manager: every branch), plus the ones the caller
        created or is assigned; a caller with only request.create (field staff) sees the ones they created and the ones
        assigned to them now. `from` / `to` = Asia/Dhaka business date of creation (inclusive). `status` takes one value or
        several separated by commas. `queue` = where the item waits now (`assignee` = assigned to a person). `assigneeId=me`
        means the caller. `q` matches title and body. `counts` = rows per status for the same filters without `status`.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { name: status, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/RequestStatus' } } }
        - { name: priority, in: query, schema: { $ref: '#/components/schemas/RequestPriority' } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/RequestType' } }
        - { name: queue, in: query, schema: { $ref: '#/components/schemas/RequestQueue' } }
        - { name: assigneeId, in: query, schema: { type: string }, description: 'A user id, or `me`' }
        - { name: createdBy, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RequestPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [requests]
      operationId: createRequest
      description: |
        Added in 1.48.0. request.create. Same as the sync mutation `request` (the app sends it offline-first). Idempotent by
        clientId: the same clientId again answers 200 with the stored request (another user's clientId → 409
        IDEMPOTENCY_MISMATCH). `priority: important` waits in the super admin queue, `normal` in the area manager queue.
        The branch is the creator's home branch, or `branchId` (in scope) for office users with request.view.
        `customerId` must be a customer in the caller's scope; `photoMediaIds` must be photos the caller uploaded
        (upload them first, POST /media/upload-url + confirm). Otherwise 400 VALIDATION_FAILED. Audited (`request.created`).
        Notifies the queue: important → holders of request.important.manage (super admins); normal → area managers
        (holders of request.manage without request.important.manage), or the super admins when there is none.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /requests/{id}:
    get:
      tags: [requests]
      operationId: getRequest
      description: 'Added in 1.48.0. With the full timeline. Out of scope (see GET /requests) is 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /requests/{id}/comment:
    post:
      tags: [requests]
      operationId: commentRequest
      description: |
        Added in 1.48.0. Anyone who can see the request (request.view or request.create). Appends a `comment` timeline entry.
        Idempotent by the comment's clientId (same as the sync mutation `request_comment`). A closed request is 409
        INVALID_STATE (reason REQUEST_CLOSED). Notifies the creator and the assignee (not the author). Audited (`request.commented`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestComment' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /requests/{id}/forward:
    post:
      tags: [requests]
      operationId: forwardRequest
      description: |
        Added in 1.48.0. request.manage. Sends the request to a queue (`area_manager` or `super_admin`) or to a person
        (`userId`: an active user who holds request.create or request.manage) with a note; status `forwarded`. Exactly one of
        `queue` / `userId`. A request in the super admin queue can be moved only by a holder of request.important.manage
        (403 FORBIDDEN otherwise). Resolved or closed → 409 INVALID_STATE. Unknown target → 422 BUSINESS_RULE
        REQUEST_INVALID_TARGET. Timeline `forwarded { from, to, note }`; notifies the target. Audited (`request.forwarded`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestForward' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /requests/{id}/assign:
    post:
      tags: [requests]
      operationId: assignRequest
      description: |
        Added in 1.48.0. request.manage. Gives the request to a person (same targets and rules as /forward); status
        `in_progress`. Timeline `assigned`; notifies the assignee. Audited (`request.assigned`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestAssign' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /requests/{id}/resolve:
    post:
      tags: [requests]
      operationId: resolveRequest
      description: |
        Added in 1.48.0. request.manage (super admin queue: request.important.manage), or the current assignee. `note` is
        required. Status `resolved`; timeline `resolved { note }`; notifies the creator. Resolved or closed → 409
        INVALID_STATE. Audited (`request.resolved`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestNote' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /requests/{id}/reopen:
    post:
      tags: [requests]
      operationId: reopenRequest
      description: |
        Added in 1.48.0. The creator, or request.manage (super admin queue: request.important.manage). Only a resolved or
        closed request (else 409 INVALID_STATE REQUEST_OPEN); it goes back to the queue / assignee it had; status `reopened`.
        `note` is required. Notifies the queue or assignee. Audited (`request.reopened`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RequestNote' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /requests/{id}/close:
    post:
      tags: [requests]
      operationId: closeRequest
      description: |
        Added in 1.48.0. request.manage (super admin queue: request.important.manage), or the creator (withdraws their own).
        Status `closed` (final until reopened); `note` optional. Already closed → 409 INVALID_STATE. Audited (`request.closed`).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Request' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /attendance/events:
    post:
      tags: [attendance]
      operationId: attendanceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, type, at, geo]
              properties:
                clientId: { type: string, format: uuid }
                type: { type: string, enum: [work_in, break_start, break_end, work_out] }
                at: { type: string, format: date-time }
                deviceTime: { type: string, format: date-time }
                geo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'null when no GPS fix could be taken (1.2.0); send geoUnavailableReason' }
                geoUnavailableReason: { $ref: '#/components/schemas/GeoUnavailableReason' }
                selfieMediaId: { type: string, description: "Front-camera photo (media kind `selfie`) uploaded by this user. Stored on every event type. Required at the event types in setting `attendance.selfieEvents` while `attendance.selfieRequired` is true (defaults: true, all four types); an event without it is still stored and flagged `no_selfie` (1.8.0)." }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceDay' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      tags: [attendance]
      operationId: listAttendanceEvents
      description: "One staff member's raw events of a business date, oldest first, with photo, place and flags per event (1.8.0). Permission attendance.view; a user outside the caller's branches is 404. The photo is read with GET /media/{id}/url."
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceEvent' } } } } }
  /attendance/photos/delete:
    post:
      tags: [attendance]
      operationId: deleteAttendancePhotos
      description: |
        media.delete (1.37.0, FR-MED-004). Deletes the attendance photos of one staff member on one business date. Each
        event that had a photo gets `selfieDeleted { at, by, byName }` and `selfieMediaId: null`; the photo files are removed
        from Cloudinary and from the server's store. Branch scope: a user outside the caller's branches is 404. A day without
        photos answers `deleted: 0`. Audited as `attendance.photos_deleted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, date]
              properties:
                userId: { type: string }
                date: { type: string, format: date }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, events]
                properties:
                  deleted: { type: integer, description: Number of photos deleted }
                  events: { type: array, items: { $ref: '#/components/schemas/AttendanceEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /attendance/me/today:
    get:
      tags: [attendance]
      operationId: myAttendanceToday
      description: '1.36.0: also returns `events`, the day''s attendance events (oldest first), so a phone that lost its local data (reinstall) restores the work-in, breaks and work-out already recorded instead of asking again.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AttendanceDay'
                  - type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          required: [id, type, at, source]
                          properties:
                            id: { type: string }
                            clientId: { type: [string, 'null'], description: 'The id the phone gave the event; restore it under this id so a retry stays idempotent' }
                            type: { type: string, enum: [work_in, break_start, break_end, work_out] }
                            at: { type: string, format: date-time }
                            source: { type: string, enum: [app, correction, system] }
  /attendance/me/shift:
    get:
      tags: [attendance]
      operationId: myShift
      description: 'attendance.record (1.12.0). The caller''s shift: their own if assigned, else the branch default (`id: default`). Weekly off days are 0 = Sunday … 6 = Saturday. 1.25.0: `breakWindows` (e.g. the Friday break).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } }
  /attendance/days:
    get:
      tags: [attendance]
      operationId: listAttendanceDays
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } } } } }
  /attendance/summary:
    get:
      tags: [attendance]
      operationId: attendanceSummary
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: month, in: query, required: true, schema: { type: string, example: 2026-11 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { month: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/AttendanceSummaryRow' } } } } } } }
  /attendance/corrections:
    post:
      tags: [attendance]
      operationId: attendanceCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, businessDate, type, at, reason], properties: { userId: { type: string }, businessDate: { type: string, format: date }, type: { type: string, enum: [work_in, break_start, break_end, work_out] }, at: { type: string, format: date-time }, replacesEventId: { type: string }, reason: { type: string } } }
      responses:
        '201': { description: Created }
  /leave-requests:
    get:
      tags: [attendance]
      operationId: listLeave
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: userId, in: query, description: 'attendance.manage only (1.12.0); ignored for staff', schema: { type: string } }
        - { name: from, in: query, description: 'Requests overlapping from..to (1.12.0)', schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'OK. Staff see their own; attendance.manage sees its branches. Newest first, max 300, no cursor (1.4.0)', content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } } } } } } }
    post:
      tags: [attendance]
      operationId: requestLeave
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type, from, to], properties: { type: { type: string, enum: [casual, sick, other] }, from: { type: string, format: date }, to: { type: string, format: date }, reason: { type: string, maxLength: 500 } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '409': { description: 'INVALID_STATE `LEAVE_OVERLAPS` (a pending or approved request covers one of the days)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'BUSINESS_RULE `LEAVE_TOO_LONG` (more than 31 days)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /leave-requests/{id}/decision:
    post:
      tags: [attendance]
      operationId: decideLeave
      description: 'attendance.manage, in branch scope. Rejecting needs a reason (≥ 5 characters, 422 `REASON_REQUIRED`); nobody decides their own (422 `CANNOT_DECIDE_OWN_LEAVE`); a decided request answers 409 `ALREADY_DECIDED`.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
  /leave-requests/{id}/cancel:
    post:
      tags: [attendance]
      operationId: cancelLeave
      description: 'leave.request (1.12.0). The requester withdraws their own pending request (e.g. to fix the dates). Repeating it answers the cancelled request; a decided one answers 409 `ALREADY_DECIDED`; someone else''s 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /location/tracking-token:
    post:
      tags: [location]
      operationId: issueTrackingToken
      summary: Issue (rotate) the tracking token for the native location service
      description: |
        1.49.0 (FR-LOC-013, ADR-067). Staff app only (`client: app` session with a device id) and only for users who may
        post points (`attendance.record`). Returns an opaque token for `Authorization: Tracking <token>` on
        POST /location/points, and nowhere else. The token is bound to the caller's user, device and session and lives
        `location.trackingTokenTtlHours` (default 24) hours. Every call rotates: the previous token of this user and
        device stops working at once; tokens of the user's other devices are not touched. Logout (of this session or
        device, 1.51.0), password change / reset, deactivation, device unbind and ending the session revoke it. Needs a normal access token (a tracking token is refused here). No body.
      responses:
        '200':
          description: Token issued; the previous one of this device is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackingToken' }
              example: { token: 'trk_3q2Xb0Hk1n0bS8yJ1y8mV1y2Zl9pQe8lYw0bD7fK3cU', expiresAt: '2026-11-27T04:00:00.000Z' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { description: 'FORBIDDEN (`details.permission: attendance.record`, or `details.reason: APP_ONLY` for a web session or a session without a device), FEATURE_DISABLED, PASSWORD_CHANGE_REQUIRED', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Problem' }
  /location/points:
    post:
      tags: [location]
      operationId: ingestPoints
      description: |
        Since 1.49.0 (ADR-067) also accepts `Authorization: Tracking <token>` from POST /location/tracking-token, so the
        native service keeps uploading after the app is closed and the access token has expired. With a tracking token
        `deviceId` must be the token's device; the user must still be active, the session live and the device approved,
        else 401 UNAUTHENTICATED (`details.reason`: TRACKING_TOKEN_INVALID or TRACKING_TOKEN_EXPIRED; do not refresh,
        keep the points buffered until the app issues a new token). Duty-hours rules are unchanged (OFF_DUTY per point).
      security:
        - bearerAuth: []
        - trackingToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, points]
              properties:
                deviceId: { type: string }
                points: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/LocationPoint' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: integer }, rejected: { type: array, items: { type: object, properties: { index: { type: integer }, reason: { type: string, enum: [LOW_ACCURACY, IMPOSSIBLE_SPEED, FUTURE_TIME, DUPLICATE, OFF_DUTY] } } } }, nextSampling: { $ref: '#/components/schemas/SamplingConfig' } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /location/heartbeat:
    post:
      tags: [location]
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { battery: { type: number }, charging: { type: boolean }, gpsEnabled: { type: boolean }, permission: { type: string, enum: [always, while_in_use, denied] }, bgRestricted: { type: boolean }, appVersion: { type: string }, pendingPoints: { type: integer }, pendingMutations: { type: integer }, trackingProvider: { type: string, enum: [free, paid], description: 'Plugin actually running on the device (1.5.0)' }, trackingProviderFallback: { type: boolean, description: 'true when the setting asked for paid but the app fell back to free (1.5.0)' } } }
      responses:
        '204': { description: OK }
  /location/latest:
    get:
      tags: [location]
      operationId: latestLocations
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LatestLocation' } } } } }
  /location/history:
    get:
      tags: [location]
      operationId: locationHistory
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } }, { name: simplify, in: query, schema: { type: number, default: 10 } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  polyline: { type: string, description: 'Google encoded polyline (precision 5)' }
                  segments: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, kind: { type: string, enum: [moving, gap] } } } }
                  stops: { type: array, items: { $ref: '#/components/schemas/Stop' } }
                  events: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
                  summary: { $ref: '#/components/schemas/LocationDailySummary' }
  /location/stops:
    get:
      tags: [location]
      operationId: locationStops
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Stop' } } } } }

  /sync/bootstrap:
    get:
      tags: [sync]
      operationId: syncBootstrap
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 200 } } ]
      responses:
        '200': { description: "Paged snapshot for a fresh device; the final page has nextCursor null and returns pullCursor (schema declared in 1.5.0). Entities, in this order (1.9.1): attendance_day (today, id userId:date), cowork_session (today's), customer (whole scope), location_proposal (own pending), promise (own open), visit (today's, own and joint). Since 1.20.0 also task (open ones and those closed in the last 30 days). Older history is not included; it is read online.", content: { application/json: { schema: { $ref: '#/components/schemas/SyncBootstrapResponse' } } } }
  /sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      parameters: [ { name: cursor, in: query, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullResponse' } } } }
        '410': { description: 'CURSOR_EXPIRED: the cursor cannot be continued (ahead of the feed, older than 30 days, or taken before the server widened what the device may hold, e.g. ADR-038 in 1.20.1). Call GET /sync/bootstrap; keep the outbox.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushRequest' } } } }
      responses:
        '200': { description: Per-item results, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } } }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }, { name: unread, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } }, nextCursor: { type: [string, 'null'] }, unreadCount: { type: integer } } } } } }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: readNotification
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: OK }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: readAllNotifications
      responses:
        '204': { description: OK }
  /broadcasts:
    get:
      tags: [notifications]
      operationId: listBroadcasts
      description: 'Holders of notification.broadcast see what they sent or what went to their branches; everyone else sees broadcasts addressed to them. Newest first.'
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Broadcast' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [notifications]
      operationId: createBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title, body], properties: { branchIds: { type: array, items: { type: string } }, roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, title: { $ref: '#/components/schemas/I18nText' }, body: { $ref: '#/components/schemas/I18nText' }, requireAck: { type: boolean } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Broadcast' } } } }
  /broadcasts/{id}/recipients:
    get:
      tags: [notifications]
      operationId: listBroadcastRecipients
      description: 'notification.broadcast (1.12.0), same scope as the sender''s list (else 404). Everyone it went to and whether they read it; not read first.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BroadcastRecipients' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /broadcasts/{id}/ack:
    post:
      tags: [notifications]
      operationId: ackBroadcast
      description: 'A recipient read it ("পড়েছি"). Idempotent; the first time counts. Offline phones use the sync mutation `broadcast_ack` (1.12.0).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }

  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      description: '1.45.0: `from` / `to` (inclusive Asia/Dhaka business dates) narrow the items to those raised on those days; `counts` follow the same dates. Without them, unchanged.'
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: status, in: query, schema: { type: string, enum: [open, snoozed, resolved], default: open } }, { name: type, in: query, schema: { type: string } }, { $ref: '#/components/parameters/FromDate' }, { $ref: '#/components/parameters/ToDate' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }, counts: { type: object, additionalProperties: { type: integer } }, nextCursor: { type: [string, 'null'] } } } } } }
  /activity:
    get:
      tags: [inbox]
      operationId: listActivity
      description: |
        activity.view (1.28.0, FR-ACT-001; module `activity`, flag `module.activity`). Staff activity in the caller's branch scope, newest first: collections taken, visits recorded, promises made, map pins set or proposed by staff. Each line names the person and the customer.
        `unseen` counts the lines since the caller last called POST /activity/seen (capped at 99), whatever the filters; `items[].unseen` marks them. Lines are kept 45 days; the records themselves stay in their modules.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { name: type, in: query, schema: { type: string, enum: [collection, visit, promise, pin, collection_withdrawn, collection_edited, deposit_deleted] } }
        - { name: userId, in: query, schema: { type: string }, description: 'Only what this staff member did' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityFeed' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /activity/seen:
    post:
      tags: [inbox]
      operationId: markActivitySeen
      description: 'activity.view (1.28.0). The caller has looked at the feed; `unseen` starts again from now. Per user, idempotent.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [seenAt, unseen], properties: { seenAt: { type: string, format: date-time }, unseen: { type: integer } } } } } }
  /inbox/{id}/resolve:
    post:
      tags: [inbox]
      operationId: resolveInbox
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
  /inbox/{id}/snooze:
    post:
      tags: [inbox]
      operationId: snoozeInbox
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until], properties: { until: { type: string, format: date-time } } } } } }
      responses:
        '200': { description: OK }

  /dashboard/overview:
    get:
      tags: [reports]
      operationId: dashboardOverview
      description: |
        report.view, branch scope (an out-of-scope branchId is 404). The fields up to `trend7d` are unchanged.
        1.45.0 (FR-DSH-002): one call carries what the admin home page needs. `from` / `to` (inclusive Asia/Dhaka business
        dates, at most 366 days, `to` today or earlier; default: first day of the month of `date` … `date`) set the range of
        the series, method split, outcome split, promise rates, top staff, co-work and prospects figures; "today",
        "this month", "previous month" and the now-figures (cash in hand, attendance today, pins waiting) do not depend on it.
        Every number carries a `link` { path, query }: the list endpoint (path under /api/v1) and the query parameters
        that list exactly the rows behind the number, so the client can open the list with one click. Sections of
        switched-off modules come back as zeros or empty arrays. Field staff see only their own figures (scope).
        Nothing here is an official ERP balance (cached ERP values carry erpFetchedAt in `erp`).
        1.48.0: `requestStats` (module.requests): requests not resolved or closed, by the queue they wait in now, and the
        important ones; not limited by the range. Each links to GET /requests in the caller's request scope.
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: date, in: query, schema: { type: string, format: date } }, { name: from, in: query, schema: { type: string, format: date }, description: 'Added in 1.45.0' }, { name: to, in: query, schema: { type: string, format: date }, description: 'Added in 1.45.0' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardOverview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /search:
    get:
      tags: [customers]
      operationId: globalSearch
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }, { name: types, in: query, schema: { type: string, example: 'customer,user,receipt' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SearchResult' } } } } }
  /reports/staff-performance:
    get:
      tags: [reports]
      operationId: staffPerformance
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: period, in: query, required: true, schema: { type: string, enum: [daily, monthly] } }, { name: date, in: query, required: true, schema: { type: string, description: 'YYYY-MM-DD or YYYY-MM' } }, { name: userId, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffPerformanceRow' } } } } }
  /reports/branch-trends:
    get:
      tags: [reports]
      operationId: branchTrends
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }, { name: granularity, in: query, schema: { type: string, enum: [day, week, month], default: day } } ]
      description: 'At most 366 days, ending today or earlier. Weeks start on Saturday. (Response schema declared in 1.6.0.)'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTrends' } } } }
  /reports/reconciliation:
    get:
      tags: [reports]
      operationId: reconciliation
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      description: 'FOS collections of one business date against the field payments the ERP reported (cached copy; see erpFetchedAt). (Response schema declared in 1.6.0.)'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationReport' } } } }
  /reports/me/performance:
    get:
      tags: [reports]
      operationId: myPerformance
      description: |
        The caller's own performance for a month, with targets and one row per day (1.10.0, FR-REP-005, FR-M-021). Self-service, online.
        `rank` is filled only when the leaderboard is visible to staff (setting reports.leaderboardVisibleToStaff) and ranks by collected.
      parameters: [ { name: month, in: query, required: true, schema: { type: string, description: 'YYYY-MM, this month or earlier' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyPerformance' } } } }
  /reports/leaderboard:
    get:
      tags: [reports]
      operationId: leaderboard
      description: |
        Field staff ranked for a day or a month (1.10.0, FR-REP-005). Managers with report.view always see it for any branch in scope.
        Field staff see their own branch only, and only when setting reports.leaderboardVisibleToStaff is true (default false, OD-15); otherwise 403 FORBIDDEN.
        Rules: a person needs at least reports.leaderboardMinPresentDays present days in the period (default 1) to be ranked; others follow with rank null.
        Equal values share a rank (1, 2, 2, 4) and are ordered by name. target_achievement ranks amount achieved ÷ amount target; people without a target are not ranked for it.
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: period, in: query, required: true, schema: { type: string, enum: [day, month] } }, { name: date, in: query, schema: { type: string, description: 'YYYY-MM-DD for day, YYYY-MM for month; default the current one' } }, { name: metric, in: query, schema: { type: string, enum: [collected, visit_credit, promises_kept, target_achievement], default: collected } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Leaderboard' } } } }
  /reports/collection-board:
    get:
      tags: [reports]
      operationId: collectionBoard
      description: |
        Who collected the most money that the ERP has accepted (1.26.0, FR-REP-007, ADR-045), for a month or for all time. Field collection amounts with status posted or resolved_posted only; money still pending in the ERP is never counted. Not a balance.
        Everyone who collected is on it whatever their role (a manager or an admin is ranked by collections alone); active field staff with nothing posted are listed with rank null.
        Access as the leaderboard: report.view, or setting reports.leaderboardVisibleToStaff true for the caller's own branch; otherwise 403 FORBIDDEN.
        With setting reports.leaderboardScope = all (default) the board covers every branch for everyone who may open it; with branch a person sees the branches of their own scope (field staff: their home branch) and another branchId answers 404.
        Equal amounts share a rank (1, 2, 2, 4).
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [month, all] } }
        - { name: month, in: query, schema: { type: string, example: 2026-11, description: 'Only with period=month; default the current month. A future month answers 400.' } }
        - { $ref: '#/components/parameters/BranchId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionBoard' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/data-quality:
    get:
      tags: [reports]
      operationId: dataQuality
      description: |
        Customer data problems per branch, one count per issue (1.10.0, FR-CUS-009). Active ERP customers only; a customer can have several issues.
        Issues: no_location, invalid_location (0,0 or outside Bangladesh), suspect_swapped (lat/lng look swapped), far_from_branch (pin more than
        setting reports.dataQualityMaxBranchKm, default 30 km, from the branch), missing_phone, invalid_phone (not an 11-digit Bangladesh mobile),
        shared_phone (same number on another customer of the branch), plan_without_schedule (an open plan with no installment schedule),
        unassigned (no field staff). Permission report.view.
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualitySummary' } } } }
  /reports/data-quality/items:
    get:
      tags: [reports]
      operationId: dataQualityItems
      description: 'Customers with one issue, paged (1.10.0). Permission report.view.'
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: issue, in: query, required: true, schema: { $ref: '#/components/schemas/DataQualityIssue' } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DataQualityItem' } }, nextCursor: { type: [string, 'null'] } } } } } }
  /reports/exports:
    post:
      tags: [reports]
      operationId: createExport
      description: |
        Async export, built by the worker within about a minute, kept 7 days, visible only to the requester (1.6.0 documents params).
        `params` per type: staff_performance → { period, date, branchId?, userId? } · collections → { from, to, branchId? } (≤ 92 days) ·
        attendance → { from, to, branchId? } (≤ 62 days) · overdue_customers, cash_positions → { branchId? } ·
        audit → { from, to, branchId? } (≤ 31 days; also needs `audit.view`, else 403) (1.7.1) · data_quality → { branchId?, issue? } (1.10.0).
        `format: pdf` (1.10.0): A4 landscape PDF with the Bangla font embedded (Noto Sans Bengali, shaped with HarfBuzz) and the table header repeated on every page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type, format], properties: { type: { type: string, enum: [staff_performance, collections, attendance, overdue_customers, cash_positions, audit, data_quality] }, format: { type: string, enum: [csv, xlsx, pdf] }, params: { type: object, additionalProperties: true }, locale: { type: string, enum: [bn, en] } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string } } } } } }
  /reports/exports/{id}:
    get:
      tags: [reports]
      operationId: getExport
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string, enum: [queued, running, ready, failed] }, downloadUrl: { type: string } } } } } }
  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      description: |
        audit.view, branch scope (super admin and area manager: every branch). Newest first. Every filter combines with AND.
        1.48.0 (FR-AUD-003): `from` / `to` also take an inclusive Asia/Dhaka business date (YYYY-MM-DD): `from` = 00:00 Dhaka
        of that date, `to` = the end of that Dhaka day. A date-time is still read as an exact instant (unchanged).
        A value that is neither, or `from` after `to`, is 400 VALIDATION_FAILED.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { anyOf: [ { type: string, format: date-time }, { type: string, format: date } ] }, description: 'Inclusive. A date-time, or (1.48.0) an Asia/Dhaka business date = from 00:00 Dhaka' }
        - { name: to, in: query, schema: { anyOf: [ { type: string, format: date-time }, { type: string, format: date } ] }, description: 'Inclusive. A date-time, or (1.48.0) an Asia/Dhaka business date = to the end of that Dhaka day' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, nextCursor: { type: [string, 'null'] } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    trackingToken: { type: http, scheme: tracking, description: '1.49.0 (ADR-067): `Authorization: Tracking <token>` from POST /location/tracking-token. Accepted only by POST /location/points.' }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    BranchId: { name: branchId, in: query, schema: { type: string } }
    FromDate: { name: from, in: query, schema: { type: string, format: date }, description: 'Inclusive Asia/Dhaka business date (YYYY-MM-DD). Added to GET /inbox and GET /activity in 1.45.0; a value after `to` is 400' }
    ToDate: { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive Asia/Dhaka business date (YYYY-MM-DD). Added to GET /inbox and GET /activity in 1.45.0' }
    PayStateFilter: { name: payState, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/PayState' } }, description: 'Added in 1.14.0 (FR-CUS-012). Pin colours, combined with OR; other parameters narrow with AND' }
    InvoiceKind: { name: invoiceKind, in: query, schema: { type: string, enum: [installment, credit] }, description: 'Added in 1.14.0 (FR-CUS-013). Only customers with an open (balance due, not returned or cancelled) invoice of this kind. Cash invoices (1.44.0) are never open, so there is no `cash` value' }
    PaidThisMonth: { name: paidThisMonth, in: query, schema: { type: string, enum: [yes, no] }, description: 'Added in 1.29.0 (FR-CUS-019). `yes` = paid something in the current Asia/Dhaka month: an ERP payment dated this month (removed ones left out; since 1.53.0 also payments to a returned invoice, FR-CUS-024) or a field collection of this month still waiting for the ERP; `no` = neither. The same two sources as the row''s `activity.paidPoisha` / `activity.pendingPoisha`, so the filter agrees with the row''s money mark. Narrows with AND like the other parameters' }
    Limit: { name: limit, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, schema: { type: string } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    TrackingToken:
      type: object
      required: [token, expiresAt]
      description: 1.49.0 (ADR-067). Opaque; store it where the native service can read it; never log it.
      properties:
        token: { type: string, description: 'Opaque, starts with `trk_`. Send as `Authorization: Tracking <token>`' }
        expiresAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [status, code, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: VALIDATION_FAILED }
        detail: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    AccountLockedDetails:
      type: object
      description: '`details` of 423 ACCOUNT_LOCKED on POST /auth/login. `until` since 1.0; the rest added in 1.47.0.'
      required: [until]
      properties:
        until: { type: string, format: date-time, description: When the lock ends (UTC) }
        retryAfterSec: { type: integer, minimum: 1, description: 'Added in 1.47.0. Seconds until `until`; same as the Retry-After header' }
        scope:
          type: string
          enum: [account, ip]
          description: 'Added in 1.47.0. `account`: 5 wrong passwords for this phone/username; `ip`: too many failures from this network and this device or browser has never had a session of the user (ADR-064)'
    DeviceNotApprovedDetails:
      type: object
      description: '`details` of 403 DEVICE_NOT_APPROVED on POST /auth/login (added in 1.47.0, FR-AUTH-007). The request is a pending device; retrying the login does not create another.'
      required: [pendingDeviceId, deviceId, status]
      properties:
        pendingDeviceId: { type: string, description: 'The pending Device `id`: what an admin approves (POST /devices/{id}/approve) and the request id the app shows' }
        deviceId: { type: string, description: The X-Device-Id that was sent }
        status: { type: string, enum: [pending_approval] }
        maxActiveDevices: { type: integer, description: 'Setting devices.maxPerUser' }
    I18nText:
      type: object
      properties: { bn: { type: string }, en: { type: string } }
    Reason:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 5 } }
    Decision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string }
    Role: { type: string, enum: [super_admin, area_manager, branch_manager, field_staff, viewer], description: 'area_manager added in 1.48.0 (ADR-065): every branch, no user / role / password / flag / settings management. Clients must show an unknown role as its raw key, never fail.' }
    GeoFix:
      type: object
      required: [lat, lng, accuracyM]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number }
        mock: { type: boolean, default: false }
        fixAt: { type: string, format: date-time }
    GeoUnavailableReason: { type: string, enum: [permission_denied, location_off, timeout, no_fix], description: 'Why geo is null (1.2.0)' }
    TileProvider:
      type: object
      properties:
        id: { type: string, example: provider-a }
        urlTemplate: { type: string, example: 'https://tiles.example.com/{z}/{x}/{y}.png?key={key}' }
        attribution: { type: string, example: '© OpenStreetMap contributors' }
        maxZoom: { type: integer, example: 19 }
        subdomains: { type: array, items: { type: string } }
        apiKeyRef: { type: string, description: 'Public, domain/app-restricted key, if provider needs one' }
    LoginRequest:
      type: object
      required: [password, client]
      properties:
        phone: { type: string, example: '01712345678' }
        username: { type: string }
        password: { type: string }
        client: { type: string, enum: [app, web] }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, description: 'App only; web uses cookie' }
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string } }
        flags: { type: object, additionalProperties: { type: boolean } }
        attendanceRequired: { $ref: '#/components/schemas/AttendanceRequired' }
        serverTime: { type: string, format: date-time }
    AttendanceRequired:
      type: boolean
      description: |
        Added in 1.45.0 (FR-ATT-014). True when this user must do attendance (work-in/out, breaks): they hold
        `attendance.record` and not `attendance.exempt`. The staff app hides attendance (and does not hold location
        or work for a work-in) when false. Super admins hold `attendance.exempt` by default; an admin can grant or deny
        it per user or branch like any permission. Exempt users are never counted absent, late or present in
        attendance days, counts and reports.
    User:
      type: object
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        employeeCode: { type: string }
        erpEmployeeId: { type: [string, 'null'] }
        shiftId: { type: [string, 'null'] }
        cashLimitPoisha: { type: [integer, 'null'] }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        locale: { type: string, enum: [bn, en] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    UserCreate:
      type: object
      required: [name, phone, role, branchIds, employeeCode]
      properties:
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, minItems: 1, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        employeeCode: { type: string }
        erpEmployeeId: { type: string }
        shiftId: { type: string }
        cashLimitPoisha: { type: integer }
    UserUpdate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, minItems: 1, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        shiftId: { type: string }
        cashLimitPoisha: { type: integer }
        erpEmployeeId: { type: [string, 'null'], description: 'Documented in 1.13.0 (already accepted). Links the user to an ERP employee (GET /system/erp-employees); null unlinks' }
        reason: { type: string }
    UserPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: [string, 'null'] }
    Session:
      type: object
      properties: { id: { type: string }, client: { type: string }, deviceId: { type: string }, userAgent: { type: string }, ip: { type: string }, createdAt: { type: string }, lastUsedAt: { type: string }, current: { type: boolean } }
    Device:
      type: object
      properties: { id: { type: string }, deviceId: { type: string }, userId: { type: string }, model: { type: string }, androidVersion: { type: string }, appVersion: { type: string }, boundAt: { type: string }, lastSeenAt: { type: string }, rooted: { type: boolean }, emulator: { type: boolean }, status: { type: string, enum: [active, pending_approval, unbound] }, likelyReinstall: { type: boolean, description: 'Added in 1.47.0. Only on pending_approval rows: same model and Android version as the user''s only active device, which was not seen for devices.reinstallHintIdleDays days (0 = off, then always false). A hint for the admin; the device still needs approval' } }
    PermissionDef:
      type: object
      properties:
        key: { type: string, example: collection.record }
        module: { type: string }
        description: { $ref: '#/components/schemas/I18nText' }
        defaults: { type: object, additionalProperties: { type: boolean }, description: 'Per role key (area_manager since 1.48.0)' }
        reserved: { type: boolean }
        neverFor: { type: array, items: { $ref: '#/components/schemas/Role' }, description: 'Added in 1.48.0 (ADR-065). Roles that never hold this key: no override can grant it to them (user.manage, rbac.manage, flag.manage and settings.manage for area_manager)' }
    OverrideEntry:
      type: object
      description: Added in 1.3.0
      properties: { role: { $ref: '#/components/schemas/Role' }, key: { type: string }, effect: { type: string, enum: [allow, deny] }, reason: { type: string }, setBy: { type: string }, setAt: { type: [string, 'null'], format: date-time } }
    OverrideChange:
      type: object
      required: [key, effect]
      properties:
        key: { type: string }
        effect: { type: string, enum: [allow, deny, inherit] }
    ErpEmployee:
      type: object
      description: Added in 1.13.0
      properties: { erpEmployeeId: { type: string }, code: { type: string }, name: { type: string }, erpBranchIds: { type: array, items: { type: string } }, active: { type: boolean } }
    Branch:
      type: object
      properties: { id: { type: string }, erpBranchId: { type: string }, code: { type: string }, kind: { type: string, enum: [branch, warehouse], description: 'Added in 1.13.0. ERP location type; a warehouse can hold receivables too' }, name: { $ref: '#/components/schemas/I18nText' }, district: { type: string }, address: { type: string }, lat: { type: [number, 'null'] }, lng: { type: [number, 'null'] }, active: { type: boolean } }
    FeatureFlag:
      type: object
      properties: { key: { type: string }, defaultEnabled: { type: boolean }, branchOverrides: { type: array, items: { type: object, properties: { branchId: { type: string }, enabled: { type: boolean } } } }, description: { type: string }, owner: { type: string }, reviewBy: { type: string }, lockedReason: { type: string } }
    HolidayCreate:
      type: object
      required: [date, name]
      properties: { date: { type: string, format: date }, name: { $ref: '#/components/schemas/I18nText' }, branchIds: { type: array, items: { type: string } }, type: { type: string, enum: [national, branch], default: national } }
    Holiday:
      type: object
      description: '`id` since 1.12.0.'
      properties: { id: { type: string }, date: { type: string, format: date }, name: { $ref: '#/components/schemas/I18nText' }, branchIds: { type: array, items: { type: string } }, type: { type: string, enum: [national, branch] } }
    Shift:
      type: object
      description: 'Duty hours. `weeklyOff` may be empty (a branch that works every day). `breakWindows` since 1.25.0.'
      properties:
        id: { type: string }
        name: { type: string }
        start: { type: string, example: '09:00' }
        end: { type: string, example: '18:00' }
        weeklyOff: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: '0 = Sunday … 6 = Saturday' }
        lateGraceMin: { type: integer }
        maxBreakMin: { type: integer }
        breakWindows: { type: array, maxItems: 14, items: { $ref: '#/components/schemas/BreakWindow' } }
    BreakWindow:
      type: object
      description: '1.25.0 (FR-ATT-010). On that weekday, break time between `start` and `end` (Dhaka) is allowed on top of `maxBreakMin` and is never counted as over-break. Example: Friday 12:30–15:30.'
      required: [weekday, start, end]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: '0 = Sunday … 5 = Friday, 6 = Saturday' }
        start: { type: string, example: '12:30' }
        end: { type: string, example: '15:30' }
    ErpStatus:
      type: object
      properties: { mode: { type: string, enum: [live, record_only, mock] }, lastSuccessAt: { type: string }, lagSec: { type: integer }, consecutiveFailures: { type: integer }, circuit: { type: string, enum: [closed, open, half_open] }, outboxPending: { type: integer }, outboxFailed: { type: integer } }
    DeviceSyncState:
      type: object
      properties: { userId: { type: string }, userName: { type: string }, deviceId: { type: string }, lastPullAt: { type: string }, lastPushAt: { type: string }, pendingReported: { type: integer }, lastError: { type: string }, appVersion: { type: string } }
    CustomerStatus: { type: string, enum: [overdue, due_today, promised_today, paid_up, current, bad_suggested, tagged_bad] }
    PayState:
      type: string
      enum: [bad, missed_many, missed_one, due_today, on_track, paid_off]
      description: |
        Added in 1.14.0 (FR-CUS-012, ADR-035). Payment state, the colour of the customer's map pin, worst first:
        `bad` = tagged bad/legal in FOS, or a plan's full term is over (final due date passed) with money left;
        `missed_many` = two or more missed installments (term not over); `missed_one` = one missed installment;
        `due_today` = an installment falls due today, nothing missed; `on_track` = everything due so far is paid;
        `paid_off` = nothing left to pay. A missed installment is a past-due line with money left, or a line the ERP
        rolled forward while the line that took its balance is still unpaid.
    CustomerLocation:
      type: object
      properties: { lat: { type: [number, 'null'] }, lng: { type: [number, 'null'] }, status: { type: string, enum: [ok, missing, invalid, suspect_swapped, overridden] }, source: { type: string, enum: [erp, overlay] } }
    Tag:
      type: object
      properties: { state: { type: string, enum: [none, pending, tagged] }, severity: { type: string, enum: [watch, bad, legal] }, reasonCode: { type: string }, reason: { type: string }, setBy: { type: string }, setAt: { type: string, format: date-time } }
    TagSummary:
      type: object
      description: |
        Added in 1.52.0 (FR-TAG-009). The part of `Tag` a list needs to draw the bad-tag border: `severity` and
        `reasonCode` are present only when `state` is `tagged`. Red when tagged with severity `bad` or `legal`
        (not `watch`); the colour per reason comes from `reasonCode`. Reason text and author are not included
        (open the customer for those).
      required: [state]
      properties:
        state: { type: string, enum: [none, pending, tagged] }
        severity: { type: string, enum: [watch, bad, legal] }
        reasonCode: { type: string }
    TagEvent:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [change, request, review_requested, decision], description: 'Added in contract 1.1.0' }
        previous: { $ref: '#/components/schemas/Tag' }
        next: { $ref: '#/components/schemas/Tag' }
        reasonCode: { type: string }
        reason: { type: string }
        actor: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string } } }
        source: { type: string, enum: [web, app, system] }
        deviceLocation: { type: object, properties: { lat: { type: number }, lng: { type: number }, accuracyM: { type: number } }, description: 'Added in 1.1.0' }
        approvalOf: { type: string, description: 'For kind=decision: the eventId of the reviewed item. Added in 1.1.0' }
        at: { type: string, format: date-time }
    TagReviewItem:
      type: object
      description: Added in contract 1.1.0
      properties:
        eventId: { type: string }
        kind: { type: string, enum: [approval, balance_cleared] }
        customer: { type: object, properties: { id: { type: string }, code: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, totalOutstandingPoisha: { type: integer }, tag: { $ref: '#/components/schemas/Tag' } } }
        requested: { $ref: '#/components/schemas/Tag' }
        requestedBy: { type: object, properties: { id: { type: string }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
    CustomerListItem:
      type: object
      properties:
        id: { type: string }
        erpCustomerId: { type: string }
        code: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/CustomerLocation' }
        distanceM: { type: [integer, 'null'] }
        totalOutstandingPoisha: { type: integer }
        nextDueDate: { type: [string, 'null'], format: date }
        daysOverdue: { type: integer }
        badges: { type: array, items: { $ref: '#/components/schemas/CustomerStatus' } }
        tag: { $ref: '#/components/schemas/Tag' }
        openPromise: { oneOf: [ { $ref: '#/components/schemas/Promise' }, { type: 'null' } ], description: 'The open promise with the earliest date. Since 1.44.0 it carries `createdByName` / `ownerName` here too, so the home list can say "promised by <name>"' }
        lastVisitAt: { type: [string, 'null'], format: date-time }
        lastVisitByName: { type: [string, 'null'], description: 'Added in 1.44.0 (FR-CUS-021). Display name of who made the visit at `lastVisitAt` (any month); null when there is none' }
        pendingFieldPoisha: { type: integer, description: 'Field collections not yet posted to ERP' }
        installmentPoisha: { type: [integer, 'null'], description: 'Amount of the next unpaid schedule line across active plans (ERP cache). Added in 1.2.0' }
        overduePoisha: { type: integer, description: 'Sum of overdue unpaid schedule amounts (ERP cache). Added in 1.2.0' }
        areaName: { oneOf: [ { $ref: '#/components/schemas/I18nText' }, { type: 'null' } ], description: 'FOS area the customer falls in. Added in 1.2.0' }
        assignee: { type: object, properties: { id: { type: string }, name: { type: string } } }
        branchId: { type: [string, 'null'], description: 'FOS branch of the customer. Added in 1.11.0' }
        branch:
          type: object
          description: |
            Added in 1.19.0 (FR-CUS-015). The customer's branch, so a list that spans several branches can say which
            one each row belongs to. Absent when the customer has no FOS branch.
          properties:
            id: { type: string }
            code: { type: string }
            name: { $ref: '#/components/schemas/I18nText' }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0. Missed installments across open plans' }
        openInvoices:
          type: object
          description: Added in 1.14.0. Open (balance due) invoices by kind
          properties: { installment: { type: integer }, credit: { type: integer } }
        invoiceCount:
          type: object
          description: Added in 1.24.0. Invoices of the customer (cancelled ones not counted) and how many still have a balance
          properties: { total: { type: integer }, open: { type: integer } }
        returnedInvoiceCount: { type: integer, minimum: 0, description: 'Added in 1.53.0 (FR-CUS-024). Invoices of the customer returned in the ERP (not in `invoiceCount`, never counted in any number). 0 when none. Older servers omit it: treat as 0' }
        onlyReturned: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). true when the customer has invoices and every one was returned (`returnedInvoiceCount` > 0 and `invoiceCount.total` = 0). Clients show the "returned product customer" marker and do not open the row; the customer is still listed and GET /customers/{id} still works. Older servers omit it: treat as false' }
        activity: { $ref: '#/components/schemas/CustomerActivity' }
        erpFetchedAt: { type: string, format: date-time }
    CustomerActivity:
      type: object
      description: |
        Added in 1.24.0 (FR-CUS-017). What happened with the customer in the current Asia/Dhaka month, for the row
        markers (visited, paid, promised) and the customer header. `paidPoisha` is ERP money; `pendingPoisha` is field
        money not in the ERP yet. Show the two apart and never add them together.
      required: [month, visitCount, visitedToday, paidPoisha, pendingPoisha, promisesMade, promisesKept, promisesBroken]
      properties:
        month: { type: string, example: '2026-11', description: 'The Dhaka month the numbers are for' }
        visitCount: { type: integer, description: 'Visits recorded this month' }
        visitedToday: { type: boolean }
        lastVisitAt: { type: [string, 'null'], format: date-time, description: 'Last visit of this month' }
        paidPoisha: { type: integer, description: 'ERP payments dated this month (office and field, removed ones left out), from the recent ERP payments. Since 1.53.0 payments to a returned invoice (`Payment.returned`) are left out too, also from `paidBy` and `lastPaidDate`' }
        lastPaidDate: { type: [string, 'null'], format: date, description: 'Date of the newest ERP payment this month' }
        pendingPoisha: { type: integer, description: 'Field collections recorded this month that are not in the ERP yet' }
        promisesMade: { type: integer, description: 'Promises created this month (cancelled ones not counted)' }
        promisesKept: { type: integer, description: 'Promises due this month that were kept, fully or partly' }
        promisesBroken: { type: integer, description: 'Promises due this month that were broken' }
        visitedBy:
          type: array
          description: 'Added in 1.44.0 (FR-CUS-021). Who made this month''s visits: one entry per staff member, newest visit first. `count` adds up to `visitCount`. Empty when nobody visited'
          items: { $ref: '#/components/schemas/ActivityPerson' }
        paidBy:
          type: array
          description: |
            Added in 1.44.0 (FR-CUS-021). Who took this month's money, newest first, one entry per person and kind.
            ERP payments (`pending: false`) are the same payments as `paidPoisha` and add up to it; field money not in the
            ERP yet (`pending: true`) is the same money as `pendingPoisha` and adds up to that. Never add the two kinds
            together. The name: the FOS staff member who collected it (`source: staff`, with `userId`), else the ERP
            employee recorded as referrer on an office/ERP payment (`erp_referrer`), else the collector name the payment
            was posted with when there was no ERP employee (`collector_name`), else `unknown` with an empty name (an
            office payment the ERP has no name for).
          items: { $ref: '#/components/schemas/ActivityPayer' }
        promisedBy:
          type: array
          description: 'Added in 1.44.0 (FR-CUS-021). Who made this month''s promises (cancelled ones left out): one entry per staff member, newest first. `count` adds up to `promisesMade`. For the open promise on the home list use `openPromise.createdByName`'
          items: { $ref: '#/components/schemas/ActivityPerson' }
        lastVisitByName: { type: [string, 'null'], description: 'Added in 1.44.0 (FR-CUS-021). Who made this month''s last visit (`visitedBy[0].name`); null when nobody visited this month' }
        lastPaidByName: { type: [string, 'null'], description: 'Added in 1.44.0 (FR-CUS-021). Who took this month''s newest money (`paidBy[0].name`: the staff collector, else the ERP referrer, else the posted collector name; an ERP payment comes before field money of the same day); null when nothing was paid this month or the ERP has no name' }
    ActivityPerson:
      type: object
      description: Added in 1.44.0 (FR-CUS-021). One staff member's part of a customer's month (visits or promises)
      required: [userId, name, count, lastAt]
      properties:
        userId: { type: string }
        name: { type: string, description: 'Display name of the staff member (empty if the user no longer exists)' }
        count: { type: integer }
        lastAt: { type: string, format: date-time, description: 'The newest visit check-in / promise creation of this person this month' }
    ActivityPayer:
      type: object
      description: Added in 1.44.0 (FR-CUS-021). Who took part of a customer's money this month; see `CustomerActivity.paidBy`
      required: [name, source, amountPoisha, lastDate, pending]
      properties:
        name: { type: string }
        source: { type: string, enum: [staff, erp_referrer, collector_name, unknown], description: 'Where `name` comes from; unknown values are possible later' }
        userId: { type: string, description: 'The FOS staff user, only when `source` is `staff`' }
        amountPoisha: { type: integer }
        lastDate: { type: string, format: date, description: 'Newest payment date (ERP) or business date (field) of this entry' }
        pending: { type: boolean, description: 'true = field money recorded in FOS and not in the ERP yet' }
    CustomerPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerListItem' } }
        nextCursor: { type: [string, 'null'], description: 'Next page after this one (also when the page was asked with `offset`); null on the last page' }
        total: { type: integer, minimum: 0, description: 'Only with includeTotal=true; exact since 1.46.0' }
        invoiceTotals:
          type: object
          description: 'Added in 1.24.0 (FR-CUS-018), only with includeTotal=true. Invoices of every customer the query matches (not one page): all, with a balance, and those by kind'
          properties: { total: { type: integer }, open: { type: integer }, installmentOpen: { type: integer }, creditOpen: { type: integer } }
    Plan:
      type: object
      description: |
        One collectable ERP receivable. Since 1.13.0 this is documented as one ERP invoice
        (installment or credit sale); `erpPlanId` is the invoice id (ADR-033).
        Since 1.53.0 the same shape is used for `CustomerDetail.returnedPlans` (invoices returned in the ERP), with
        `returned: true`, `collectable: false` and `payments`; those are shown, never counted.
      properties:
        erpPlanId: { type: string }
        product: { type: string }
        startDate: { type: string, format: date }
        finalDueDate: { type: string, format: date }
        installmentCount: { type: integer }
        totalPayablePoisha: { type: integer }
        downPaymentPoisha: { type: integer }
        paidPoisha: { type: integer }
        outstandingPoisha: { type: integer }
        status: { type: string, enum: [active, completed, closed, defaulted, cancelled], description: '`closed` = not collectable in the field (e.g. a cash sale with money left, a draft, or an invoice the ERP marks not collectable); closed and cancelled plans are not collectable and not counted in totals. Since 1.50.0 (FR-CUS-023) invoices returned in the ERP are not in `CustomerDetail.plans`; since 1.53.0 they are in `CustomerDetail.returnedPlans` with status `closed` and `returned: true`. The meaning of each value is unchanged' }
        badSuggested: { type: boolean }
        schedule:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              dueDate: { type: string, format: date }
              amountPoisha: { type: integer, description: 'Due amount including any late fee' }
              paidPoisha: { type: integer }
              status: { type: string, enum: [paid, partial, due, overdue, upcoming] }
              estimated: { type: boolean }
              lateFeePoisha: { type: integer, description: 'Added in 1.13.0. Late fee included in amountPoisha' }
              rolled: { type: boolean, description: 'Added in 1.13.0. The ERP moved this line''s balance to a later line (amount 0). Apps hide it' }
              outstandingPoisha: { type: integer, description: 'Added in 1.14.0. Left to pay on this line' }
              paidOn: { type: string, format: date, description: 'Added in 1.14.0. Date of the payment that finished the line (ERP allocations). Absent when unpaid or not known' }
              daysLate: { type: integer, description: 'Added in 1.14.0. Days after the due date it was paid (paid lines) or is still unpaid (overdue lines); 0 otherwise' }
              missed: { type: boolean, description: 'Added in 1.14.0. A missed installment not made up yet (see PayState)' }
              writtenOffPoisha: { type: integer, description: 'Added in 1.14.0. Part of paidPoisha the office wrote off (not cash)' }
              payments:
                type: array
                description: Added in 1.14.0. ERP payments that went to this line, oldest first. Absent when the ERP does not send them
                items:
                  type: object
                  properties:
                    erpPaymentId: { type: string }
                    date: { type: string, format: date }
                    amountPoisha: { type: integer, description: 'Part of the payment that went to this line' }
                    receiptNo: { type: string }
        kind: { type: string, enum: [installment, credit, cash], description: 'Added in 1.13.0. Credit = pay-later sale with one due date. `cash` (1.44.0, ADR-057) = a cash sale, pulled when `erp.customerScope` is `all`: no schedule, `completed` when paid, otherwise `closed`; never due, overdue, open or collectable. Treat unknown values like `cash`' }
        invoiceNo: { type: string, description: 'Added in 1.13.0. ERP invoice number' }
        saleDate: { type: string, format: date, description: 'Added in 1.13.0' }
        frequency: { type: string, enum: [monthly, weekly, daily, custom], description: 'Added in 1.13.0. Installment plans only' }
        customDays: { type: integer, description: 'Added in 1.13.0. Days between lines when frequency is custom' }
        items:
          type: array
          description: Added in 1.13.0. Products on the invoice
          items:
            type: object
            properties:
              name: { type: string }
              model: { type: [string, 'null'] }
              qty: { type: integer }
              serials: { type: array, items: { type: string } }
              unitPricePoisha: { type: integer, description: 'Added in 1.14.0' }
              discountPoisha: { type: integer, description: 'Added in 1.14.0. Line discount' }
              serviceChargePoisha: { type: integer, description: 'Added in 1.14.0' }
              lineTotalPoisha: { type: integer, description: 'Added in 1.14.0' }
        guarantor:
          type: object
          description: Added in 1.13.0. Guarantor of this plan (never an ID number)
          properties: { name: { type: string }, phone: { type: string }, phones: { type: array, items: { type: string } }, address: { type: string } }
        writtenOffPoisha: { type: integer, description: 'Added in 1.13.0. Amount the office wrote off (already out of outstanding)' }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0. Missed installments on this plan' }
        daysOverdue: { type: integer, description: 'Added in 1.14.0. Days since the oldest missed installment' }
        nextDueDate: { type: string, format: date, description: 'Added in 1.14.0. Next date with money due (today or later)' }
        nextDuePoisha: { type: integer, description: 'Added in 1.14.0. Left to pay on that date' }
        branchId: { type: string, description: 'Added in 1.14.0. FOS branch the invoice was sold at' }
        financedPoisha: { type: integer, description: 'Added in 1.14.0. Installment invoices: total minus down payment' }
        subtotalPoisha: { type: integer, description: 'Added in 1.14.0. Invoice subtotal (before invoice discount and tax)' }
        discountPoisha: { type: integer, description: 'Added in 1.14.0. Invoice discount' }
        taxPoisha: { type: integer, description: 'Added in 1.14.0' }
        settlementDiscountPoisha: { type: integer, description: 'Added in 1.14.0. Discounts given with payments (count as paid in the ERP)' }
        refundedPoisha: { type: integer, description: 'Added in 1.14.0. Cash refunded for returns' }
        invoiceStatus: { type: string, description: 'Added in 1.14.0. ERP invoice status as stored (active, posted, returned, ...)' }
        paymentStatus: { type: string, description: 'Added in 1.14.0. ERP payment status (unpaid, partial, paid)' }
        creditDueDate: { type: string, format: date, description: 'Added in 1.14.0. Credit sales: the due date' }
        penalty: { type: object, description: 'Added in 1.14.0. Installment invoices: ERP late-fee setting', properties: { enabled: { type: boolean }, rate: { type: string } } }
        returned: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). true on `CustomerDetail.returnedPlans` items: the invoice was returned in the ERP. Absent on `plans` items' }
        collectable: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). false on `CustomerDetail.returnedPlans` items: nothing can be collected on it and it is in no total. Absent on `plans` items (use `status` as before)' }
        payments:
          type: array
          description: 'Added in 1.53.0 (FR-CUS-024). Returned invoices only: the ERP payments posted against this invoice, each with `returned: true` (the cached recent payments, then payments known only from schedule allocations, summed per payment). Shown, never counted. `schedule` of a returned invoice is empty, as for every closed invoice'
          items: { $ref: '#/components/schemas/Payment' }
    Payment:
      type: object
      properties:
        erpPaymentId: { type: string }
        date: { type: string, format: date }
        amountPoisha: { type: integer }
        method: { type: string }
        source: { type: string, enum: [office, field] }
        receiptNo: { type: string, description: 'ERP payment number (PAY-YYYYMMDD-NNNNN)' }
        reversed: { type: boolean, description: 'The office removed this payment in the ERP' }
        erpPlanId: { type: string, description: 'Added in 1.13.0. Plan (invoice) the payment went to' }
        methodLabel: { type: string, description: 'Added in 1.13.0. ERP payment method name, e.g. Cash-03' }
        collectorName: { type: string, description: 'Added in 1.13.0. ERP employee recorded as collector' }
        referrerName: { type: [string, 'null'], description: 'Added in 1.44.0. Name of the ERP referrer employee of the payment; null when the payment has no ERP employee (posted by name, ADR-049, or an office payment without a referrer)' }
        advance: { type: boolean, description: 'Added in 1.13.0. Down-payment advance' }
        discountPoisha: { type: integer, description: 'Added in 1.13.0. Settlement discount given with the payment' }
        returned: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). true when the payment went to an invoice returned in the ERP (`erpPlanId` is a returned invoice). Shown (in `payments`, on the returned invoice and in the timeline), but never counted: not in `activity.paidPoisha` / `paidBy`, the paid-this-month filter or promise evaluation. Absent otherwise; a payment without `erpPlanId` is never marked' }
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerListItem'
        - type: object
          properties:
            phones: { type: array, items: { type: string }, description: 'ERP numbers first (ERP order), then the numbers added in FOS (1.23.0). Indexes of ERP numbers do not change' }
            phoneDetails: { type: array, items: { $ref: '#/components/schemas/PhoneDetail' }, description: 'Added in 1.23.0. The same numbers in the same order, with where each came from' }
            guarantor: { type: object, properties: { name: { type: string }, phone: { type: string } } }
            detailedAddress: { type: string, description: 'Added in 1.13.0. ERP detailed address' }
            directions: { type: string, description: 'Added in 1.13.0. How to find the house (ERP location instructions)' }
            erpRisk:
              type: object
              description: Added in 1.13.0. ERP customer risk snapshot, read-only, shown next to FOS tags
              properties:
                grade: { type: [string, 'null'] }
                level: { type: [string, 'null'] }
                classification: { type: [string, 'null'] }
                overdueCount: { type: integer }
                maxDaysLate: { type: integer }
                computedAt: { type: [string, 'null'] }
            plans: { type: array, items: { $ref: '#/components/schemas/Plan' }, description: 'Every counted invoice of the customer, complete (replace the stored list, do not merge). Since 1.50.0 (FR-CUS-023) invoices returned in the ERP are never in this list (see `returnedPlans`, 1.53.0)' }
            returnedPlanIds: { type: array, items: { type: string }, description: 'Added in 1.50.0 (FR-CUS-023, ADR-068). erpPlanIds of the customer''s invoices that were returned in the ERP (since 1.53.0 the same ids as `returnedPlans`). They are never in `plans`; a 1.50–1.52 client deletes stored plans with these ids. A 1.53 client may ignore it. Empty when none. Older servers omit it' }
            returnedPlans: { type: array, items: { $ref: '#/components/schemas/Plan' }, description: 'Added in 1.53.0 (FR-CUS-024, ADR-071). The customer''s invoices returned in the ERP, complete (replace the stored list): `Plan` with `returned: true`, `collectable: false`, status `closed`, empty `schedule` and their `payments`. Show them marked as returned; never count them (they are in no total, count, pay state, KPI or collectable list). Empty when none. Older servers omit it' }
            payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
            pendingCollections: { type: array, items: { $ref: '#/components/schemas/Collection' } }
            badSuggestion: { type: [object, 'null'], properties: { erpPlanId: { type: string }, finalDueDate: { type: string }, outstandingPoisha: { type: integer }, text: { $ref: '#/components/schemas/I18nText' } } }
            recentNotes: { type: array, items: { $ref: '#/components/schemas/Note' } }
            lastVisit: { oneOf: [ { $ref: '#/components/schemas/Visit' }, { type: 'null' } ] }
            recentPromises: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/Promise' }, description: 'Added in 1.45.0 (FR-PRM-006). The customer''s last 20 promises, newest first, with followUpOf / followUpId / attempt, so the chain original → broken → follow-up → kept/broken can be drawn. Present when module.promises is on' }
            version: { type: integer }
    MapPin:
      type: object
      properties:
        id: { type: string }
        lat: { type: number }
        lng: { type: number }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        name: { type: string }
        outstandingPoisha: { type: integer }
        tagged: { type: boolean }
        tag: { $ref: '#/components/schemas/TagSummary' }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0' }
        returnedInvoiceCount: { type: integer, minimum: 0, description: 'Added in 1.53.0 (FR-CUS-024). See CustomerListItem.returnedInvoiceCount' }
        onlyReturned: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). See CustomerListItem.onlyReturned (draw the returned marker; do not open the customer from the pin)' }
    SearchResult:
      type: object
      description: One GET /search hit (schema named in 1.52.0; the fields before `tag` are unchanged).
      properties:
        type: { type: string, description: 'customer, user or receipt' }
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        tag: { $ref: '#/components/schemas/TagSummary', description: 'Added in 1.52.0. Customer items only (`type: customer`); absent on user and receipt items and from older servers' }
        returnedInvoiceCount: { type: integer, minimum: 0, description: 'Added in 1.53.0 (FR-CUS-024). Customer items only. See CustomerListItem.returnedInvoiceCount' }
        onlyReturned: { type: boolean, description: 'Added in 1.53.0 (FR-CUS-024). Customer items only. See CustomerListItem.onlyReturned (a hit found by a returned invoice number shows the marker and is not opened)' }
    TimelineItem:
      type: object
      properties:
        kind: { type: string, enum: [erp_payment, collection, visit, note, promise, tag, handover, assignment, location_correction, attendance, stop] }
        at: { type: string, format: date-time }
        actor: { type: object, properties: { id: { type: string }, name: { type: string } } }
        summary: { $ref: '#/components/schemas/I18nText' }
        refId: { type: string }
        data: { type: object, additionalProperties: true, description: 'Kind-specific. `erp_payment`: receiptNo, method, reversed, erpPlanId (1.53.0) and `returned: true` (1.53.0, FR-CUS-024) when the payment went to a returned invoice (the summary says so too)' }
    PaymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, bank_transfer, other_mobile] }
    CollectionStatus: { type: string, enum: [received, posting, posted, conflict, posting_failed, resolved_posted, resolved_refund, resolved_voided, voided] }
    CollectionCreate:
      type: object
      required: [clientId, customerId, amountPoisha, method, receiptNo, recordedAt, geo]
      properties:
        clientId: { type: string, format: uuid }
        customerId: { type: string }
        erpPlanId: { type: string }
        amountPoisha: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionRef: { type: string }
        payerName: { type: string }
        receiptNo: { type: string, example: BRL01-FS014-261115-0007 }
        physicalReceiptNo: { type: string }
        recordedAt: { type: string, format: date-time }
        deviceTime: { type: string, format: date-time }
        geo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'null when no GPS fix could be taken (1.2.0); send geoUnavailableReason' }
        geoUnavailableReason: { $ref: '#/components/schemas/GeoUnavailableReason' }
        visitClientId: { type: string }
        photoMediaId: { type: string }
        note: { type: string, maxLength: 500 }
    Collection:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }
        erpPlanId: { type: string }
        collector: { type: object, properties: { id: { type: string }, name: { type: string } } }
        amountPoisha: { type: integer }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionRef: { type: [string, 'null'] }
        receiptNo: { type: string }
        erpReceiptNo: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/CollectionStatus' }
        conflict:
          type: [object, 'null']
          description: |
            `code` is one of PLAN_SETTLED, AMOUNT_EXCEEDS_OUTSTANDING, PLAN_NOT_FOUND, CUSTOMER_INACTIVE, PERIOD_LOCKED,
            ERP_VALIDATION, GAVE_UP and, since 1.13.0, PLAN_CLOSED (invoice returned/cancelled in the ERP),
            DUPLICATE_SAME_DAY (the ERP already has a payment on that invoice that day), METHOD_NOT_AVAILABLE
            (no ERP payment method of that kind at the branch), COLLECTOR_NOT_LINKED (staff user has no ERP employee).
            Show `message` (bn/en); unknown codes are possible.
          properties: { code: { type: string }, message: { $ref: '#/components/schemas/I18nText' }, raisedAt: { type: string } }
        resolution: { type: [object, 'null'], properties: { action: { type: string }, by: { type: string }, at: { type: string }, reason: { type: string } } }
        voided:
          type: object
          description: 'Present when status is `voided` (documented 1.33.0, FR-COL-017). `kind` = `withdrawn` (the collector deleted their own cash collection, FR-COL-016) or `admin` (an office user voided it); rows voided before 1.33.0 are classified by who did it (the collector = withdrawn).'
          properties:
            by: { type: string }
            byName: { type: string, description: 'Display name of `by` (1.33.0)' }
            at: { type: string, format: date-time }
            reason: { type: string }
            kind: { type: string, enum: [withdrawn, admin], description: '1.33.0' }
        edited:
          type: object
          description: 'Present once the collector has corrected the amount, note or payer with PATCH /collections/{id} (1.33.0, FR-COL-017). `previousAmountPoisha` is the amount before the FIRST edit; `at`/`by` are the latest edit.'
          properties:
            count: { type: integer }
            at: { type: string, format: date-time }
            by: { type: string }
            byName: { type: string }
            previousAmountPoisha: { type: integer }
        flags: { type: array, items: { type: string, enum: [far_from_pin, mock_location, clock_skew, late_sync, duplicate_txn_ref, not_in_scope_at_record_time, no_location] } }
        distanceToPinM: { type: [integer, 'null'] }
        depositId: { type: [string, 'null'], description: '1.35.0 (FR-CASH-010): the deposit that handed it in. Until then the collection is in the collector''s hand, is not in the ERP and may be edited or withdrawn; from then on it goes to the ERP and cannot be changed.' }
        depositedAt: { type: [string, 'null'], format: date-time, description: '1.35.0' }
        cashOnHand: { $ref: '#/components/schemas/CashPosition' }
    CashPosition:
      type: object
      properties:
        userId: { type: string }
        userName: { type: string }
        onHandPoisha: { type: integer }
        limitPoisha: { type: integer }
        state: { type: string, enum: [ok, warning, exceeded] }
        oldestUndepositedAt: { type: [string, 'null'], format: date-time }
        pendingDepositsPoisha: { type: integer }
        todayCashPoisha: { type: integer }
        todayMobilePoisha: { type: integer }
    CashInHand:
      type: object
      description: '1.27.0 (FR-CASH-007). Deposits (pending and verified) pay off cash collections oldest-first; what is left is the cash in hand, listed newest first. `onHandPoisha` equals the position''s and covers every item, also when more than 200 exist (`count` > `items.length`). Field-system cash, not an ERP balance.'
      required: [userId, userName, onHandPoisha, pendingDepositsPoisha, count, items, generatedAt]
      properties:
        userId: { type: string }
        userName: { type: string }
        onHandPoisha: { type: integer }
        pendingDepositsPoisha: { type: integer }
        count: { type: integer, description: 'Collections with cash still in hand' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CashInHandItem' } }
        generatedAt: { type: string, format: date-time }
    CashInHandItem:
      type: object
      required: [collectionId, receiptNo, recordedAt, businessDate, customer, erpPlanId, amountPoisha, inHandPoisha, status]
      properties:
        collectionId: { type: string }
        receiptNo: { type: string }
        recordedAt: { type: string, format: date-time }
        businessDate: { type: string, format: date }
        customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }
        erpPlanId: { type: string, description: 'The invoice (ERP plan) the money was collected for' }
        amountPoisha: { type: integer, description: 'The whole collection' }
        inHandPoisha: { type: integer, description: 'The part not yet covered by a deposit; less than amountPoisha for the one collection a deposit covers only partly' }
        status: { $ref: '#/components/schemas/CollectionStatus' }
        promise: { oneOf: [ { $ref: '#/components/schemas/CollectionPromise' }, { type: 'null' } ], description: 'Added in 1.30.0 (FR-CASH-008). The promise this money was collected against, or null when none covered that day' }
    CollectionPromise:
      type: object
      description: '1.30.0 (FR-CASH-008). The promise a collection was made against: same customer and invoice (a promise without an invoice covers any), made on or before the collection''s business date and not yet past its promised date plus the branch''s grace on that day; the newest when several match. `status` is how the promise stands now (kept / partly kept / broken are decided by ERP money, FR-PRM-003); `onTime` = collected on or before the promised date.'
      required: [id, promisedDate, promisedAmountPoisha, status, onTime]
      properties:
        id: { type: string }
        promisedDate: { type: string, format: date }
        promisedAmountPoisha: { type: integer }
        status: { type: string, enum: [open, kept, partially_kept, broken] }
        onTime: { type: boolean }
    DepositCoverage:
      type: object
      description: '1.30.0 (FR-CASH-008). 1.35.0: a `submitted` deposit lists every collection it handed in (cash and the rest, each whole, with `method`, `status` and `erpReceiptNo`). A deposit from before 1.35.0: which cash collections it covered, oldest first; the first and the last may be covered only in part (`coveredPoisha` < `amountPoisha`). `unmatchedPoisha` is deposit money with no collection behind it (a collection voided after the deposit). Field-system cash, not an ERP balance.'
      required: [deposit, coveredPoisha, unmatchedPoisha, items, generatedAt]
      properties:
        deposit: { $ref: '#/components/schemas/Deposit' }
        coveredPoisha: { type: integer }
        unmatchedPoisha: { type: integer }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CashInHandItem'
              - type: object
                required: [coveredPoisha]
                properties:
                  coveredPoisha: { type: integer, description: 'The part of this collection this deposit covered' }
                  method: { $ref: '#/components/schemas/PaymentMethod' }
                  erpReceiptNo: { type: [string, 'null'], description: '1.35.0: the ERP payment number once posted' }
        generatedAt: { type: string, format: date-time }
    DepositCreate:
      type: object
      required: [clientId, amountPoisha, destination, depositedAt]
      properties:
        clientId: { type: string, format: uuid }
        amountPoisha: { type: integer, minimum: 0, description: '1.35.0 (FR-CASH-010): must equal all the cash in hand (422 BUSINESS_RULE DEPOSIT_MUST_BE_ALL / DEPOSIT_EXCEEDS_ON_HAND, details.onHandPoisha); 0 when only mobile banking, bank or card collections are handed in (nothing at all: NOTHING_TO_DEPOSIT). Before 1.35.0 minimum 1 and any part of it.' }
        destination: { type: string, enum: [branch_cashier, bank, manager] }
        reference: { type: string }
        slipMediaId: { type: string }
        depositedAt: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoFix' }
    Deposit:
      allOf:
        - $ref: '#/components/schemas/DepositCreate'
        - type: object
          properties: { id: { type: string }, userId: { type: string }, userName: { type: string, description: 'Depositor display name (1.3.0)' }, status: { type: string, enum: [pending, verified, rejected, deleted, submitted], description: '`submitted` (1.35.0, FR-CASH-010): every deposit made from 1.35.0 on; final, the collections it took go to the ERP, nobody verifies, rejects or deletes it. `pending`, `verified`, `rejected`, `deleted` (1.32.0) are deposits from before 1.35.0.' }, collectionCount: { type: integer, description: '1.35.0: collections it handed in (cash and the rest); absent on deposits from before 1.35.0' }, nonCashPoisha: { type: integer, description: '1.35.0: mobile banking, bank and card money it handed in (not part of amountPoisha)' }, nonCashCount: { type: integer, description: '1.35.0' }, verifiedBy: { type: string }, verifiedAt: { type: string }, rejectReason: { type: string }, deletedBy: { type: string, description: '1.32.0' }, deletedAt: { type: string, description: '1.32.0' }, deleteReason: { type: string, description: '1.32.0' } }
    Area:
      type: object
      properties: { id: { type: string }, branchId: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string }, kind: { type: string, enum: [polygon, codes] }, polygon: { type: object, description: GeoJSON Polygon }, erpAreaCodes: { type: array, items: { type: string } }, color: { type: string }, customerCount: { type: integer }, assignees: { type: array, items: { type: string } }, active: { type: boolean }, version: { type: integer } }
    Assignment:
      type: object
      properties: { id: { type: string }, userId: { type: string }, type: { type: string, enum: [area, customer] }, areaId: { type: string }, customerId: { type: string }, effectiveFrom: { type: string }, effectiveTo: { type: [string, 'null'] }, source: { type: string } }
    HandoverStatus: { type: string, enum: [pending_acceptance, accepted, rejected, cancelled, expired, reverted] }
    HandoverCreate:
      type: object
      required: [fromUserId, toUserId, reason]
      properties:
        fromUserId: { type: string }
        toUserId: { type: string }
        areaIds: { type: array, items: { type: string } }
        customerIds: { type: array, items: { type: string } }
        reason: { type: string }
        effectiveDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'Temporary cover; auto-revert' }
    Handover:
      allOf:
        - $ref: '#/components/schemas/HandoverCreate'
        - type: object
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/HandoverStatus' }
            createdBy: { type: string }
            createdAt: { type: string }
            expiresAt: { type: string }
            summary: { type: object, properties: { customers: { type: integer }, outstandingPoisha: { type: integer }, overdue: { type: integer }, openPromises: { type: integer }, openConflicts: { type: integer } } }
    VisitOutcome: { type: string, enum: [paid, partial_paid, promised, not_home, refused, shifted_address, customer_dead, product_returned_request, runaway, other], description: 'runaway (1.41.0, FR-VIS-006) = the customer has absconded and cannot be found (bn পলাতক). Clients must show an unknown value as its raw code, never fail.' }
    VisitCreate:
      type: object
      required: [clientId, customerId, checkInAt, geo, outcome]
      properties:
        clientId: { type: string, format: uuid }
        customerId: { type: string }
        checkInAt: { type: string, format: date-time }
        deviceTime: { type: string, format: date-time }
        outcome: { $ref: '#/components/schemas/VisitOutcome' }
        geo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'null when no GPS fix could be taken (1.2.0); send geoUnavailableReason' }
        geoUnavailableReason: { $ref: '#/components/schemas/GeoUnavailableReason' }
        photoMediaIds: { type: array, items: { type: string } }
        source: { type: string, enum: [manual, suggested] }
        coWorkSessionId: { type: string, description: 'Set when the visit was made together with co-work partners (1.9.0). The server works out who took part.' }
    Visit:
      allOf:
        - $ref: '#/components/schemas/VisitCreate'
        - type: object
          properties: { id: { type: string }, userId: { type: string }, userName: { type: string, description: 'Display name of userId, so any staff of the branch can say who visited (1.31.0, FR-ACT-002)' }, checkOutAt: { type: [string, 'null'] }, distanceToPinM: { type: [integer, 'null'] }, flags: { type: array, items: { type: string } }, coWork: { oneOf: [ { $ref: '#/components/schemas/VisitCoWork' }, { type: 'null' } ], description: 'null for a single visit (1.9.0)' } }
    VisitCoWork:
      type: object
      description: 'Who else took part in a co-work visit: the session members accepted at checkInAt, without the recorder (1.9.0)'
      properties: { sessionId: { type: string }, participantIds: { type: array, items: { type: string } }, participants: { type: array, description: 'Names, on list rows only', items: { type: object, properties: { id: { type: string }, name: { type: string } } } } }
    CoworkColleague:
      type: object
      required: [id, name, employeeCode, onDutyToday, inSession]
      properties:
        id: { type: string }
        name: { type: string, description: 'Plain display name, like other person names in v1' }
        employeeCode: { type: string }
        onDutyToday: { type: boolean, description: 'Worked in and not yet worked out at the time of the call; on a break counts as on duty' }
        inSession: { type: boolean, description: 'Already an accepted member of another open session today (accepting an invitation would give ALREADY_IN_SESSION)' }
    CoworkMember:
      type: object
      properties: { userId: { type: string }, name: { type: string }, status: { type: string, enum: [invited, accepted, rejected, left] }, invitedBy: { type: string }, invitedAt: { type: string, format: date-time }, respondedAt: { type: [string, 'null'] }, leftAt: { type: [string, 'null'] } }
    CoworkSession:
      type: object
      description: 'Staff working together for one business day (1.9.0)'
      required: [id, businessDate, status, members]
      properties:
        id: { type: string }
        businessDate: { type: string, format: date }
        branchId: { type: string }
        status: { type: string, enum: [open, ended] }
        createdBy: { type: string }
        note: { type: [string, 'null'] }
        members: { type: array, items: { $ref: '#/components/schemas/CoworkMember' } }
        createdAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'] }
        endedBy: { type: object, description: 'The office user who ended the session (1.34.0, FR-CW-006); absent when it ended by itself (people left, the day was over)', properties: { id: { type: string }, name: { type: string } } }
        endReason: { type: [string, 'null'], description: "The office user's reason (1.34.0); present with endedBy" }
        visitsCount: { type: integer, description: 'Co-work visits recorded in this session (manager list and detail only)' }
    PlaceIcon: { type: string, enum: [shop, market, mosque, school, bank, hospital, bus_stop, office, landmark, other], description: '1.38.0. A short fixed list; the clients draw their own symbol for each.' }
    PlaceLocation:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number, minimum: -90, maximum: 90 }, lng: { type: number, minimum: -180, maximum: 180 } }
    PlacePerson:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    PlaceCreate:
      type: object
      required: [clientId, name, icon, location]
      properties:
        clientId: { type: string, format: uuid, description: 'Made on the device; the same clientId again is a replay' }
        name: { type: string, minLength: 1, maxLength: 60, description: 'The text shown next to the marker' }
        icon: { $ref: '#/components/schemas/PlaceIcon' }
        note: { type: string, maxLength: 200 }
        location: { $ref: '#/components/schemas/PlaceLocation' }
        branchId: { type: string, deprecated: true, description: '1.42.0 (ADR-054): ignored; a place belongs to no branch. Kept so older clients stay valid.' }
    PlaceUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        icon: { $ref: '#/components/schemas/PlaceIcon' }
        note: { type: [string, 'null'], maxLength: 200 }
        location: { $ref: '#/components/schemas/PlaceLocation', description: 'Direct move; needs place.manage' }
    PlaceMoveRequestCreate:
      type: object
      required: [clientId, location]
      properties:
        clientId: { type: string, format: uuid }
        location: { $ref: '#/components/schemas/PlaceLocation' }
        reason: { type: string, maxLength: 200, description: 'Why it should move (shown to the office)' }
    PlacePendingMove:
      type: object
      required: [location, requestedBy, requestedAt, reason, distanceM]
      properties:
        location: { $ref: '#/components/schemas/PlaceLocation' }
        requestedBy: { $ref: '#/components/schemas/PlacePerson' }
        requestedAt: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
        distanceM: { type: integer, description: 'How far the marker would move' }
    PlaceMoveDecision:
      type: object
      required: [decision, by, at, reason, requestedBy]
      properties:
        decision: { type: string, enum: [approve, reject] }
        by: { $ref: '#/components/schemas/PlacePerson' }
        at: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
        requestedBy: { $ref: '#/components/schemas/PlacePerson' }
    PlaceEvent:
      type: object
      required: [type, by, at]
      properties:
        type: { type: string, enum: [created, edited, moved, move_requested, move_approved, move_rejected, deleted] }
        by: { $ref: '#/components/schemas/PlacePerson' }
        at: { type: string, format: date-time }
        note: { type: [string, 'null'] }
        from: { oneOf: [ { $ref: '#/components/schemas/PlaceLocation' }, { type: 'null' } ] }
        to: { oneOf: [ { $ref: '#/components/schemas/PlaceLocation' }, { type: 'null' } ] }
    Place:
      type: object
      description: 'A text marker on the map (1.38.0, FR-PLC-001). Sync entity `place`, sent to every device of every branch (1.42.0, ADR-054). Not linked to a customer and not a tracking point.'
      required: [id, clientId, branchId, name, icon, note, location, status, version, pendingMove, lastMoveDecision, createdBy, updatedBy, createdAt, updatedAt, events]
      properties:
        id: { type: string }
        clientId: { type: [string, 'null'], description: 'The creator''s clientId, so the creating device can match its offline row' }
        branchId: { type: string, description: 'Informational (1.42.0, ADR-054): the first branch of the person who added it, empty when they have none. Not a scope: every branch sees every place.' }
        name: { type: string }
        icon: { $ref: '#/components/schemas/PlaceIcon' }
        note: { type: [string, 'null'] }
        location: { $ref: '#/components/schemas/PlaceLocation' }
        status: { type: string, enum: [active, deleted] }
        version: { type: integer, description: 'Goes up by one on every change; send it as If-Match: W/"<version>"' }
        pendingMove: { oneOf: [ { $ref: '#/components/schemas/PlacePendingMove' }, { type: 'null' } ] }
        lastMoveDecision: { oneOf: [ { $ref: '#/components/schemas/PlaceMoveDecision' }, { type: 'null' } ], description: 'The latest approve or reject, so the requester sees the reason' }
        createdBy: { $ref: '#/components/schemas/PlacePerson' }
        updatedBy: { $ref: '#/components/schemas/PlacePerson' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
        deleteReason: { type: [string, 'null'] }
        events: { type: array, description: 'History, newest last, at most the latest 50', items: { $ref: '#/components/schemas/PlaceEvent' } }
    TaskStatus: { type: string, enum: [open, resolve_requested, resolved, cancelled], description: '1.20.0. open → resolve_requested (staff) → resolved (admin verifies) or back to open (admin rejects with a reason); cancelled by an admin.' }
    TaskCounts:
      type: object
      required: [open, resolve_requested, resolved, cancelled, overdue]
      properties: { open: { type: integer }, resolve_requested: { type: integer }, resolved: { type: integer }, cancelled: { type: integer }, overdue: { type: integer } }
    TaskPerson:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    TaskCreate:
      type: object
      required: [assigneeId, title]
      properties:
        clientId: { type: string, format: uuid }
        assigneeId: { type: string }
        branchId: { type: string }
        title: { type: string, minLength: 1, maxLength: 120 }
        note: { type: string, minLength: 1, maxLength: 2000 }
        dueDate: { type: string, format: date, description: 'Dhaka date, today or later' }
    TaskEvent:
      type: object
      required: [type, by, at]
      properties:
        type: { type: string, enum: [created, edited, resolve_requested, verified, rejected, cancelled] }
        by: { $ref: '#/components/schemas/TaskPerson' }
        at: { type: string, format: date-time }
        note: { type: [string, 'null'] }
    Task:
      type: object
      description: 'A free-form job an admin gave to one field staff member (1.20.0). Sync entity `task`, sent only to the assignee.'
      required: [id, branchId, assignee, createdBy, title, status, overdue, events, createdAt, updatedAt]
      properties:
        id: { type: string }
        branchId: { type: string }
        assignee: { type: object, required: [id, name, employeeCode], properties: { id: { type: string }, name: { type: string }, employeeCode: { type: string } } }
        createdBy: { $ref: '#/components/schemas/TaskPerson' }
        title: { type: string }
        note: { type: [string, 'null'] }
        dueDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/TaskStatus' }
        overdue: { type: boolean, description: 'Unfinished and the due date has passed' }
        resolveNote: { type: [string, 'null'], description: 'What the staff member wrote with the latest resolve request' }
        resolveRequestedAt: { type: [string, 'null'], format: date-time }
        decisionNote: { type: [string, 'null'], description: 'The admin note or reason of the latest verify, reject or cancel' }
        decidedBy: { oneOf: [ { $ref: '#/components/schemas/TaskPerson' }, { type: 'null' } ] }
        decidedAt: { type: [string, 'null'], format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/TaskEvent' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Note:
      type: object
      properties: { id: { type: string }, clientId: { type: string }, customerId: { type: string }, author: { type: object, properties: { id: { type: string }, name: { type: string } } }, category: { type: string }, text: { type: string }, voiceMediaId: { type: [string, 'null'] }, createdAt: { type: string, format: date-time }, editableUntil: { type: string, format: date-time } }
    PromiseStatus: { type: string, enum: [open, kept, partially_kept, broken, superseded, cancelled] }
    PromiseCreate:
      type: object
      required: [clientId, customerId, promisedDate, promisedAmountPoisha]
      properties:
        clientId: { type: string, format: uuid }
        customerId: { type: string }
        erpPlanId: { type: string }
        promisedDate: { type: string, format: date }
        promisedAmountPoisha: { type: integer, minimum: 1 }
        note: { type: string }
        followUpOf: { type: [string, 'null'], description: 'Added in 1.45.0 (FR-PRM-006). Id of the broken or partially kept promise this one follows up (same customer). Omit for a first promise' }
    Promise:
      allOf:
        - $ref: '#/components/schemas/PromiseCreate'
        - type: object
          properties:
            id: { type: string }
            ownerId: { type: string }
            ownerName: { type: string, description: 'Display name of ownerId, the customer''s assignee (1.31.0)' }
            createdBy: { type: string, description: 'The staff member who made the promise (1.31.0); equals ownerId on promises older than 1.31.0' }
            createdByName: { type: string, description: 'Display name of createdBy (1.31.0, FR-ACT-002)' }
            status: { $ref: '#/components/schemas/PromiseStatus' }
            paidTowardsPoisha: { type: integer }
            createdAt: { type: string }
            followUpOf: { type: [string, 'null'], description: 'Added in 1.45.0. The promise this one follows up; null for a first promise' }
            followUpId: { type: [string, 'null'], description: 'Added in 1.45.0. The newest follow-up of this promise that is not cancelled; null when nobody followed it up' }
            attempt: { type: integer, minimum: 1, description: 'Added in 1.45.0. 1 for a first promise, 2 for its follow-up, 3 for the follow-up of that, …' }
            chainRootId: { type: string, description: 'Added in 1.45.0. Id of the first promise of the chain (its own id for a first promise); GET /promises?customerId= returns the whole chain' }
            closedAt: { type: [string, 'null'], format: date-time, description: 'Added in 1.45.0. When the promise was kept, broken, superseded or cancelled' }
    VisitListItem:
      description: 'Visit plus display refs, returned by GET /visits (1.4.0)'
      allOf:
        - $ref: '#/components/schemas/Visit'
        - type: object
          properties:
            customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }
            user: { type: object, properties: { id: { type: string }, name: { type: string } } }
            businessDate: { type: string, format: date, description: 'Added in 1.45.0. Asia/Dhaka business date of checkInAt (the day filters `date` / `from` / `to` use)' }
            checkInLocalTime: { type: string, pattern: '^\d{2}:\d{2}$', description: 'Added in 1.45.0. Asia/Dhaka wall-clock time of checkInAt, HH:mm (24 h), so a table can show date and time without converting' }
    PromiseListItem:
      description: 'Promise plus display refs, returned by GET /promises (1.4.0)'
      allOf:
        - $ref: '#/components/schemas/Promise'
        - type: object
          properties: { customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }, owner: { type: object, properties: { id: { type: string }, name: { type: string } } } }
    OwnLocationProposal:
      type: object
      description: A pin proposal as seen by the staff member who made it (1.7.0)
      required: [id, clientId, customerId, status, lat, lng]
      properties:
        id: { type: string }
        clientId: { type: string, description: 'The clientId the app sent, to match its local record' }
        customerId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        lat: { type: number }
        lng: { type: number }
        accuracyM: { type: number }
        note: { type: [string, 'null'] }
        decisionReason: { type: [string, 'null'], description: "The manager's reason; always present when rejected" }
        createdAt: { type: string }
        decidedAt: { type: [string, 'null'] }
        method: { type: string, enum: [gps, map], description: 'Added in 1.11.0' }
        autoApplied: { type: boolean, description: 'Applied without a manager because the customer had no pin (1.11.0)' }
        proposer: { type: object, description: 'Who proposed or set the pin (1.31.0, FR-ACT-002)', properties: { id: { type: string }, name: { type: string } } }
        decider: { oneOf: [ { type: object, properties: { id: { type: string }, name: { type: string } } }, { type: 'null' } ], description: 'Who approved or rejected it; null while pending or when it applied at once (1.31.0)' }
        direct: { type: boolean, description: 'Set directly by a manager (1.31.0). Since 1.31.0 the sync entity location_proposal reaches every device of the branch, not only the proposer: match proposer.id with the signed-in user to find your own' }
    LocationProposal:
      type: object
      properties:
        id: { type: string }
        customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string }, current: { type: [object, 'null'], description: 'Current pin, if any' } } }
        lat: { type: number }
        lng: { type: number }
        accuracyM: { type: number, description: 'GPS accuracy of a gps proposal; 0 for a map pin; absent for a pin a manager set directly' }
        photoMediaId: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        proposedBy: { type: string }
        proposer: { type: object, properties: { id: { type: string }, name: { type: string } } }
        status: { type: string, enum: [pending, approved, rejected] }
        method: { type: string, enum: [gps, map], description: 'How the point was chosen (1.11.0)' }
        deviceDistanceM: { type: [integer, 'null'], description: 'Metres between a map pin and where the phone was when it was picked (1.11.0)' }
        deviceMock: { type: boolean, description: 'The phone reported a mock location when the map pin was picked (1.11.0)' }
        autoApplied: { type: boolean, description: 'Staff pin applied at once because the customer had no pin (1.11.0)' }
        direct: { type: boolean, description: 'Set directly by a manager with POST /customers/{id}/location (1.11.0)' }
        decider: { oneOf: [ { type: object, properties: { id: { type: string }, name: { type: string } } }, { type: 'null' } ], description: 'Who approved/rejected or set it (1.11.0)' }
        decidedAt: { type: [string, 'null'], format: date-time, description: 'Added in 1.11.0' }
        createdAt: { type: string, format: date-time }
    PinResult:
      type: object
      description: 'Answer to a staff pin (1.11.0 declares it; the shape is unchanged since 1.0.0)'
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, rejected], description: '`approved` when it was applied at once' }
        direct: { type: boolean, description: 'Added in 1.39.0. true = applied at once because the caller may approve pins in that branch (no manager step); the app says "Pin updated" instead of "Sent for approval"' }
    PhoneDetail:
      type: object
      description: Added in 1.23.0. One phone number of a customer and where it came from
      required: [number, source, primary]
      properties:
        number: { type: string, example: '01711000001' }
        source: { type: string, enum: [erp, field], description: 'erp = sent by the office system; field = added in the app or the admin panel' }
