openapi: 3.1.0
info:
  title: Howlader Field Operations API
  version: 1.38.0
  description: |
    Contract owned by field-api. Consumers (admin-web, staff-app) generate types from this file.
    Conventions (auth, pagination, idempotency, errors) are described in docs/05-api-contract.md.
    Money is integer poisha. Times are UTC ISO-8601; business dates are YYYY-MM-DD in Asia/Dhaka.
servers:
  - url: https://api.example.com/api/v1
    description: Production (domain TBD)
  - url: http://localhost:4000/api/v1
    description: Local
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: users
  - name: rbac
  - name: system
  - name: customers
  - name: tags
  - name: collections
  - name: cash
  - name: assignments
  - name: handovers
  - name: visits
  - name: notes
  - name: promises
  - name: media
  - name: attendance
  - name: location
  - name: sync
  - name: notifications
  - name: inbox
  - name: reports
  - name: targets
  - name: tasks
  - name: places
  - name: audit

paths:
  /auth/login:
    post:
      tags: [auth]
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '423': { $ref: '#/components/responses/Problem' }
        '426': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      operationId: refresh
      description: App sends refreshToken in body; admin-web relies on the fos_rt HttpOnly cookie.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Logged out }
  /auth/password/change:
    post:
      tags: [auth]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Changed }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/me:
    get:
      tags: [auth]
      operationId: me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  permissions: { type: array, items: { type: string } }
                  flags: { type: object, additionalProperties: { type: boolean } }
  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      parameters:
        - { name: userId, in: query, schema: { type: string }, description: 'Requires device.manage when not self' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Session' } } } } }
  /auth/sessions/{id}:
    delete:
      tags: [auth]
      operationId: revokeSession
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Revoked }

  /meta/app-config:
    get:
      tags: [system]
      security: []
      operationId: appConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  minAppVersion: { type: string, example: 1.0.0 }
                  latestAppVersion: { type: string }
                  storeUrl: { type: string }
                  killSwitch: { type: boolean }
                  tileProvider: { $ref: '#/components/schemas/TileProvider' }
                  privacyNoticeVersion: { type: string, example: 2026-11-v1 }
                  serverTime: { type: string, format: date-time }
  /system/health:
    get:
      tags: [system]
      security: []
      operationId: health
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok, degraded] }, version: { type: string }, contract: { type: string, description: 'API contract version this build implements; use it to check a deploy (added in 1.20.1)' }, mongo: { type: string }, erp: { type: string }, storage: { type: string, enum: [s3, db, memory], description: 'Added in 1.21.0. Where photos and exports are kept (ADR-039); memory = this instance only, phone uploads fail.' }, cloudStorage: { type: string, enum: [cloudinary, none], description: 'Added in 1.37.0 (ADR-050). cloudinary = CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET are set and photos are copied there.' } } } } } }
  /system/erp-status:
    get:
      tags: [system]
      operationId: erpStatus
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErpStatus' } } } }
  /system/erp-sync:
    post:
      tags: [system]
      operationId: erpSync
      description: |
        Added in 1.17.0 (owner request 2026-11-18). The admin panel's "Sync from ERP" button: pulls the customers
        that changed in the ERP since the last sync (all of them on the first run) into FOS now, instead of waiting for
        the 5-minute job. Permission `erp.sync` (super admin and branch manager by default). One run at a time.
        A call stops after about 40 s and answers `partial: true`; the caller calls again until it is `false`
        (the next call continues where the last one stopped). Never changes money; the ERP stays the truth.
        `429 RATE_LIMITED` (`details.reason: SYNC_RUNNING`) while another run is in progress; `503 ERP_UNAVAILABLE`
        when the ERP cannot be reached.
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ErpSyncResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /system/erp-employees:
    get:
      tags: [system]
      operationId: listErpEmployees
      description: |
        Added in 1.13.0. ERP employees, read live from the ERP, to link a staff user (`erpEmployeeId`).
        The ERP requires a collector employee on every payment; an unlinked collector gets the
        `COLLECTOR_NOT_LINKED` conflict. 503 `ERP_UNAVAILABLE` when the ERP cannot be reached.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ErpEmployee' } }
        '503': { $ref: '#/components/responses/Problem' }
  /system/sync-health:
    get:
      tags: [system]
      operationId: syncHealth
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: Per-device sync state, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/DeviceSyncState' } } } } }

  /users:
    get:
      tags: [users]
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } }
    post:
      tags: [users]
      operationId: createUser
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { user: { $ref: '#/components/schemas/User' }, temporaryPassword: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/Id' } ]
    get:
      tags: [users]
      operationId: getUser
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [users]
      operationId: updateUser
      parameters: [ { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '412': { $ref: '#/components/responses/Problem' }
  /users/{id}/reset-password:
    post:
      tags: [users]
      operationId: resetPassword
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { temporaryPassword: { type: string } } } } } }
  /users/{id}/deactivate:
    post:
      tags: [users]
      operationId: deactivateUser
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Problem' }
  /users/{id}/activate:
    post:
      tags: [users]
      operationId: activateUser
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }
  /devices:
    get:
      tags: [users]
      operationId: listDevices
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Device' } } } } }
  /devices/{id}/unbind:
    post:
      tags: [users]
      operationId: unbindDevice
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
  /devices/{id}/approve:
    post:
      tags: [users]
      operationId: approveDevice
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }
  /devices/push-token:
    post:
      tags: [notifications]
      operationId: registerPushToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [deviceId, fcmToken], properties: { deviceId: { type: string }, fcmToken: { type: string } } }
      responses:
        '204': { description: Registered }

  /rbac/permissions:
    get:
      tags: [rbac]
      operationId: permissionCatalog
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PermissionDef' } } } } }
  /rbac/users/{userId}/effective:
    get:
      tags: [rbac]
      operationId: effectivePermissions
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    allowed: { type: boolean }
                    source: { type: string, enum: [role, branch, user, super_admin, reserved] }
  /rbac/overrides/branch/{branchId}:
    get:
      tags: [rbac]
      operationId: getBranchOverrides
      description: Current exceptions of a branch for all roles. Added in 1.3.0.
      parameters: [ { name: branchId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { branchId: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/OverrideEntry' } } } } } } }
    put:
      tags: [rbac]
      operationId: setBranchOverrides
      parameters: [ { name: branchId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, changes, reason]
              properties:
                role: { $ref: '#/components/schemas/Role' }
                changes: { type: array, items: { $ref: '#/components/schemas/OverrideChange' } }
                reason: { type: string, minLength: 5 }
      responses:
        '200': { description: OK }
  /rbac/overrides/user/{userId}:
    get:
      tags: [rbac]
      operationId: getUserOverrides
      description: Added in 1.3.0.
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { userId: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/OverrideEntry' } } } } } } }
    put:
      tags: [rbac]
      operationId: setUserOverrides
      parameters: [ { name: userId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, reason]
              properties:
                changes: { type: array, items: { $ref: '#/components/schemas/OverrideChange' } }
                reason: { type: string, minLength: 5 }
      responses:
        '200': { description: OK }

  /branches:
    get:
      tags: [system]
      operationId: listBranches
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Branch' } } } } }
  /branches/{id}/location:
    put:
      tags: [system]
      operationId: setBranchLocation
      description: |
        Added in 1.13.0. The ERP has no branch coordinates, so the map point of a branch is set in FOS
        (used by the data-quality "far from branch" check and map centring). ERP sync never clears it.
        Send `{lat: null, lng: null}` to clear. Must be inside Bangladesh (422 `BUSINESS_RULE`).
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties: { lat: { type: [number, 'null'] }, lng: { type: [number, 'null'] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Branch' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /settings:
    get:
      tags: [system]
      operationId: getSettings
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    patch:
      tags: [system]
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes, reason]
              properties:
                branchId: { type: string }
                changes: { type: object, additionalProperties: true }
                reason: { type: string }
      responses:
        '200': { description: OK }
  /feature-flags/effective:
    get:
      tags: [flags]
      operationId: effectiveFlagsForBranch
      description: Effective flag values for one branch (override, else default). Lets a super admin see a branch-level OFF. Added in 1.3.0.
      parameters: [ { name: branchId, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { branchId: { type: string }, flags: { type: object, additionalProperties: { type: boolean } } } } } } }
  /feature-flags:
    get:
      tags: [system]
      operationId: listFlags
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FeatureFlag' } } } } }
  /feature-flags/{key}:
    put:
      tags: [system]
      operationId: setFlag
      parameters: [ { name: key, in: path, required: true, schema: { type: string, example: module.collections } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                defaultEnabled: { type: boolean }
                branchOverrides: { type: array, items: { type: object, properties: { branchId: { type: string }, enabled: { type: boolean } } } }
                reason: { type: string }
      responses:
        '200': { description: OK }
        '422': { $ref: '#/components/responses/Problem' }
  /calendar/holidays:
    get:
      tags: [system]
      operationId: listHolidays
      description: 'Any signed-in user. Sorted by date. `branchId` (1.12.0) keeps national holidays and that branch''s own.'
      parameters: [ { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }, { name: branchId, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Holiday' } } } } }
    post:
      tags: [system]
      operationId: createHoliday
      description: 'settings.manage. A `branch` holiday names its branches, a `national` one has none (400 otherwise). The same date for an overlapping set of branches answers 409 INVALID_STATE `HOLIDAY_EXISTS` (1.12.0). Audited.'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HolidayCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Holiday' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /calendar/holidays/{id}:
    delete:
      tags: [system]
      operationId: deleteHoliday
      description: 'settings.manage (1.12.0). Removes a holiday entered by mistake; audited as `holiday.deleted`. Attendance days already finalised are not re-derived.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /shifts:
    get:
      tags: [system]
      operationId: listShifts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Shift' } } } } }
    post:
      tags: [system]
      operationId: createShift
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } }
      responses:
        '201': { description: Created }
  /shifts/{id}:
    patch:
      tags: [system]
      operationId: updateShift
      description: 'Partial update of a shift (declared in 1.5.0; the route already existed)'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } }

  /customers:
    get:
      tags: [customers]
      operationId: listCustomers
      description: |
        Scope (FR-CUS-001, FR-CUS-015): super admin = all; branch manager / viewer = their branches; field staff =
        every customer of their branches (one or more) since 1.19.0, or only the ones assigned to them in a branch whose
        setting `customers.staffVisibility` is `assigned`. `assignedTo=me` gives the caller's own work list.
      parameters:
        - { name: filter, in: query, style: form, explode: false, schema: { type: array, items: { type: string, enum: [overdue, due_today, promised_today, bad_suggested, tagged_bad, no_location, unassigned, paid_up] } } }
        - { name: assignedTo, in: query, schema: { type: string, description: "'me' or a userId" } }
        - $ref: '#/components/parameters/BranchId'
        - { name: areaId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: near, in: query, schema: { type: string, example: '22.7101,90.3705' } }
        - { name: radiusM, in: query, schema: { type: integer, default: 5000 } }
        - { name: sort, in: query, schema: { type: string, enum: [distance, -daysOverdue, name, -totalOutstanding, nextDueDate] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: includeTotal, in: query, schema: { type: boolean, default: false }, description: 'Return `total` (capped at 10,000). Added in 1.1.0' }
        - $ref: '#/components/parameters/PayStateFilter'
        - $ref: '#/components/parameters/InvoiceKind'
        - $ref: '#/components/parameters/PaidThisMonth'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerPage' } } } }
  /customers/map:
    get:
      tags: [customers]
      operationId: customerMap
      parameters:
        - { name: bbox, in: query, required: true, schema: { type: string, example: '90.30,22.65,90.42,22.75' }, description: 'minLng,minLat,maxLng,maxLat' }
        - { name: zoom, in: query, schema: { type: integer } }
        - { name: filter, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/BranchId'
        - $ref: '#/components/parameters/PayStateFilter'
        - $ref: '#/components/parameters/InvoiceKind'
        - $ref: '#/components/parameters/PaidThisMonth'
      responses:
        '200':
          description: Pins (max 2000) or clusters when zoom < 13
          content:
            application/json:
              schema:
                type: object
                properties:
                  pins: { type: array, items: { $ref: '#/components/schemas/MapPin' } }
                  clusters:
                    type: array
                    items:
                      type: object
                      properties:
                        lat: { type: number }
                        lng: { type: number }
                        count: { type: integer }
                        worstStatus: { $ref: '#/components/schemas/CustomerStatus' }
                        worstPayState: { $ref: '#/components/schemas/PayState' }
                        payStates: { type: object, description: 'Added in 1.14.0. Customers per pin colour in this cluster', additionalProperties: { type: integer } }
  /customers/{id}:
    get:
      tags: [customers]
      operationId: getCustomer
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerDetail' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /customers/{id}/timeline:
    get:
      tags: [customers]
      operationId: customerTimeline
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
                  nextCursor: { type: [string, 'null'] }
  /customers/{id}/refresh:
    post:
      tags: [customers]
      operationId: refreshCustomer
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Fresh data, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerDetail' } } } }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /customers/{id}/location-proposals:
    post:
      tags: [customers]
      operationId: proposeLocation
      description: |
        Staff pin for a customer (FR-CUS-008, FR-CUS-011). Idempotent by `clientId` (a replay answers 200 with the stored status).
        `method: gps` (default) proposes the phone's fix: accuracy must be ≤ 30 m and not mock. `method: map` (1.11.0) proposes a point
        picked on the map (Uber style); `geo` is that point (`accuracyM` 0) and `deviceGeo` is where the phone was, if it had a fix.
        Both must be inside Bangladesh. When the customer has no usable pin and the branch setting `customers.staffPinApproval` is
        `when_missing` (default) the pin is applied at once and the answer is `status: approved`; otherwise it waits for a manager
        (`pending`). A mock `deviceGeo` never applies at once.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, geo]
              properties:
                clientId: { type: string, format: uuid }
                geo: { $ref: '#/components/schemas/GeoFix' }
                method: { type: string, enum: [gps, map], default: gps, description: 'Added in 1.11.0' }
                deviceGeo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'Phone position when a map pin was picked. Added in 1.11.0' }
                photoMediaId: { type: string }
                note: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PinResult' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/PinResult' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { description: 'BUSINESS_RULE: LOW_ACCURACY, MOCK_LOCATION (gps only), OUTSIDE_BANGLADESH', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /customers/{id}/location:
    post:
      tags: [customers]
      operationId: setCustomerLocation
      description: |
        1.11.0 (FR-CUS-011): a manager sets the customer's pin directly, usually by dropping it on a map. It becomes the official FOS
        pin at once (overlay over the ERP coordinates), appears in the pin history as an approved item with `direct: true`, is audited
        as `customer.location.set`, reaches the assignee's phone through sync and recomputes polygon areas. Idempotent by `clientId`.
        Pending staff proposals for the customer stay pending. Permission `customer.location.approve`; out of scope → 404.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, lat, lng]
              properties:
                clientId: { type: string, format: uuid }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                method: { type: string, enum: [map, gps], default: map }
                note: { type: string, maxLength: 500, description: 'Why the pin was set or moved (kept in the audit log)' }
      responses:
        '201': { description: Pin set, content: { application/json: { schema: { $ref: '#/components/schemas/SetLocationResult' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/SetLocationResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { description: 'INVALID_STATE CLIENT_ID_REUSED: the clientId belongs to another pin', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'BUSINESS_RULE OUTSIDE_BANGLADESH', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    delete:
      tags: [customers]
      operationId: deleteCustomerLocation
      description: |
        1.17.0 (owner request 2026-11-18): a manager deletes the customer's map pin, whatever its source (ERP, field or
        map). The customer has no pin afterwards (`location.status: missing`, `source: overlay`), so it shows in the
        "no location" list and staff can drop a new pin, which applies at once under the default policy. The ERP
        coordinates are not shown again: the sync keeps the pin deleted until a new pin is set. Audited as
        `customer.location.cleared`, reaches the assignee's phone through sync, recomputes polygon areas. Pending staff
        proposals stay pending. Idempotent: when there is no pin, nothing changes and `removed` is `false`.
        Permission `customer.location.approve`; out of scope → 404.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteLocationResult' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /customers/{id}/phones:
    post:
      tags: [customers]
      operationId: addCustomerPhones
      description: |
        1.23.0 (FR-CUS-016, owner request 2026-11-21): add one to five mobile numbers to a customer in one call. The numbers
        are kept in FOS only: nothing is written to the ERP and the ERP sync never removes them (ADR-042). Each number is
        normalized to `01XXXXXXXXX` (Bangla digits, spaces, dashes and `+880` are accepted). A number the customer already
        has (from the ERP or added before) is skipped as `duplicate`, so repeating a request changes nothing; at most five
        added numbers per customer (`limit`). One invalid number refuses the whole request with 400. Audited as
        `customer.phone.added` (last four digits only), reaches the phones through sync.
        Permission `customer.phone.manage`; out of scope → 404. Offline phones use the sync mutation `customer_phone`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddPhonesRequest' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AddPhonesResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /customers/{id}/phones/{number}:
    delete:
      tags: [customers]
      operationId: removeCustomerPhone
      description: |
        1.23.0 (FR-CUS-016): remove a number that was added in FOS. A number that came from the ERP cannot be removed here
        (422 `PHONE_FROM_ERP`: the office owns it). Idempotent: a number the customer does not have answers `removed: false`.
        Audited as `customer.phone.removed`. Permission `customer.phone.manage`; out of scope → 404.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: number, in: path, required: true, schema: { type: string }, description: 'The mobile number, any accepted spelling' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/RemovePhoneResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { description: 'BUSINESS_RULE PHONE_FROM_ERP', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /location-proposals:
    get:
      tags: [customers]
      operationId: listLocationProposals
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } } ]
      responses:
        '200': { description: 'OK. Plain array, newest first, max 200 (declared in 1.4.0)', content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LocationProposal' } } } } }
  /location-proposals/mine:
    get:
      tags: [customers]
      operationId: listOwnLocationProposals
      description: 'Own pin proposals with their status, newest first, max 200 (1.7.0). Permission customer.location.propose.'
      parameters: [ { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OwnLocationProposal' } } } } }
  /location-proposals/{id}/decision:
    post:
      tags: [customers]
      operationId: decideLocationProposal
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: OK }

  /customers/{id}/tag:
    put:
      tags: [tags]
      operationId: setTag
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, reasonCode, reason]
              properties:
                state: { type: string, enum: [tagged, none] }
                severity: { type: string, enum: [watch, bad, legal] }
                reasonCode: { type: string, enum: [plan_ended_unpaid, repeated_broken_promise, absconded, refused_to_pay, fraud_suspected, cleared, mistake, other] }
                reason: { type: string, minLength: 10 }
                geo: { $ref: '#/components/schemas/GeoFix' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { tag: { $ref: '#/components/schemas/Tag' }, eventId: { type: string } } } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /customers/{id}/tag-history:
    get:
      tags: [tags]
      operationId: tagHistory
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TagEvent' } } } } }
  /tags/review-queue:
    get:
      tags: [tags]
      operationId: tagReviewQueue
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: Pending staff tags and balance-cleared reviews, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/TagReviewItem' } } } } } } }
  /tags/review-queue/{eventId}/decision:
    post:
      tags: [tags]
      operationId: decideTagReview
      parameters: [ { name: eventId, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: OK }

  /collections:
    get:
      tags: [collections]
      operationId: listCollections
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - { name: collectorId, in: query, schema: { type: string } }
        - { name: customerId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CollectionStatus' } }
        - { name: flag, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Collection' } }
                  nextCursor: { type: [string, 'null'] }
                  totals: { type: object, additionalProperties: { type: integer }, description: poisha by method }
    post:
      tags: [collections]
      operationId: createCollection
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        '200': { description: Idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /collections/conflicts:
    get:
      tags: [collections]
      operationId: listConflicts
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Collection' } }, nextCursor: { type: [string, 'null'] } } } } } }
  /collections/{id}:
    get:
      tags: [collections]
      operationId: getCollection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
    patch:
      tags: [collections]
      operationId: editCollection
      description: |
        collection.edit (1.32.0, FR-COL-016). A field staff member changes the amount, note or payer name of their OWN cash collection, until it is deposited: the collection must be cash, status `received`, never sent to the ERP yet, and not covered by any pending or verified deposit (same oldest-first rule as the cash in hand). Managers in scope may edit with the same limits. The pending ERP post is replaced with the new amount (same ERP key, it never reached the ERP). Audited (`collection.edited`, before and after). A repeat with the same values is a no-op. 409 INVALID_STATE reason: NOT_CASH, NOT_EDITABLE (status is not `received`, or the ERP already got an attempt), COVERED_BY_DEPOSIT, POSTING_IN_PROGRESS, STATUS_CHANGED. Another staff member's collection is 404.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountPoisha: { type: integer, minimum: 1 }
                note: { type: [string, 'null'], maxLength: 500 }
                payerName: { type: [string, 'null'], maxLength: 100 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /collections/{id}/withdraw:
    post:
      tags: [collections]
      operationId: withdrawCollection
      description: |
        collection.withdraw (1.32.0, FR-COL-016). A field staff member withdraws (deletes) their OWN cash collection until it is deposited: cash, status `received` or `posting_failed` (not posted to the ERP), not covered by a pending or verified deposit. The row is kept (ADR-018): status becomes `voided` with `voided {by, at, reason}`, the receipt number stays used, and the amount leaves cash in hand and the collected totals. Pending ERP post is cancelled. Audited (`collection.withdrawn`). A repeat by the same person answers 200 with the voided collection. Same 409 reasons as editing, plus USE_RESOLVE (status is `conflict`) and ALREADY_POSTED_OR_CLOSED.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500, description: 'Optional; defaults to a standard text' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /collections/{id}/void:
    post:
      tags: [collections]
      operationId: voidCollection
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Problem' }
  /collections/{id}/resolve:
    post:
      tags: [collections]
      operationId: resolveCollection
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reason]
              properties:
                action: { type: string, enum: [post_to_plan, post_as_advance, retry_post, refund, void] }
                erpPlanId: { type: string }
                proofMediaId: { type: string }
                reason: { type: string, minLength: 5 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
  /receipts/blocks:
    post:
      tags: [collections]
      operationId: allocateReceiptBlock
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [deviceId, businessDate], properties: { deviceId: { type: string }, businessDate: { type: string, format: date }, size: { type: integer, default: 200 } } }
      responses:
        '201': { description: Block, content: { application/json: { schema: { type: object, properties: { prefix: { type: string, example: BRL01-FS014 }, businessDate: { type: string }, from: { type: integer }, to: { type: integer } } } } } }

  /cash/me:
    get:
      tags: [cash]
      operationId: myCash
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CashPosition' } } } }
  /cash/me/collections:
    get:
      tags: [cash]
      operationId: myCashInHand
      description: 'cash.view (1.27.0, FR-CASH-007). The collections behind the caller''s cash on hand: which customer and invoice the money came from.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CashInHand' } } } }
  /cash/positions/{id}/collections:
    get:
      tags: [cash]
      operationId: cashInHandOf
      description: 'cash.view (1.27.0, FR-CASH-007). The same for one staff member (`id` = user id) in the caller''s scope; a field staff member may only read their own. Out of scope answers 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CashInHand' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /cash/deposits/{id}/collections:
    get:
      tags: [cash]
      operationId: depositCollections
      description: 'cash.view (1.30.0, FR-CASH-008). The cash collections one deposit covered: the person''s deposits (pending and verified, oldest first) pay off their cash collections oldest-first, the same order the cash in hand uses, so a deposit''s lines and the cash in hand never overlap. A rejected deposit covers nothing. Scope is the deposit''s: out of scope answers 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DepositCoverage' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /cash/positions:
    get:
      tags: [cash]
      operationId: cashPositions
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CashPosition' } } } } }
  /cash/deposits:
    get:
      tags: [cash]
      operationId: listDeposits
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: status, in: query, schema: { type: string, enum: [pending, verified, rejected, deleted, submitted] } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Deposit' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [cash]
      operationId: createDeposit
      description: 'cash.deposit.record. 1.35.0 (FR-CASH-010, ADR-049): hands in everything the caller holds at once: all the cash in hand (amountPoisha must equal it) and every mobile banking, bank or card collection not handed in yet. The deposit is `submitted` and final: each collection it took gets `depositId`, is posted to the ERP (now, or when ERP posting is switched on) and can no longer be edited or withdrawn. No office step. Before 1.35.0 a collection was posted when it was recorded; now it waits for its deposit.'
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepositCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Deposit' } } } }
  /cash/deposits/{id}/verify:
    post:
      tags: [cash]
      operationId: verifyDeposit
      description: 'Retired in 1.35.0 (ADR-049): a deposit is final. Answers 409 INVALID_STATE reason DEPOSIT_FINAL for every deposit (404 out of scope). Kept because /api/v1 is additive-only.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }
  /cash/deposits/{id}/delete:
    post:
      tags: [cash]
      operationId: deleteDeposit
      description: 'Retired in 1.35.0 (ADR-049): a deposit is final; answers 409 INVALID_STATE reason DEPOSIT_FINAL (404 out of scope). Before 1.35.0: cash.deposit.delete (1.32.0, FR-CASH-009; super admin, branch manager). Deleted a deposit that is `pending` or `verified` (a verified one gives its money back to the person''s cash in hand). The row is kept with status `deleted`, `deletedBy`, `deletedAt`, `deleteReason`; it no longer counts anywhere. The depositor is notified (type `cash.deposit.deleted`) and the sync entity `deposit` carries the new status. Audited (`cash.deposit.deleted`). 409 INVALID_STATE reason: NOT_DELETABLE (already rejected or deleted).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Deposit' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /cash/deposits/{id}/reject:
    post:
      tags: [cash]
      operationId: rejectDeposit
      description: 'Retired in 1.35.0 (ADR-049): a deposit is final. Answers 409 INVALID_STATE reason DEPOSIT_FINAL for every deposit (404 out of scope). Kept because /api/v1 is additive-only.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
  /cash/closings:
    post:
      tags: [cash]
      operationId: createClosing
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [businessDate], properties: { businessDate: { type: string, format: date }, note: { type: string } } }
      responses:
        '201': { description: Created }

  /areas:
    get:
      tags: [assignments]
      operationId: listAreas
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Area' } } } } }
    post:
      tags: [assignments]
      operationId: createArea
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Area' } } } }
      responses:
        '201': { description: Created }
  /areas/{id}:
    patch:
      tags: [assignments]
      operationId: updateArea
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Area' } } } }
      responses:
        '200': { description: OK }
  /assignments:
    get:
      tags: [assignments]
      operationId: listAssignments
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } }, { name: active, in: query, schema: { type: boolean, default: true } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
    post:
      tags: [assignments]
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, type], properties: { userId: { type: string }, type: { type: string, enum: [area, customer] }, areaId: { type: string }, customerId: { type: string }, reason: { type: string } } }
      responses:
        '201': { description: Created }
  /assignments/bulk:
    post:
      tags: [assignments]
      operationId: bulkAssign
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, customerIds], properties: { userId: { type: string }, customerIds: { type: array, maxItems: 1000, items: { type: string } }, reason: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { assigned: { type: integer }, skipped: { type: integer } } } } } }
  /assignments/{id}:
    delete:
      tags: [assignments]
      operationId: endAssignment
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Ended (effectiveTo=now) }

  /cowork/requests:
    post:
      tags: [cowork]
      operationId: requestCowork
      description: |
        Ask colleagues of the same branch to work together today (1.9.0). Idempotent by clientId. If the caller is already in an
        open session, the invitees are added to it. Online only. Permission cowork.use.
        422 BUSINESS_RULE: COWORK_INVALID_INVITEE (not active field staff of the caller's branch, or the caller), COWORK_TOO_MANY (over setting cowork.maxMembers).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clientId, toUserIds], properties: { clientId: { type: string, format: uuid }, toUserIds: { type: array, minItems: 1, maxItems: 10, items: { type: string } }, note: { type: string, maxLength: 300 } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
  /cowork/colleagues:
    get:
      tags: [cowork]
      operationId: coworkColleagues
      description: "Whom the caller may invite: active field staff of the caller's branch, without the caller, ordered by employee code (1.9.0). Online only. Permission cowork.use."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoworkColleague' } } } } }
  /cowork/sessions/mine:
    get:
      tags: [cowork]
      operationId: myCoworkSessions
      description: "Today's sessions where the caller is invited or a member, newest first (1.9.0). Permission cowork.use."
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CoworkSession' } } } } }
  /cowork/sessions/{id}/respond:
    post:
      tags: [cowork]
      operationId: respondCowork
      description: 'Accept or reject an invitation (1.9.0). 409 INVALID_STATE: NOT_INVITED, SESSION_ENDED, ALREADY_IN_SESSION (accepted in another open session).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [decision], properties: { decision: { type: string, enum: [accept, reject] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
  /cowork/sessions/{id}/leave:
    post:
      tags: [cowork]
      operationId: leaveCowork
      description: 'Leave a session (1.9.0). Idempotent. Recording work-out leaves automatically. The person who asked may leave before or after anyone accepts; since 1.34.0 (FR-CW-006) a session with nobody accepted left ends at once, so an unanswered request is cancelled this way, and a later respond answers 409 SESSION_ENDED.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
  /cowork/sessions/{id}/end:
    post:
      tags: [cowork]
      operationId: endCoworkSession
      description: |
        cowork.manage (1.34.0, FR-CW-006). An office user ends an open session with a reason: status `ended`, `endedAt` now,
        `endedBy` and `endReason` set. Branch scope; out of scope is 404. Idempotent: a session that is already over is returned
        as it is. Everyone who was accepted or still invited gets notification `cowork.ended` and the session on their next pull. (Cancelling a request is different: when the asker leaves and invitees have not answered, they get `cowork.cancelled`, 1.37.1.)
        Joint visits already recorded keep their credit. Audited as `cowork.ended_by_office`.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 500 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /cowork/sessions:
    get:
      tags: [cowork]
      operationId: listCoworkSessions
      description: 'Sessions in scope for managers, newest first, with visitsCount (1.9.0). Permission cowork.view.'
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date } }, { name: to, in: query, schema: { type: string, format: date } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/CoworkSession' } }, nextCursor: { type: [string, 'null'] } } } } } }
  /cowork/sessions/{id}:
    get:
      tags: [cowork]
      operationId: getCoworkSession
      description: 'One session with visitsCount (1.9.0). Permission cowork.view; out of scope is 404. Its visits: GET /visits?coWorkSessionId='
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CoworkSession' } } } }
  /tasks/mine:
    get:
      tags: [tasks]
      operationId: myTasks
      description: |
        The caller's own tasks (1.20.0, FR-TASK-003): everything still going plus what was closed in the last 30 days, newest first.
        Permission task.work. The app mostly gets the same tasks as sync entity `task`; this call is for refreshing online.
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Task' } } } } } } }
  /tasks/{id}/resolve-request:
    post:
      tags: [tasks]
      operationId: requestTaskResolve
      description: |
        The assignee says the work is done (1.20.0, FR-TASK-002). open → resolve_requested and every manager with task.manage in the task's
        branch is notified. Idempotent: a repeat answers 200 with the task as it is. Offline phones use the sync mutation `task_resolve_request`.
        Permission task.work; a task of someone else is 404. 409 INVALID_STATE: TASK_RESOLVED, TASK_CANCELLED.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000 }, requestedAt: { type: string, format: date-time, description: 'When the staff member tapped the button (offline). Never later than the server time.' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      description: |
        Tasks in scope, newest first (1.20.0, FR-TASK-004). Permission task.view. `counts` are for the same branch, person and search whatever
        `status` is, so tab badges stay right; `counts.overdue` = still going and past the due date.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchId' }
        - { name: overdue, in: query, schema: { type: boolean }, description: 'Only unfinished tasks past their due date' }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Words in the title' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items, counts], properties: { items: { type: array, items: { $ref: '#/components/schemas/Task' } }, nextCursor: { type: [string, 'null'] }, counts: { $ref: '#/components/schemas/TaskCounts' } } } } } }
    post:
      tags: [tasks]
      operationId: createTask
      description: |
        Give a task to one field staff member, with a note (1.20.0, FR-TASK-001). Not tied to a customer. The assignee is notified. Idempotent by clientId
        (a repeat answers 200). Permission task.manage. `branchId` must be one of the assignee's branches that the caller can see; default: the first such branch.
        422 BUSINESS_RULE: TASK_INVALID_ASSIGNEE (unknown, inactive, not field staff, or out of the caller's scope), TASK_DUE_IN_PAST.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      description: 'One task with its history (1.20.0). Permission task.view; out of scope is 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
    patch:
      tags: [tasks]
      operationId: editTask
      description: 'Change title, note or due date while the task is open (1.20.0). Permission task.manage. 409 INVALID_STATE: TASK_RESOLVE_REQUESTED, TASK_RESOLVED, TASK_CANCELLED, TASK_CHANGED. 422 TASK_DUE_IN_PAST.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, minProperties: 1, properties: { title: { type: string, minLength: 1, maxLength: 120 }, note: { type: [string, 'null'], maxLength: 2000 }, dueDate: { type: [string, 'null'], format: date } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks/{id}/verify:
    post:
      tags: [tasks]
      operationId: verifyTask
      description: 'The admin agrees the work is done: resolve_requested → resolved; the assignee is notified (1.20.0, FR-TASK-003). Idempotent. Permission task.manage. 409 INVALID_STATE: TASK_OPEN (no resolve request yet), TASK_CANCELLED, TASK_CHANGED.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks/{id}/reject:
    post:
      tags: [tasks]
      operationId: rejectTask
      description: 'The admin says the work is not done: resolve_requested → open, with a reason (at least 5 characters) the assignee sees (1.20.0, FR-TASK-003). Permission task.manage. 422 REASON_REQUIRED. 409 INVALID_STATE: TASK_OPEN, TASK_RESOLVED, TASK_CANCELLED, TASK_CHANGED.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string, maxLength: 500 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /tasks/{id}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      description: 'The admin withdraws a task that is open or waiting for verification (1.20.0). Idempotent; the assignee is notified. Permission task.manage. 409 INVALID_STATE: TASK_RESOLVED, TASK_CHANGED.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
  /places:
    get:
      tags: [places]
      operationId: listPlaces
      description: |
        Map places in scope (1.38.0, FR-PLC-001/004): text markers staff and the office put on the map (shop, market, mosque…), newest first.
        Permission place.view. Scope: the caller's branches; super admin all. `status=deleted` needs place.manage (403 otherwise).
        Use `bbox` for the visible map area; `pendingMove=true` lists only places with an open move request.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { name: q, in: query, schema: { type: string, maxLength: 60 }, description: 'Words in the name or note, any case' }
        - { name: icon, in: query, schema: { $ref: '#/components/schemas/PlaceIcon' } }
        - { name: bbox, in: query, schema: { type: string }, description: 'minLng,minLat,maxLng,maxLat' }
        - { name: pendingMove, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: string, enum: [active, deleted], default: active } }
        - { name: limit, in: query, schema: { type: integer, default: 200, minimum: 1, maximum: 1000 } }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Place' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [places]
      operationId: createPlace
      description: |
        Put a place on the map (1.38.0, FR-PLC-002). Visible to everyone in the branch at once, no approval. Idempotent by clientId per caller
        (a repeat answers 200). Permission place.create. `branchId` defaults to the caller's first branch and must be one the caller can see.
        Offline phones use the sync mutation `place` with the same body. 422 BUSINESS_RULE: OUTSIDE_BANGLADESH, PLACE_INVALID_BRANCH.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceCreate' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
  /places/move-requests:
    get:
      tags: [places]
      operationId: listPlaceMoveRequests
      description: 'Open move requests in scope, oldest first (1.38.0, FR-PLC-005): the office queue. Permission place.manage.'
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Place' } } } } } } }
  /places/{id}:
    get:
      tags: [places]
      operationId: getPlace
      description: 'One place with its history (1.38.0). Permission place.view; out of scope is 404; a deleted place is 404 unless the caller has place.manage.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
    patch:
      tags: [places]
      operationId: editPlace
      description: |
        Change name, icon or note (1.38.0, FR-PLC-003). Permission place.create: a field staff member edits only the places they created; other places
        and `location` (a direct move) need place.manage (403 otherwise). A direct move closes an open move request as rejected ("moved by the office").
        `If-Match: W/"<version>"` is optional; a stale version is 412. Offline phones use the sync mutation `place_edit`.
        409 INVALID_STATE: PLACE_DELETED. 422 BUSINESS_RULE: OUTSIDE_BANGLADESH.
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceUpdate' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
    delete:
      tags: [places]
      operationId: deletePlace
      description: 'Remove a place from the map (1.38.0, FR-PLC-006). Soft delete: the row and its history are kept (status deleted); an open move request is closed. Idempotent. Permission place.manage. Audited.'
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reason, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
  /places/{id}/move-request:
    post:
      tags: [places]
      operationId: requestPlaceMove
      description: |
        Ask the office to move a place's marker (1.38.0, FR-PLC-004). Any place in scope, not only own ones. The marker stays where it is until an
        office user with place.manage approves; they get an inbox item and a notification. One open request per place. Idempotent by clientId
        (a repeat answers 200). Permission place.create. Offline phones use the sync mutation `place_move_request`.
        409 INVALID_STATE: MOVE_PENDING (someone else's request is open), PLACE_DELETED. 422 BUSINESS_RULE: OUTSIDE_BANGLADESH, MOVE_TOO_SHORT (under 5 m).
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceMoveRequestCreate' }
      responses:
        '201': { description: Requested, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
        '200': { description: Replay of the same clientId, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
  /places/{id}/move-request/decision:
    post:
      tags: [places]
      operationId: decidePlaceMove
      description: |
        Approve (the marker moves to the requested point) or reject (it stays; reason of at least 5 characters required) an open move request
        (1.38.0, FR-PLC-005). The requester is notified either way. Permission place.manage. 409 INVALID_STATE: NO_PENDING_MOVE. 422 REASON_REQUIRED.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Decision' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
  /targets:
    get:
      tags: [targets]
      operationId: listTargets
      description: |
        Daily targets in force for every active field staff member of a branch on a date (1.10.0, FR-COL-015). A personal target, when one
        is in force, wins over the branch default. Non-working days (weekly off, holiday, approved leave) have no target: their row has
        workingDay false and zeros. Permission target.view. branchId defaults to the caller's first branch; out of scope is 404.
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: date, in: query, schema: { type: string, format: date }, description: 'Default today (Dhaka)' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTargets' } } } }
  /targets/me:
    get:
      tags: [targets]
      operationId: myTarget
      description: "The caller's own effective target for a date (1.10.0). Self-service. Also sent as `target` on /sync/pull and /sync/bootstrap."
      parameters: [ { name: date, in: query, schema: { type: string, format: date }, description: 'Default today (Dhaka)' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyTarget' } } } }
  /targets/users/{id}:
    put:
      tags: [targets]
      operationId: setUserTarget
      description: |
        Set a personal daily target for one field staff member from effectiveFrom on (1.10.0). Permission target.manage, audited (target.set).
        422 BUSINESS_RULE TARGET_IN_PAST when effectiveFrom is before today: targets of past days stay as they were, so reports do not change afterwards.
        404 when the user is not active field staff in the caller's scope.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountPoisha, visits, reason], properties: { amountPoisha: { type: integer, minimum: 0 }, visits: { type: number, minimum: 0, maximum: 100, description: 'Compared with visitCredit' }, effectiveFrom: { type: string, format: date, description: 'Default today' }, reason: { type: string, minLength: 3, maxLength: 300 } } } } } }
      responses:
        '200': { description: 'The target row as it applies on effectiveFrom', content: { application/json: { schema: { $ref: '#/components/schemas/StaffTarget' } } } }
  /targets/users/{id}/clear:
    post:
      tags: [targets]
      operationId: clearUserTarget
      description: 'From effectiveFrom on, the person follows the branch default again (1.10.0). Permission target.manage, audited (target.cleared). Same 422 / 404 as PUT.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { effectiveFrom: { type: string, format: date }, reason: { type: string, minLength: 3, maxLength: 300 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StaffTarget' } } } }
  /targets/users/{id}/history:
    get:
      tags: [targets]
      operationId: userTargetHistory
      description: 'Every personal target change of one staff member, newest first (1.10.0). Permission target.view.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TargetChange' } } } } }
  /targets/branches/{id}:
    put:
      tags: [targets]
      operationId: setBranchTarget
      description: 'Branch default daily target from effectiveFrom on, for everyone without a personal target (1.10.0). Permission target.manage, audited (target.branch_set). Same 422 TARGET_IN_PAST; another branch is 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amountPoisha, visits, reason], properties: { amountPoisha: { type: integer, minimum: 0 }, visits: { type: number, minimum: 0, maximum: 100 }, effectiveFrom: { type: string, format: date }, reason: { type: string, minLength: 3, maxLength: 300 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TargetValue' } } } }
  /handovers:
    get:
      tags: [handovers]
      operationId: listHandovers
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: status, in: query, schema: { $ref: '#/components/schemas/HandoverStatus' } }, { name: mine, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Handover' } } } } }
    post:
      tags: [handovers]
      operationId: createHandover
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HandoverCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Handover' } } } }
  /handovers/{id}:
    get:
      tags: [handovers]
      operationId: getHandover
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Handover' } } } }
  /handovers/{id}/accept:
    post:
      tags: [handovers]
      operationId: acceptHandover
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Problem' }
  /handovers/{id}/reject:
    post:
      tags: [handovers]
      operationId: rejectHandover
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
  /handovers/{id}/cancel:
    post:
      tags: [handovers]
      operationId: cancelHandover
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK }

  /visits:
    get:
      tags: [visits]
      operationId: listVisits
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string }, description: 'Visits this person recorded, plus co-work visits they took part in (1.9.0)' }, { name: customerId, in: query, schema: { type: string } }, { name: date, in: query, schema: { type: string, format: date }, description: 'One Dhaka business day; wins over from/to' }, { name: from, in: query, schema: { type: string, format: date }, description: 'Inclusive Dhaka day (1.4.0)' }, { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive Dhaka day (1.4.0)' }, { name: outcome, in: query, schema: { type: string }, description: 'Visit outcome (1.4.0)' }, { name: coWork, in: query, schema: { type: string, enum: ['true', 'false'] }, description: 'Only co-work visits, or only single visits (1.9.0)' }, { name: coWorkSessionId, in: query, schema: { type: string }, description: 'Visits of one co-work session (1.9.0)' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/VisitListItem' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [visits]
      operationId: createVisit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VisitCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Visit' } } } }
  /visits/{id}/checkout:
    patch:
      tags: [visits]
      operationId: checkoutVisit
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [checkOutAt], properties: { checkOutAt: { type: string, format: date-time }, outcome: { $ref: '#/components/schemas/VisitOutcome' } } }
      responses:
        '200': { description: OK }

  /media/upload-url:
    post:
      tags: [media]
      operationId: createUploadUrl
      description: 'Presigned PUT to the server''s store (S3 or `db`). Since 1.37.0 the server copies a confirmed photo to Cloudinary in the background when Cloudinary is configured (ADR-050); the phone protocol is unchanged. 409 `INVALID_STATE` reason `MEDIA_DELETED` when the same file was uploaded before and an admin deleted it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, contentType, sizeBytes, sha256]
              properties:
                kind: { type: string, enum: [visit_photo, deposit_slip, selfie, location_proof, refund_proof, voice_note] }
                contentType: { type: string, enum: [image/jpeg, image/webp, audio/aac, audio/mp4] }
                sizeBytes: { type: integer, maximum: 1048576 }
                sha256: { type: string }
                capturedAt: { type: string, format: date-time }
                geo: { $ref: '#/components/schemas/GeoFix' }
      responses:
        '201':
          description: Presigned PUT
          content:
            application/json:
              schema: { type: object, properties: { mediaId: { type: string }, uploadUrl: { type: string }, headers: { type: object, additionalProperties: { type: string } }, expiresAt: { type: string, format: date-time }, alreadyExists: { type: boolean } } }
  /media/{id}/confirm:
    post:
      tags: [media]
      operationId: confirmMedia
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Confirmed }
  /media/{id}/url:
    get:
      tags: [media]
      operationId: mediaUrl
      parameters: [ { $ref: '#/components/parameters/Id' }, { name: variant, in: query, schema: { type: string, enum: [original, thumb] } } ]
      description: |
        A link that works for 5 minutes. Since 1.37.0 (ADR-050) a photo copied to Cloudinary is served as a signed private
        Cloudinary download link (`api.cloudinary.com/v1_1/<cloud>/image/download?...&expires_at=...`); until it is copied, or
        when Cloudinary is not configured, the link points at the server's own store as before. Clients just open `url`.
        A photo deleted by an admin (FR-MED-003/004) answers 404 `NOT_FOUND` with `details.reason = MEDIA_DELETED`,
        `details.deletedAt` and `details.deletedByName`.
      responses:
        '200': { description: Signed GET URL (5 min), content: { application/json: { schema: { type: object, properties: { url: { type: string }, expiresAt: { type: string } } } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /media/purge/preview:
    get:
      tags: [media]
      operationId: mediaPurgePreview
      description: |
        media.delete (1.37.0, FR-MED-003). Photos taken before the first day (Asia/Dhaka) of month `before`, per month, with
        their count and size. Kinds: selfie, visit_photo, location_proof; deposit_slip and refund_proof (money proofs) only
        with `includeMoneyProofs=true`. Voice notes are never included. `suggest` is true from the 5th of the month on when
        there is something to delete (the admin panel shows an alert). Branch scope: a super admin sees all.
      parameters:
        - { name: before, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' }, description: 'YYYY-MM, default the current Dhaka month (= every earlier month). Not later than the current month.' }
        - { name: includeMoneyProofs, in: query, schema: { type: boolean, default: false } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaPurgePreview' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /media/purge:
    post:
      tags: [media]
      operationId: mediaPurge
      description: |
        media.delete (1.37.0, FR-MED-003). Deletes the photos the preview counts, at most 200 per call, oldest first, and
        returns how many were deleted and how many remain; call again until `remaining` is 0. `confirmText` must be exactly
        `DELETE <before>` (e.g. `DELETE 2026-11`), else 422 `BUSINESS_RULE` rule `CONFIRM_TEXT_MISMATCH` and nothing is deleted.
        A deleted photo is marked `deleted` at once (its link answers 404 `MEDIA_DELETED`) and its files are removed from
        Cloudinary and from the server's store (retried in the background if a store is down). One audit entry
        (`media.purged`) per call with the counts. Branch scope: a super admin deletes in every branch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before, confirmText]
              properties:
                before: { type: string, pattern: '^\d{4}-\d{2}$' }
                includeMoneyProofs: { type: boolean, default: false }
                confirmText: { type: string, maxLength: 40 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MediaPurgeResult' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /storage/o:
    parameters: [ { name: t, in: query, required: true, schema: { type: string, maxLength: 4096 }, description: Signed grant (key, method, expiry; for PUT also type, size and sha256) } ]
    put:
      tags: [media]
      operationId: storagePut
      summary: Upload target of a presigned URL when the server keeps files itself (ADR-039)
      description: |
        Only exists when the server has no S3 (`STORAGE_DRIVER=db`, the default on Vercel test deployments).
        Clients never build this URL: they PUT to `uploadUrl` from `/media/upload-url` as for S3. No bearer
        token; the signature in the path is the permission and expires after 5 minutes. The body must match
        the signed content type, size and sha256.
      security: []
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
          audio/aac: { schema: { type: string, format: binary } }
          audio/mp4: { schema: { type: string, format: binary } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { type: object, required: [stored], properties: { stored: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    get:
      tags: [media]
      operationId: storageGet
      summary: Download target of a presigned GET URL when the server keeps files itself (ADR-039)
      security: []
      responses:
        '200': { description: The file, with its stored content type, content: { '*/*': { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /customers/{id}/notes:
    get:
      tags: [notes]
      operationId: listNotes
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Note' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [notes]
      operationId: createNote
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [clientId, text], properties: { clientId: { type: string, format: uuid }, text: { type: string, maxLength: 2000 }, category: { type: string, enum: [general, payment, complaint, address, family] }, voiceMediaId: { type: string }, visitClientId: { type: string } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }

  /notes/{id}:
    patch:
      tags: [notes]
      operationId: editNote
      description: Author only, within 15 minutes of creation (FR-NOTE-001). Added in 1.3.0.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 2000 } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Note' } } } }
        '409': { $ref: '#/components/responses/Problem' }
  /customers/{id}/contact-attempts:
    get:
      tags: [notes]
      operationId: listContactAttempts
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ContactAttempt' } } } } }
    post:
      tags: [notes]
      operationId: logContactAttempt
      description: Added in 1.2.0 (FR-M-014). Idempotent by clientId.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttemptCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttempt' } } } }
        '200': { description: Replay, content: { application/json: { schema: { $ref: '#/components/schemas/ContactAttempt' } } } }
  /promises:
    get:
      tags: [promises]
      operationId: listPromises
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: ownerId, in: query, schema: { type: string } }, { name: customerId, in: query, schema: { type: string }, description: 'Documented in 1.4.0' }, { name: date, in: query, schema: { type: string, format: date }, description: 'Promised date; wins over from/to' }, { name: from, in: query, schema: { type: string, format: date }, description: 'Promised date from, inclusive (1.4.0)' }, { name: to, in: query, schema: { type: string, format: date }, description: 'Promised date to, inclusive (1.4.0)' }, { name: status, in: query, schema: { $ref: '#/components/schemas/PromiseStatus' } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/PromiseListItem' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [promises]
      operationId: createPromise
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PromiseCreate' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Promise' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /promises/{id}/cancel:
    post:
      tags: [promises]
      operationId: cancelPromise
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }

  /attendance/events:
    post:
      tags: [attendance]
      operationId: attendanceEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, type, at, geo]
              properties:
                clientId: { type: string, format: uuid }
                type: { type: string, enum: [work_in, break_start, break_end, work_out] }
                at: { type: string, format: date-time }
                deviceTime: { type: string, format: date-time }
                geo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'null when no GPS fix could be taken (1.2.0); send geoUnavailableReason' }
                geoUnavailableReason: { $ref: '#/components/schemas/GeoUnavailableReason' }
                selfieMediaId: { type: string, description: "Front-camera photo (media kind `selfie`) uploaded by this user. Stored on every event type. Required at the event types in setting `attendance.selfieEvents` while `attendance.selfieRequired` is true (defaults: true, all four types); an event without it is still stored and flagged `no_selfie` (1.8.0)." }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceDay' } } } }
        '409': { $ref: '#/components/responses/Problem' }
    get:
      tags: [attendance]
      operationId: listAttendanceEvents
      description: "One staff member's raw events of a business date, oldest first, with photo, place and flags per event (1.8.0). Permission attendance.view; a user outside the caller's branches is 404. The photo is read with GET /media/{id}/url."
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceEvent' } } } } }
  /attendance/photos/delete:
    post:
      tags: [attendance]
      operationId: deleteAttendancePhotos
      description: |
        media.delete (1.37.0, FR-MED-004). Deletes the attendance photos of one staff member on one business date. Each
        event that had a photo gets `selfieDeleted { at, by, byName }` and `selfieMediaId: null`; the photo files are removed
        from Cloudinary and from the server's store. Branch scope: a user outside the caller's branches is 404. A day without
        photos answers `deleted: 0`. Audited as `attendance.photos_deleted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, date]
              properties:
                userId: { type: string }
                date: { type: string, format: date }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [deleted, events]
                properties:
                  deleted: { type: integer, description: Number of photos deleted }
                  events: { type: array, items: { $ref: '#/components/schemas/AttendanceEvent' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /attendance/me/today:
    get:
      tags: [attendance]
      operationId: myAttendanceToday
      description: '1.36.0: also returns `events`, the day''s attendance events (oldest first), so a phone that lost its local data (reinstall) restores the work-in, breaks and work-out already recorded instead of asking again.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AttendanceDay'
                  - type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          required: [id, type, at, source]
                          properties:
                            id: { type: string }
                            clientId: { type: [string, 'null'], description: 'The id the phone gave the event; restore it under this id so a retry stays idempotent' }
                            type: { type: string, enum: [work_in, break_start, break_end, work_out] }
                            at: { type: string, format: date-time }
                            source: { type: string, enum: [app, correction, system] }
  /attendance/me/shift:
    get:
      tags: [attendance]
      operationId: myShift
      description: 'attendance.record (1.12.0). The caller''s shift: their own if assigned, else the branch default (`id: default`). Weekly off days are 0 = Sunday … 6 = Saturday. 1.25.0: `breakWindows` (e.g. the Friday break).'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Shift' } } } }
  /attendance/days:
    get:
      tags: [attendance]
      operationId: listAttendanceDays
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: userId, in: query, schema: { type: string } }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } } } } }
  /attendance/summary:
    get:
      tags: [attendance]
      operationId: attendanceSummary
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: month, in: query, required: true, schema: { type: string, example: 2026-11 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { month: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/AttendanceSummaryRow' } } } } } } }
  /attendance/corrections:
    post:
      tags: [attendance]
      operationId: attendanceCorrection
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [userId, businessDate, type, at, reason], properties: { userId: { type: string }, businessDate: { type: string, format: date }, type: { type: string, enum: [work_in, break_start, break_end, work_out] }, at: { type: string, format: date-time }, replacesEventId: { type: string }, reason: { type: string } } }
      responses:
        '201': { description: Created }
  /leave-requests:
    get:
      tags: [attendance]
      operationId: listLeave
      parameters:
        - $ref: '#/components/parameters/BranchId'
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, cancelled] } }
        - { name: userId, in: query, description: 'attendance.manage only (1.12.0); ignored for staff', schema: { type: string } }
        - { name: from, in: query, description: 'Requests overlapping from..to (1.12.0)', schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: 'OK. Staff see their own; attendance.manage sees its branches. Newest first, max 300, no cursor (1.4.0)', content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } } } } } } }
    post:
      tags: [attendance]
      operationId: requestLeave
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type, from, to], properties: { type: { type: string, enum: [casual, sick, other] }, from: { type: string, format: date }, to: { type: string, format: date }, reason: { type: string, maxLength: 500 } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '409': { description: 'INVALID_STATE `LEAVE_OVERLAPS` (a pending or approved request covers one of the days)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'BUSINESS_RULE `LEAVE_TOO_LONG` (more than 31 days)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /leave-requests/{id}/decision:
    post:
      tags: [attendance]
      operationId: decideLeave
      description: 'attendance.manage, in branch scope. Rejecting needs a reason (≥ 5 characters, 422 `REASON_REQUIRED`); nobody decides their own (422 `CANNOT_DECIDE_OWN_LEAVE`); a decided request answers 409 `ALREADY_DECIDED`.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Decision' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
  /leave-requests/{id}/cancel:
    post:
      tags: [attendance]
      operationId: cancelLeave
      description: 'leave.request (1.12.0). The requester withdraws their own pending request (e.g. to fix the dates). Repeating it answers the cancelled request; a decided one answers 409 `ALREADY_DECIDED`; someone else''s 404.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/LeaveRequest' } } } }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /location/points:
    post:
      tags: [location]
      operationId: ingestPoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, points]
              properties:
                deviceId: { type: string }
                points: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/LocationPoint' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: integer }, rejected: { type: array, items: { type: object, properties: { index: { type: integer }, reason: { type: string, enum: [LOW_ACCURACY, IMPOSSIBLE_SPEED, FUTURE_TIME, DUPLICATE, OFF_DUTY] } } } }, nextSampling: { $ref: '#/components/schemas/SamplingConfig' } } }
  /location/heartbeat:
    post:
      tags: [location]
      operationId: heartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { battery: { type: number }, charging: { type: boolean }, gpsEnabled: { type: boolean }, permission: { type: string, enum: [always, while_in_use, denied] }, bgRestricted: { type: boolean }, appVersion: { type: string }, pendingPoints: { type: integer }, pendingMutations: { type: integer }, trackingProvider: { type: string, enum: [free, paid], description: 'Plugin actually running on the device (1.5.0)' }, trackingProviderFallback: { type: boolean, description: 'true when the setting asked for paid but the app fell back to free (1.5.0)' } } }
      responses:
        '204': { description: OK }
  /location/latest:
    get:
      tags: [location]
      operationId: latestLocations
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LatestLocation' } } } } }
  /location/history:
    get:
      tags: [location]
      operationId: locationHistory
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } }, { name: simplify, in: query, schema: { type: number, default: 10 } } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  polyline: { type: string, description: 'Google encoded polyline (precision 5)' }
                  segments: { type: array, items: { type: object, properties: { from: { type: string }, to: { type: string }, kind: { type: string, enum: [moving, gap] } } } }
                  stops: { type: array, items: { $ref: '#/components/schemas/Stop' } }
                  events: { type: array, items: { $ref: '#/components/schemas/TimelineItem' } }
                  summary: { $ref: '#/components/schemas/LocationDailySummary' }
  /location/stops:
    get:
      tags: [location]
      operationId: locationStops
      parameters: [ { name: userId, in: query, required: true, schema: { type: string } }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Stop' } } } } }

  /sync/bootstrap:
    get:
      tags: [sync]
      operationId: syncBootstrap
      parameters: [ { $ref: '#/components/parameters/Cursor' }, { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 200 } } ]
      responses:
        '200': { description: "Paged snapshot for a fresh device; the final page has nextCursor null and returns pullCursor (schema declared in 1.5.0). Entities, in this order (1.9.1): attendance_day (today, id userId:date), cowork_session (today's), customer (whole scope), location_proposal (own pending), promise (own open), visit (today's, own and joint). Since 1.20.0 also task (open ones and those closed in the last 30 days). Older history is not included; it is read online.", content: { application/json: { schema: { $ref: '#/components/schemas/SyncBootstrapResponse' } } } }
  /sync/pull:
    get:
      tags: [sync]
      operationId: syncPull
      parameters: [ { name: cursor, in: query, required: true, schema: { type: string } }, { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPullResponse' } } } }
        '410': { description: 'CURSOR_EXPIRED: the cursor cannot be continued (ahead of the feed, older than 30 days, or taken before the server widened what the device may hold, e.g. ADR-038 in 1.20.1). Call GET /sync/bootstrap; keep the outbox.', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /sync/push:
    post:
      tags: [sync]
      operationId: syncPush
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushRequest' } } } }
      responses:
        '200': { description: Per-item results, content: { application/json: { schema: { $ref: '#/components/schemas/SyncPushResponse' } } } }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }, { name: unread, in: query, schema: { type: boolean } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Notification' } }, nextCursor: { type: [string, 'null'] }, unreadCount: { type: integer } } } } } }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: readNotification
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: OK }
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: readAllNotifications
      responses:
        '204': { description: OK }
  /broadcasts:
    get:
      tags: [notifications]
      operationId: listBroadcasts
      description: 'Holders of notification.broadcast see what they sent or what went to their branches; everyone else sees broadcasts addressed to them. Newest first.'
      parameters: [ { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Broadcast' } }, nextCursor: { type: [string, 'null'] } } } } } }
    post:
      tags: [notifications]
      operationId: createBroadcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [title, body], properties: { branchIds: { type: array, items: { type: string } }, roles: { type: array, items: { $ref: '#/components/schemas/Role' } }, title: { $ref: '#/components/schemas/I18nText' }, body: { $ref: '#/components/schemas/I18nText' }, requireAck: { type: boolean } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Broadcast' } } } }
  /broadcasts/{id}/recipients:
    get:
      tags: [notifications]
      operationId: listBroadcastRecipients
      description: 'notification.broadcast (1.12.0), same scope as the sender''s list (else 404). Everyone it went to and whether they read it; not read first.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BroadcastRecipients' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /broadcasts/{id}/ack:
    post:
      tags: [notifications]
      operationId: ackBroadcast
      description: 'A recipient read it ("পড়েছি"). Idempotent; the first time counts. Offline phones use the sync mutation `broadcast_ack` (1.12.0).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: OK }
        '404': { $ref: '#/components/responses/Problem' }

  /inbox:
    get:
      tags: [inbox]
      operationId: listInbox
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: status, in: query, schema: { type: string, enum: [open, snoozed, resolved], default: open } }, { name: type, in: query, schema: { type: string } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/InboxItem' } }, counts: { type: object, additionalProperties: { type: integer } }, nextCursor: { type: [string, 'null'] } } } } } }
  /activity:
    get:
      tags: [inbox]
      operationId: listActivity
      description: |
        activity.view (1.28.0, FR-ACT-001; module `activity`, flag `module.activity`). Staff activity in the caller's branch scope, newest first: collections taken, visits recorded, promises made, map pins set or proposed by staff. Each line names the person and the customer.
        `unseen` counts the lines since the caller last called POST /activity/seen (capped at 99), whatever the filters; `items[].unseen` marks them. Lines are kept 45 days; the records themselves stay in their modules.
      parameters:
        - { $ref: '#/components/parameters/BranchId' }
        - { name: type, in: query, schema: { type: string, enum: [collection, visit, promise, pin, collection_withdrawn, collection_edited, deposit_deleted] } }
        - { name: userId, in: query, schema: { type: string }, description: 'Only what this staff member did' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityFeed' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /activity/seen:
    post:
      tags: [inbox]
      operationId: markActivitySeen
      description: 'activity.view (1.28.0). The caller has looked at the feed; `unseen` starts again from now. Per user, idempotent.'
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [seenAt, unseen], properties: { seenAt: { type: string, format: date-time }, unseen: { type: integer } } } } } }
  /inbox/{id}/resolve:
    post:
      tags: [inbox]
      operationId: resolveInbox
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Reason' } } } }
      responses:
        '200': { description: OK }
  /inbox/{id}/snooze:
    post:
      tags: [inbox]
      operationId: snoozeInbox
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until], properties: { until: { type: string, format: date-time } } } } } }
      responses:
        '200': { description: OK }

  /dashboard/overview:
    get:
      tags: [reports]
      operationId: dashboardOverview
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: date, in: query, schema: { type: string, format: date } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DashboardOverview' } } } }
  /search:
    get:
      tags: [customers]
      operationId: globalSearch
      parameters: [ { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }, { name: types, in: query, schema: { type: string, example: 'customer,user,receipt' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { type: { type: string }, id: { type: string }, title: { type: string }, subtitle: { type: string } } } } } } }
  /reports/staff-performance:
    get:
      tags: [reports]
      operationId: staffPerformance
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: period, in: query, required: true, schema: { type: string, enum: [daily, monthly] } }, { name: date, in: query, required: true, schema: { type: string, description: 'YYYY-MM-DD or YYYY-MM' } }, { name: userId, in: query, schema: { type: string } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StaffPerformanceRow' } } } } }
  /reports/branch-trends:
    get:
      tags: [reports]
      operationId: branchTrends
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: from, in: query, required: true, schema: { type: string, format: date } }, { name: to, in: query, required: true, schema: { type: string, format: date } }, { name: granularity, in: query, schema: { type: string, enum: [day, week, month], default: day } } ]
      description: 'At most 366 days, ending today or earlier. Weeks start on Saturday. (Response schema declared in 1.6.0.)'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTrends' } } } }
  /reports/reconciliation:
    get:
      tags: [reports]
      operationId: reconciliation
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      description: 'FOS collections of one business date against the field payments the ERP reported (cached copy; see erpFetchedAt). (Response schema declared in 1.6.0.)'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconciliationReport' } } } }
  /reports/me/performance:
    get:
      tags: [reports]
      operationId: myPerformance
      description: |
        The caller's own performance for a month, with targets and one row per day (1.10.0, FR-REP-005, FR-M-021). Self-service, online.
        `rank` is filled only when the leaderboard is visible to staff (setting reports.leaderboardVisibleToStaff) and ranks by collected.
      parameters: [ { name: month, in: query, required: true, schema: { type: string, description: 'YYYY-MM, this month or earlier' } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MyPerformance' } } } }
  /reports/leaderboard:
    get:
      tags: [reports]
      operationId: leaderboard
      description: |
        Field staff ranked for a day or a month (1.10.0, FR-REP-005). Managers with report.view always see it for any branch in scope.
        Field staff see their own branch only, and only when setting reports.leaderboardVisibleToStaff is true (default false, OD-15); otherwise 403 FORBIDDEN.
        Rules: a person needs at least reports.leaderboardMinPresentDays present days in the period (default 1) to be ranked; others follow with rank null.
        Equal values share a rank (1, 2, 2, 4) and are ordered by name. target_achievement ranks amount achieved ÷ amount target; people without a target are not ranked for it.
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: period, in: query, required: true, schema: { type: string, enum: [day, month] } }, { name: date, in: query, schema: { type: string, description: 'YYYY-MM-DD for day, YYYY-MM for month; default the current one' } }, { name: metric, in: query, schema: { type: string, enum: [collected, visit_credit, promises_kept, target_achievement], default: collected } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Leaderboard' } } } }
  /reports/collection-board:
    get:
      tags: [reports]
      operationId: collectionBoard
      description: |
        Who collected the most money that the ERP has accepted (1.26.0, FR-REP-007, ADR-045), for a month or for all time. Field collection amounts with status posted or resolved_posted only; money still pending in the ERP is never counted. Not a balance.
        Everyone who collected is on it whatever their role (a manager or an admin is ranked by collections alone); active field staff with nothing posted are listed with rank null.
        Access as the leaderboard: report.view, or setting reports.leaderboardVisibleToStaff true for the caller's own branch; otherwise 403 FORBIDDEN.
        With setting reports.leaderboardScope = all (default) the board covers every branch for everyone who may open it; with branch a person sees the branches of their own scope (field staff: their home branch) and another branchId answers 404.
        Equal amounts share a rank (1, 2, 2, 4).
      parameters:
        - { name: period, in: query, required: true, schema: { type: string, enum: [month, all] } }
        - { name: month, in: query, schema: { type: string, example: 2026-11, description: 'Only with period=month; default the current month. A future month answers 400.' } }
        - { $ref: '#/components/parameters/BranchId' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CollectionBoard' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /reports/data-quality:
    get:
      tags: [reports]
      operationId: dataQuality
      description: |
        Customer data problems per branch, one count per issue (1.10.0, FR-CUS-009). Active ERP customers only; a customer can have several issues.
        Issues: no_location, invalid_location (0,0 or outside Bangladesh), suspect_swapped (lat/lng look swapped), far_from_branch (pin more than
        setting reports.dataQualityMaxBranchKm, default 30 km, from the branch), missing_phone, invalid_phone (not an 11-digit Bangladesh mobile),
        shared_phone (same number on another customer of the branch), plan_without_schedule (an open plan with no installment schedule),
        unassigned (no field staff). Permission report.view.
      parameters: [ { $ref: '#/components/parameters/BranchId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DataQualitySummary' } } } }
  /reports/data-quality/items:
    get:
      tags: [reports]
      operationId: dataQualityItems
      description: 'Customers with one issue, paged (1.10.0). Permission report.view.'
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: issue, in: query, required: true, schema: { $ref: '#/components/schemas/DataQualityIssue' } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/DataQualityItem' } }, nextCursor: { type: [string, 'null'] } } } } } }
  /reports/exports:
    post:
      tags: [reports]
      operationId: createExport
      description: |
        Async export, built by the worker within about a minute, kept 7 days, visible only to the requester (1.6.0 documents params).
        `params` per type: staff_performance → { period, date, branchId?, userId? } · collections → { from, to, branchId? } (≤ 92 days) ·
        attendance → { from, to, branchId? } (≤ 62 days) · overdue_customers, cash_positions → { branchId? } ·
        audit → { from, to, branchId? } (≤ 31 days; also needs `audit.view`, else 403) (1.7.1) · data_quality → { branchId?, issue? } (1.10.0).
        `format: pdf` (1.10.0): A4 landscape PDF with the Bangla font embedded (Noto Sans Bengali, shaped with HarfBuzz) and the table header repeated on every page.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type, format], properties: { type: { type: string, enum: [staff_performance, collections, attendance, overdue_customers, cash_positions, audit, data_quality] }, format: { type: string, enum: [csv, xlsx, pdf] }, params: { type: object, additionalProperties: true }, locale: { type: string, enum: [bn, en] } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string } } } } } }
  /reports/exports/{id}:
    get:
      tags: [reports]
      operationId: getExport
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { id: { type: string }, status: { type: string, enum: [queued, running, ready, failed] }, downloadUrl: { type: string } } } } } }
  /audit:
    get:
      tags: [audit]
      operationId: listAudit
      parameters: [ { $ref: '#/components/parameters/BranchId' }, { name: actorId, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string } }, { name: entity, in: query, schema: { type: string } }, { name: entityId, in: query, schema: { type: string } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }, nextCursor: { type: [string, 'null'] } } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    BranchId: { name: branchId, in: query, schema: { type: string } }
    PayStateFilter: { name: payState, in: query, style: form, explode: false, schema: { type: array, items: { $ref: '#/components/schemas/PayState' } }, description: 'Added in 1.14.0 (FR-CUS-012). Pin colours, combined with OR; other parameters narrow with AND' }
    InvoiceKind: { name: invoiceKind, in: query, schema: { type: string, enum: [installment, credit] }, description: 'Added in 1.14.0 (FR-CUS-013). Only customers with an open (balance due, not returned or cancelled) invoice of this kind' }
    PaidThisMonth: { name: paidThisMonth, in: query, schema: { type: string, enum: [yes, no] }, description: 'Added in 1.29.0 (FR-CUS-019). `yes` = paid something in the current Asia/Dhaka month: an ERP payment dated this month (removed ones left out) or a field collection of this month still waiting for the ERP; `no` = neither. The same two sources as the row''s `activity.paidPoisha` / `activity.pendingPoisha`, so the filter agrees with the row''s money mark. Narrows with AND like the other parameters' }
    Limit: { name: limit, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, schema: { type: string } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [status, code, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: VALIDATION_FAILED }
        detail: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
    I18nText:
      type: object
      properties: { bn: { type: string }, en: { type: string } }
    Reason:
      type: object
      required: [reason]
      properties: { reason: { type: string, minLength: 5 } }
    Decision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string }
    Role: { type: string, enum: [super_admin, branch_manager, field_staff, viewer] }
    GeoFix:
      type: object
      required: [lat, lng, accuracyM]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number }
        mock: { type: boolean, default: false }
        fixAt: { type: string, format: date-time }
    GeoUnavailableReason: { type: string, enum: [permission_denied, location_off, timeout, no_fix], description: 'Why geo is null (1.2.0)' }
    TileProvider:
      type: object
      properties:
        id: { type: string, example: provider-a }
        urlTemplate: { type: string, example: 'https://tiles.example.com/{z}/{x}/{y}.png?key={key}' }
        attribution: { type: string, example: '© OpenStreetMap contributors' }
        maxZoom: { type: integer, example: 19 }
        subdomains: { type: array, items: { type: string } }
        apiKeyRef: { type: string, description: 'Public, domain/app-restricted key, if provider needs one' }
    LoginRequest:
      type: object
      required: [password, client]
      properties:
        phone: { type: string, example: '01712345678' }
        username: { type: string }
        password: { type: string }
        client: { type: string, enum: [app, web] }
    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string, description: 'App only; web uses cookie' }
        refreshTokenExpiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
        permissions: { type: array, items: { type: string } }
        flags: { type: object, additionalProperties: { type: boolean } }
        serverTime: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        employeeCode: { type: string }
        erpEmployeeId: { type: [string, 'null'] }
        shiftId: { type: [string, 'null'] }
        cashLimitPoisha: { type: [integer, 'null'] }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        locale: { type: string, enum: [bn, en] }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        version: { type: integer }
    UserCreate:
      type: object
      required: [name, phone, role, branchIds, employeeCode]
      properties:
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, minItems: 1, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        employeeCode: { type: string }
        erpEmployeeId: { type: string }
        shiftId: { type: string }
        cashLimitPoisha: { type: integer }
    UserUpdate:
      type: object
      properties:
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchIds: { type: array, items: { type: string }, minItems: 1, description: 'One or more branches; field staff may work in several since 1.19.0 (FR-CUS-015). The first is the home branch (attendance, cash, targets, app settings); the others widen whose customers they see.' }
        shiftId: { type: string }
        cashLimitPoisha: { type: integer }
        erpEmployeeId: { type: [string, 'null'], description: 'Documented in 1.13.0 (already accepted). Links the user to an ERP employee (GET /system/erp-employees); null unlinks' }
        reason: { type: string }
    UserPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: [string, 'null'] }
    Session:
      type: object
      properties: { id: { type: string }, client: { type: string }, deviceId: { type: string }, userAgent: { type: string }, ip: { type: string }, createdAt: { type: string }, lastUsedAt: { type: string }, current: { type: boolean } }
    Device:
      type: object
      properties: { id: { type: string }, deviceId: { type: string }, userId: { type: string }, model: { type: string }, androidVersion: { type: string }, appVersion: { type: string }, boundAt: { type: string }, lastSeenAt: { type: string }, rooted: { type: boolean }, emulator: { type: boolean }, status: { type: string, enum: [active, pending_approval, unbound] } }
    PermissionDef:
      type: object
      properties:
        key: { type: string, example: collection.record }
        module: { type: string }
        description: { $ref: '#/components/schemas/I18nText' }
        defaults: { type: object, additionalProperties: { type: boolean } }
        reserved: { type: boolean }
    OverrideEntry:
      type: object
      description: Added in 1.3.0
      properties: { role: { $ref: '#/components/schemas/Role' }, key: { type: string }, effect: { type: string, enum: [allow, deny] }, reason: { type: string }, setBy: { type: string }, setAt: { type: [string, 'null'], format: date-time } }
    OverrideChange:
      type: object
      required: [key, effect]
      properties:
        key: { type: string }
        effect: { type: string, enum: [allow, deny, inherit] }
    ErpEmployee:
      type: object
      description: Added in 1.13.0
      properties: { erpEmployeeId: { type: string }, code: { type: string }, name: { type: string }, erpBranchIds: { type: array, items: { type: string } }, active: { type: boolean } }
    Branch:
      type: object
      properties: { id: { type: string }, erpBranchId: { type: string }, code: { type: string }, kind: { type: string, enum: [branch, warehouse], description: 'Added in 1.13.0. ERP location type; a warehouse can hold receivables too' }, name: { $ref: '#/components/schemas/I18nText' }, district: { type: string }, address: { type: string }, lat: { type: [number, 'null'] }, lng: { type: [number, 'null'] }, active: { type: boolean } }
    FeatureFlag:
      type: object
      properties: { key: { type: string }, defaultEnabled: { type: boolean }, branchOverrides: { type: array, items: { type: object, properties: { branchId: { type: string }, enabled: { type: boolean } } } }, description: { type: string }, owner: { type: string }, reviewBy: { type: string }, lockedReason: { type: string } }
    HolidayCreate:
      type: object
      required: [date, name]
      properties: { date: { type: string, format: date }, name: { $ref: '#/components/schemas/I18nText' }, branchIds: { type: array, items: { type: string } }, type: { type: string, enum: [national, branch], default: national } }
    Holiday:
      type: object
      description: '`id` since 1.12.0.'
      properties: { id: { type: string }, date: { type: string, format: date }, name: { $ref: '#/components/schemas/I18nText' }, branchIds: { type: array, items: { type: string } }, type: { type: string, enum: [national, branch] } }
    Shift:
      type: object
      description: 'Duty hours. `weeklyOff` may be empty (a branch that works every day). `breakWindows` since 1.25.0.'
      properties:
        id: { type: string }
        name: { type: string }
        start: { type: string, example: '09:00' }
        end: { type: string, example: '18:00' }
        weeklyOff: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: '0 = Sunday … 6 = Saturday' }
        lateGraceMin: { type: integer }
        maxBreakMin: { type: integer }
        breakWindows: { type: array, maxItems: 14, items: { $ref: '#/components/schemas/BreakWindow' } }
    BreakWindow:
      type: object
      description: '1.25.0 (FR-ATT-010). On that weekday, break time between `start` and `end` (Dhaka) is allowed on top of `maxBreakMin` and is never counted as over-break. Example: Friday 12:30–15:30.'
      required: [weekday, start, end]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: '0 = Sunday … 5 = Friday, 6 = Saturday' }
        start: { type: string, example: '12:30' }
        end: { type: string, example: '15:30' }
    ErpStatus:
      type: object
      properties: { mode: { type: string, enum: [live, record_only, mock] }, lastSuccessAt: { type: string }, lagSec: { type: integer }, consecutiveFailures: { type: integer }, circuit: { type: string, enum: [closed, open, half_open] }, outboxPending: { type: integer }, outboxFailed: { type: integer } }
    DeviceSyncState:
      type: object
      properties: { userId: { type: string }, userName: { type: string }, deviceId: { type: string }, lastPullAt: { type: string }, lastPushAt: { type: string }, pendingReported: { type: integer }, lastError: { type: string }, appVersion: { type: string } }
    CustomerStatus: { type: string, enum: [overdue, due_today, promised_today, paid_up, current, bad_suggested, tagged_bad] }
    PayState:
      type: string
      enum: [bad, missed_many, missed_one, due_today, on_track, paid_off]
      description: |
        Added in 1.14.0 (FR-CUS-012, ADR-035). Payment state, the colour of the customer's map pin, worst first:
        `bad` = tagged bad/legal in FOS, or a plan's full term is over (final due date passed) with money left;
        `missed_many` = two or more missed installments (term not over); `missed_one` = one missed installment;
        `due_today` = an installment falls due today, nothing missed; `on_track` = everything due so far is paid;
        `paid_off` = nothing left to pay. A missed installment is a past-due line with money left, or a line the ERP
        rolled forward while the line that took its balance is still unpaid.
    CustomerLocation:
      type: object
      properties: { lat: { type: [number, 'null'] }, lng: { type: [number, 'null'] }, status: { type: string, enum: [ok, missing, invalid, suspect_swapped, overridden] }, source: { type: string, enum: [erp, overlay] } }
    Tag:
      type: object
      properties: { state: { type: string, enum: [none, pending, tagged] }, severity: { type: string, enum: [watch, bad, legal] }, reasonCode: { type: string }, reason: { type: string }, setBy: { type: string }, setAt: { type: string, format: date-time } }
    TagEvent:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [change, request, review_requested, decision], description: 'Added in contract 1.1.0' }
        previous: { $ref: '#/components/schemas/Tag' }
        next: { $ref: '#/components/schemas/Tag' }
        reasonCode: { type: string }
        reason: { type: string }
        actor: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string } } }
        source: { type: string, enum: [web, app, system] }
        deviceLocation: { type: object, properties: { lat: { type: number }, lng: { type: number }, accuracyM: { type: number } }, description: 'Added in 1.1.0' }
        approvalOf: { type: string, description: 'For kind=decision: the eventId of the reviewed item. Added in 1.1.0' }
        at: { type: string, format: date-time }
    TagReviewItem:
      type: object
      description: Added in contract 1.1.0
      properties:
        eventId: { type: string }
        kind: { type: string, enum: [approval, balance_cleared] }
        customer: { type: object, properties: { id: { type: string }, code: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, totalOutstandingPoisha: { type: integer }, tag: { $ref: '#/components/schemas/Tag' } } }
        requested: { $ref: '#/components/schemas/Tag' }
        requestedBy: { type: object, properties: { id: { type: string }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
    CustomerListItem:
      type: object
      properties:
        id: { type: string }
        erpCustomerId: { type: string }
        code: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        phone: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/CustomerLocation' }
        distanceM: { type: [integer, 'null'] }
        totalOutstandingPoisha: { type: integer }
        nextDueDate: { type: [string, 'null'], format: date }
        daysOverdue: { type: integer }
        badges: { type: array, items: { $ref: '#/components/schemas/CustomerStatus' } }
        tag: { $ref: '#/components/schemas/Tag' }
        openPromise: { oneOf: [ { $ref: '#/components/schemas/Promise' }, { type: 'null' } ] }
        lastVisitAt: { type: [string, 'null'], format: date-time }
        pendingFieldPoisha: { type: integer, description: 'Field collections not yet posted to ERP' }
        installmentPoisha: { type: [integer, 'null'], description: 'Amount of the next unpaid schedule line across active plans (ERP cache). Added in 1.2.0' }
        overduePoisha: { type: integer, description: 'Sum of overdue unpaid schedule amounts (ERP cache). Added in 1.2.0' }
        areaName: { oneOf: [ { $ref: '#/components/schemas/I18nText' }, { type: 'null' } ], description: 'FOS area the customer falls in. Added in 1.2.0' }
        assignee: { type: object, properties: { id: { type: string }, name: { type: string } } }
        branchId: { type: [string, 'null'], description: 'FOS branch of the customer. Added in 1.11.0' }
        branch:
          type: object
          description: |
            Added in 1.19.0 (FR-CUS-015). The customer's branch, so a list that spans several branches can say which
            one each row belongs to. Absent when the customer has no FOS branch.
          properties:
            id: { type: string }
            code: { type: string }
            name: { $ref: '#/components/schemas/I18nText' }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0. Missed installments across open plans' }
        openInvoices:
          type: object
          description: Added in 1.14.0. Open (balance due) invoices by kind
          properties: { installment: { type: integer }, credit: { type: integer } }
        invoiceCount:
          type: object
          description: Added in 1.24.0. Invoices of the customer (cancelled ones not counted) and how many still have a balance
          properties: { total: { type: integer }, open: { type: integer } }
        activity: { $ref: '#/components/schemas/CustomerActivity' }
        erpFetchedAt: { type: string, format: date-time }
    CustomerActivity:
      type: object
      description: |
        Added in 1.24.0 (FR-CUS-017). What happened with the customer in the current Asia/Dhaka month, for the row
        markers (visited, paid, promised) and the customer header. `paidPoisha` is ERP money; `pendingPoisha` is field
        money not in the ERP yet. Show the two apart and never add them together.
      required: [month, visitCount, visitedToday, paidPoisha, pendingPoisha, promisesMade, promisesKept, promisesBroken]
      properties:
        month: { type: string, example: '2026-11', description: 'The Dhaka month the numbers are for' }
        visitCount: { type: integer, description: 'Visits recorded this month' }
        visitedToday: { type: boolean }
        lastVisitAt: { type: [string, 'null'], format: date-time, description: 'Last visit of this month' }
        paidPoisha: { type: integer, description: 'ERP payments dated this month (office and field, removed ones left out), from the recent ERP payments' }
        lastPaidDate: { type: [string, 'null'], format: date, description: 'Date of the newest ERP payment this month' }
        pendingPoisha: { type: integer, description: 'Field collections recorded this month that are not in the ERP yet' }
        promisesMade: { type: integer, description: 'Promises created this month (cancelled ones not counted)' }
        promisesKept: { type: integer, description: 'Promises due this month that were kept, fully or partly' }
        promisesBroken: { type: integer, description: 'Promises due this month that were broken' }
    CustomerPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CustomerListItem' } }
        nextCursor: { type: [string, 'null'] }
        total: { type: integer }
        invoiceTotals:
          type: object
          description: 'Added in 1.24.0 (FR-CUS-018), only with includeTotal=true. Invoices of every customer the query matches (not one page): all, with a balance, and those by kind'
          properties: { total: { type: integer }, open: { type: integer }, installmentOpen: { type: integer }, creditOpen: { type: integer } }
    Plan:
      type: object
      description: |
        One collectable ERP receivable. Since 1.13.0 this is documented as one ERP invoice
        (installment or credit sale); `erpPlanId` is the invoice id (ADR-033).
      properties:
        erpPlanId: { type: string }
        product: { type: string }
        startDate: { type: string, format: date }
        finalDueDate: { type: string, format: date }
        installmentCount: { type: integer }
        totalPayablePoisha: { type: integer }
        downPaymentPoisha: { type: integer }
        paidPoisha: { type: integer }
        outstandingPoisha: { type: integer }
        status: { type: string, enum: [active, completed, closed, defaulted, cancelled], description: '`closed` = returned in the ERP; closed and cancelled plans are not collectable and not counted in totals' }
        badSuggested: { type: boolean }
        schedule:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              dueDate: { type: string, format: date }
              amountPoisha: { type: integer, description: 'Due amount including any late fee' }
              paidPoisha: { type: integer }
              status: { type: string, enum: [paid, partial, due, overdue, upcoming] }
              estimated: { type: boolean }
              lateFeePoisha: { type: integer, description: 'Added in 1.13.0. Late fee included in amountPoisha' }
              rolled: { type: boolean, description: 'Added in 1.13.0. The ERP moved this line''s balance to a later line (amount 0). Apps hide it' }
              outstandingPoisha: { type: integer, description: 'Added in 1.14.0. Left to pay on this line' }
              paidOn: { type: string, format: date, description: 'Added in 1.14.0. Date of the payment that finished the line (ERP allocations). Absent when unpaid or not known' }
              daysLate: { type: integer, description: 'Added in 1.14.0. Days after the due date it was paid (paid lines) or is still unpaid (overdue lines); 0 otherwise' }
              missed: { type: boolean, description: 'Added in 1.14.0. A missed installment not made up yet (see PayState)' }
              writtenOffPoisha: { type: integer, description: 'Added in 1.14.0. Part of paidPoisha the office wrote off (not cash)' }
              payments:
                type: array
                description: Added in 1.14.0. ERP payments that went to this line, oldest first. Absent when the ERP does not send them
                items:
                  type: object
                  properties:
                    erpPaymentId: { type: string }
                    date: { type: string, format: date }
                    amountPoisha: { type: integer, description: 'Part of the payment that went to this line' }
                    receiptNo: { type: string }
        kind: { type: string, enum: [installment, credit], description: 'Added in 1.13.0. Credit = pay-later sale with one due date' }
        invoiceNo: { type: string, description: 'Added in 1.13.0. ERP invoice number' }
        saleDate: { type: string, format: date, description: 'Added in 1.13.0' }
        frequency: { type: string, enum: [monthly, weekly, daily, custom], description: 'Added in 1.13.0. Installment plans only' }
        customDays: { type: integer, description: 'Added in 1.13.0. Days between lines when frequency is custom' }
        items:
          type: array
          description: Added in 1.13.0. Products on the invoice
          items:
            type: object
            properties:
              name: { type: string }
              model: { type: [string, 'null'] }
              qty: { type: integer }
              serials: { type: array, items: { type: string } }
              unitPricePoisha: { type: integer, description: 'Added in 1.14.0' }
              discountPoisha: { type: integer, description: 'Added in 1.14.0. Line discount' }
              serviceChargePoisha: { type: integer, description: 'Added in 1.14.0' }
              lineTotalPoisha: { type: integer, description: 'Added in 1.14.0' }
        guarantor:
          type: object
          description: Added in 1.13.0. Guarantor of this plan (never an ID number)
          properties: { name: { type: string }, phone: { type: string }, phones: { type: array, items: { type: string } }, address: { type: string } }
        writtenOffPoisha: { type: integer, description: 'Added in 1.13.0. Amount the office wrote off (already out of outstanding)' }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0. Missed installments on this plan' }
        daysOverdue: { type: integer, description: 'Added in 1.14.0. Days since the oldest missed installment' }
        nextDueDate: { type: string, format: date, description: 'Added in 1.14.0. Next date with money due (today or later)' }
        nextDuePoisha: { type: integer, description: 'Added in 1.14.0. Left to pay on that date' }
        branchId: { type: string, description: 'Added in 1.14.0. FOS branch the invoice was sold at' }
        financedPoisha: { type: integer, description: 'Added in 1.14.0. Installment invoices: total minus down payment' }
        subtotalPoisha: { type: integer, description: 'Added in 1.14.0. Invoice subtotal (before invoice discount and tax)' }
        discountPoisha: { type: integer, description: 'Added in 1.14.0. Invoice discount' }
        taxPoisha: { type: integer, description: 'Added in 1.14.0' }
        settlementDiscountPoisha: { type: integer, description: 'Added in 1.14.0. Discounts given with payments (count as paid in the ERP)' }
        refundedPoisha: { type: integer, description: 'Added in 1.14.0. Cash refunded for returns' }
        invoiceStatus: { type: string, description: 'Added in 1.14.0. ERP invoice status as stored (active, posted, returned, ...)' }
        paymentStatus: { type: string, description: 'Added in 1.14.0. ERP payment status (unpaid, partial, paid)' }
        creditDueDate: { type: string, format: date, description: 'Added in 1.14.0. Credit sales: the due date' }
        penalty: { type: object, description: 'Added in 1.14.0. Installment invoices: ERP late-fee setting', properties: { enabled: { type: boolean }, rate: { type: string } } }
    Payment:
      type: object
      properties:
        erpPaymentId: { type: string }
        date: { type: string, format: date }
        amountPoisha: { type: integer }
        method: { type: string }
        source: { type: string, enum: [office, field] }
        receiptNo: { type: string, description: 'ERP payment number (PAY-YYYYMMDD-NNNNN)' }
        reversed: { type: boolean, description: 'The office removed this payment in the ERP' }
        erpPlanId: { type: string, description: 'Added in 1.13.0. Plan (invoice) the payment went to' }
        methodLabel: { type: string, description: 'Added in 1.13.0. ERP payment method name, e.g. Cash-03' }
        collectorName: { type: string, description: 'Added in 1.13.0. ERP employee recorded as collector' }
        advance: { type: boolean, description: 'Added in 1.13.0. Down-payment advance' }
        discountPoisha: { type: integer, description: 'Added in 1.13.0. Settlement discount given with the payment' }
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerListItem'
        - type: object
          properties:
            phones: { type: array, items: { type: string }, description: 'ERP numbers first (ERP order), then the numbers added in FOS (1.23.0). Indexes of ERP numbers do not change' }
            phoneDetails: { type: array, items: { $ref: '#/components/schemas/PhoneDetail' }, description: 'Added in 1.23.0. The same numbers in the same order, with where each came from' }
            guarantor: { type: object, properties: { name: { type: string }, phone: { type: string } } }
            detailedAddress: { type: string, description: 'Added in 1.13.0. ERP detailed address' }
            directions: { type: string, description: 'Added in 1.13.0. How to find the house (ERP location instructions)' }
            erpRisk:
              type: object
              description: Added in 1.13.0. ERP customer risk snapshot, read-only, shown next to FOS tags
              properties:
                grade: { type: [string, 'null'] }
                level: { type: [string, 'null'] }
                classification: { type: [string, 'null'] }
                overdueCount: { type: integer }
                maxDaysLate: { type: integer }
                computedAt: { type: [string, 'null'] }
            plans: { type: array, items: { $ref: '#/components/schemas/Plan' } }
            payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
            pendingCollections: { type: array, items: { $ref: '#/components/schemas/Collection' } }
            badSuggestion: { type: [object, 'null'], properties: { erpPlanId: { type: string }, finalDueDate: { type: string }, outstandingPoisha: { type: integer }, text: { $ref: '#/components/schemas/I18nText' } } }
            recentNotes: { type: array, items: { $ref: '#/components/schemas/Note' } }
            lastVisit: { oneOf: [ { $ref: '#/components/schemas/Visit' }, { type: 'null' } ] }
            version: { type: integer }
    MapPin:
      type: object
      properties:
        id: { type: string }
        lat: { type: number }
        lng: { type: number }
        status: { $ref: '#/components/schemas/CustomerStatus' }
        name: { type: string }
        outstandingPoisha: { type: integer }
        tagged: { type: boolean }
        payState: { $ref: '#/components/schemas/PayState' }
        missedCount: { type: integer, description: 'Added in 1.14.0' }
    TimelineItem:
      type: object
      properties:
        kind: { type: string, enum: [erp_payment, collection, visit, note, promise, tag, handover, assignment, location_correction, attendance, stop] }
        at: { type: string, format: date-time }
        actor: { type: object, properties: { id: { type: string }, name: { type: string } } }
        summary: { $ref: '#/components/schemas/I18nText' }
        refId: { type: string }
        data: { type: object, additionalProperties: true }
    PaymentMethod: { type: string, enum: [cash, bkash, nagad, rocket, bank_transfer, other_mobile] }
    CollectionStatus: { type: string, enum: [received, posting, posted, conflict, posting_failed, resolved_posted, resolved_refund, resolved_voided, voided] }
    CollectionCreate:
      type: object
      required: [clientId, customerId, amountPoisha, method, receiptNo, recordedAt, geo]
      properties:
        clientId: { type: string, format: uuid }
        customerId: { type: string }
        erpPlanId: { type: string }
        amountPoisha: { type: integer, minimum: 1 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionRef: { type: string }
        payerName: { type: string }
        receiptNo: { type: string, example: BRL01-FS014-261115-0007 }
        physicalReceiptNo: { type: string }
        recordedAt: { type: string, format: date-time }
        deviceTime: { type: string, format: date-time }
        geo: { oneOf: [ { $ref: '#/components/schemas/GeoFix' }, { type: 'null' } ], description: 'null when no GPS fix could be taken (1.2.0); send geoUnavailableReason' }
        geoUnavailableReason: { $ref: '#/components/schemas/GeoUnavailableReason' }
        visitClientId: { type: string }
        photoMediaId: { type: string }
        note: { type: string, maxLength: 500 }
    Collection:
      type: object
      properties:
        id: { type: string }
        clientId: { type: string }
        customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }
        erpPlanId: { type: string }
        collector: { type: object, properties: { id: { type: string }, name: { type: string } } }
        amountPoisha: { type: integer }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        transactionRef: { type: [string, 'null'] }
        receiptNo: { type: string }
        erpReceiptNo: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/CollectionStatus' }
        conflict:
          type: [object, 'null']
          description: |
            `code` is one of PLAN_SETTLED, AMOUNT_EXCEEDS_OUTSTANDING, PLAN_NOT_FOUND, CUSTOMER_INACTIVE, PERIOD_LOCKED,
            ERP_VALIDATION, GAVE_UP and, since 1.13.0, PLAN_CLOSED (invoice returned/cancelled in the ERP),
            DUPLICATE_SAME_DAY (the ERP already has a payment on that invoice that day), METHOD_NOT_AVAILABLE
            (no ERP payment method of that kind at the branch), COLLECTOR_NOT_LINKED (staff user has no ERP employee).
            Show `message` (bn/en); unknown codes are possible.
          properties: { code: { type: string }, message: { $ref: '#/components/schemas/I18nText' }, raisedAt: { type: string } }
        resolution: { type: [object, 'null'], properties: { action: { type: string }, by: { type: string }, at: { type: string }, reason: { type: string } } }
        voided:
          type: object
          description: 'Present when status is `voided` (documented 1.33.0, FR-COL-017). `kind` = `withdrawn` (the collector deleted their own cash collection, FR-COL-016) or `admin` (an office user voided it); rows voided before 1.33.0 are classified by who did it (the collector = withdrawn).'
          properties:
            by: { type: string }
            byName: { type: string, description: 'Display name of `by` (1.33.0)' }
            at: { type: string, format: date-time }
            reason: { type: string }
            kind: { type: string, enum: [withdrawn, admin], description: '1.33.0' }
        edited:
          type: object
          description: 'Present once the collector has corrected the amount, note or payer with PATCH /collections/{id} (1.33.0, FR-COL-017). `previousAmountPoisha` is the amount before the FIRST edit; `at`/`by` are the latest edit.'
          properties:
            count: { type: integer }
            at: { type: string, format: date-time }
            by: { type: string }
            byName: { type: string }
            previousAmountPoisha: { type: integer }
        flags: { type: array, items: { type: string, enum: [far_from_pin, mock_location, clock_skew, late_sync, duplicate_txn_ref, not_in_scope_at_record_time, no_location] } }
        distanceToPinM: { type: [integer, 'null'] }
        depositId: { type: [string, 'null'], description: '1.35.0 (FR-CASH-010): the deposit that handed it in. Until then the collection is in the collector''s hand, is not in the ERP and may be edited or withdrawn; from then on it goes to the ERP and cannot be changed.' }
        depositedAt: { type: [string, 'null'], format: date-time, description: '1.35.0' }
        cashOnHand: { $ref: '#/components/schemas/CashPosition' }
    CashPosition:
      type: object
      properties:
        userId: { type: string }
        userName: { type: string }
        onHandPoisha: { type: integer }
        limitPoisha: { type: integer }
        state: { type: string, enum: [ok, warning, exceeded] }
        oldestUndepositedAt: { type: [string, 'null'], format: date-time }
        pendingDepositsPoisha: { type: integer }
        todayCashPoisha: { type: integer }
        todayMobilePoisha: { type: integer }
    CashInHand:
      type: object
      description: '1.27.0 (FR-CASH-007). Deposits (pending and verified) pay off cash collections oldest-first; what is left is the cash in hand, listed newest first. `onHandPoisha` equals the position''s and covers every item, also when more than 200 exist (`count` > `items.length`). Field-system cash, not an ERP balance.'
      required: [userId, userName, onHandPoisha, pendingDepositsPoisha, count, items, generatedAt]
      properties:
        userId: { type: string }
        userName: { type: string }
        onHandPoisha: { type: integer }
        pendingDepositsPoisha: { type: integer }
        count: { type: integer, description: 'Collections with cash still in hand' }
        items: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/CashInHandItem' } }
        generatedAt: { type: string, format: date-time }
    CashInHandItem:
      type: object
      required: [collectionId, receiptNo, recordedAt, businessDate, customer, erpPlanId, amountPoisha, inHandPoisha, status]
      properties:
        collectionId: { type: string }
        receiptNo: { type: string }
        recordedAt: { type: string, format: date-time }
        businessDate: { type: string, format: date }
        customer: { type: object, properties: { id: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string } } }
        erpPlanId: { type: string, description: 'The invoice (ERP plan) the money was collected for' }
        amountPoisha: { type: integer, description: 'The whole collection' }
        inHandPoisha: { type: integer, description: 'The part not yet covered by a deposit; less than amountPoisha for the one collection a deposit covers only partly' }
        status: { $ref: '#/components/schemas/CollectionStatus' }
        promise: { oneOf: [ { $ref: '#/components/schemas/CollectionPromise' }, { type: 'null' } ], description: 'Added in 1.30.0 (FR-CASH-008). The promise this money was collected against, or null when none covered that day' }
    CollectionPromise:
      type: object
      description: '1.30.0 (FR-CASH-008). The promise a collection was made against: same customer and invoice (a promise without an invoice covers any), made on or before the collection''s business date and not yet past its promised date plus the branch''s grace on that day; the newest when several match. `status` is how the promise stands now (kept / partly kept / broken are decided by ERP money, FR-PRM-003); `onTime` = collected on or before the promised date.'
      required: [id, promisedDate, promisedAmountPoisha, status, onTime]
      properties:
        id: { type: string }
        promisedDate: { type: string, format: date }
        promisedAmountPoisha: { type: integer }
        status: { type: string, enum: [open, kept, partially_kept, broken] }
        onTime: { type: boolean }
    DepositCoverage:
      type: object
      description: '1.30.0 (FR-CASH-008). 1.35.0: a `submitted` deposit lists every collection it handed in (cash and the rest, each whole, with `method`, `status` and `erpReceiptNo`). A deposit from before 1.35.0: which cash collections it covered, oldest first; the first and the last may be covered only in part (`coveredPoisha` < `amountPoisha`). `unmatchedPoisha` is deposit money with no collection behind it (a collection voided after the deposit). Field-system cash, not an ERP balance.'
      required: [deposit, coveredPoisha, unmatchedPoisha, items, generatedAt]
      properties:
        deposit: { $ref: '#/components/schemas/Deposit' }
        coveredPoisha: { type: integer }
        unmatchedPoisha: { type: integer }
        items:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CashInHandItem'
              - type: object
                required: [coveredPoisha]
                properties:
                  coveredPoisha: { type: integer, description: 'The part of this collection this deposit covered' }
                  method: { $ref: '#/components/schemas/PaymentMethod' }
                  erpReceiptNo: { type: [string, 'null'], description: '1.35.0: the ERP payment number once posted' }
        generatedAt: { type: string, format: date-time }
    DepositCreate:
      type: object
      required: [clientId, amountPoisha, destination, depositedAt]
      properties:
        clientId: { type: string, format: uuid }
        amountPoisha: { type: integer, minimum: 0, description: '1.35.0 (FR-CASH-010): must equal all the cash in hand (422 BUSINESS_RULE DEPOSIT_MUST_BE_ALL / DEPOSIT_EXCEEDS_ON_HAND, details.onHandPoisha); 0 when only mobile banking, bank or card collections are handed in (nothing at all: NOTHING_TO_DEPOSIT). Before 1.35.0 minimum 1 and any part of it.' }
        destination: { type: string, enum: [branch_cashier, bank, manager] }
        reference: { type: string }
        slipMediaId: { type: string }
        depositedAt: { type: string, format: date-time }
        geo: { $ref: '#/components/schemas/GeoFix' }
    Deposit:
      allOf:
        - $ref: '#/components/schemas/DepositCreate'
        - type: object
          properties: { id: { type: string }, userId: { type: string }, userName: { type: string, description: 'Depositor display name (1.3.0)' }, status: { type: string, enum: [pending, verified, rejected, deleted, submitted], description: '`submitted` (1.35.0, FR-CASH-010): every deposit made from 1.35.0 on; final, the collections it took go to the ERP, nobody verifies, rejects or deletes it. `pending`, `verified`, `rejected`, `deleted` (1.32.0) are deposits from before 1.35.0.' }, collectionCount: { type: integer, description: '1.35.0: collections it handed in (cash and the rest); absent on deposits from before 1.35.0' }, nonCashPoisha: { type: integer, description: '1.35.0: mobile banking, bank and card money it handed in (not part of amountPoisha)' }, nonCashCount: { type: integer, description: '1.35.0' }, verifiedBy: { type: string }, verifiedAt: { type: string }, rejectReason: { type: string }, deletedBy: { type: string, description: '1.32.0' }, deletedAt: { type: string, description: '1.32.0' }, deleteReason: { type: string, description: '1.32.0' } }
    Area:
      type: object
      properties: { id: { type: string }, branchId: { type: string }, name: { $ref: '#/components/schemas/I18nText' }, code: { type: string }, kind: { type: string, enum: [polygon, codes] }, polygon: { type: object, description: GeoJSON Polygon }, erpAreaCodes: { type: array, items: { type: string } }, color: { type: string }, customerCount: { type: integer }, assignees: { type: array, items: { type: string } }, active: { type: boolean }, version: { type: integer } }
    Assignment:
      type: object
      properties: { id: { type: string }, userId: { type: string }, type: { type: string, enum: [area, customer] }, areaId: { type: string }, customerId: { type: string }, effectiveFrom: { type: string }, effectiveTo: { type: [string, 'null'] }, source: { type: string } }
    HandoverStatus: { type: string, enum: [pending_acceptance, accepted, rejected, cancelled, expired, reverted] }
    HandoverCreate:
      type: object
      required: [fromUserId, toUserId, reason]
      properties:
        fromUserId: { type: string }
        toUserId: { type: string }
        areaIds: { type: array, items: { type: string } }
        customerIds: { type: array, items: { type: string } }
        reason: { type: string }
        effectiveDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 'Temporary cover; auto-revert' }
    Handover:
      allOf:
        - $ref: '#/components/schemas/HandoverCreate'
        - type: object
          properties:
            id: { type: string }
            status: { $ref: '#/components/schemas/HandoverStatus' }
            createdBy: { type: string }
            createdAt: { type: string }
            expiresAt: { type: string }
            summary: { type: object, properties: { customers: { type: integer }, outstandingPoisha: { type: integer }, overdue: { type: integer }, openPromises: { type: integer }, openConflicts: { type: integer } } }
    VisitOutcome: { type: string, enum: [paid, partial_paid, promised, not_home, refused, shifted_address, customer_dead, product_returned_request, other] }
    VisitCreate:
      type: object
