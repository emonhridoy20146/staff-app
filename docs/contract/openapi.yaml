        amountAchievement: { type: [number, 'null'], description: 'Collected ÷ targetToDatePoisha, 2 decimals; null without a target (1.10.0)' }
        visitAchievement: { type: [number, 'null'], description: 'visitCredit ÷ visitTargetToDate, 2 decimals; null without a target (1.10.0)' }
        targetDays: { type: integer, description: 'Working days of the period that carry a target (1.10.0)' }
    TargetValue:
      type: object
      required: [amountPoisha, visits]
      properties:
        amountPoisha: { type: integer, description: 'Daily amount target; 0 = none' }
        visits: { type: number, description: 'Daily visit-credit target; 0 = none' }
        effectiveFrom: { type: [string, 'null'], format: date }
        reason: { type: [string, 'null'] }
        setBy: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        setAt: { type: [string, 'null'], format: date-time }
    StaffTarget:
      description: 'One person on one date (1.10.0)'
