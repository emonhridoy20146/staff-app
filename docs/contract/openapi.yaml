        visits: { type: object, properties: { count: { type: integer }, uniqueCustomers: { type: integer }, credit: { type: number, description: 'Visit credit of field staff (1.10.0)' }, target: { type: number, description: 'Sum of daily visit targets in force (1.10.0)' } } }
        promises: { type: object, properties: { dueToday: { type: integer }, keptToday: { type: integer }, brokenYesterday: { type: integer } } }
        attendance: { type: object, properties: { present: { type: integer }, late: { type: integer }, absent: { type: integer }, onDutyNow: { type: integer } } }
        cash: { type: object, properties: { onHandPoisha: { type: integer }, overLimitStaff: { type: integer }, pendingDeposits: { type: integer } } }
        exceptions: { type: object, additionalProperties: { type: integer } }
        overdue: { type: object, properties: { customers: { type: integer }, amountPoisha: { type: integer }, badSuggested: { type: integer }, tagged: { type: integer } } }
        erp: { $ref: '#/components/schemas/ErpStatus' }
        trend7d: { type: array, items: { type: object, properties: { date: { type: string }, collectedPoisha: { type: integer }, visits: { type: integer } } } }
    StaffPerformanceRow:
      type: object
      properties:
        userId: { type: string }
        name: { type: string }
        period: { type: string }
        visits: { type: integer }
        uniqueCustomers: { type: integer }
        collectionsCount: { type: integer }
        collectedPoisha: { type: object, additionalProperties: { type: integer } }
        targetPoisha: { type: integer, description: 'Sum of daily amount targets over the working days of the period (filled since 1.10.0)' }
        promisesDue: { type: integer }
        promisesKept: { type: integer }
        promiseFulfilmentRate: { type: number }
        presentDays: { type: integer }
        lateDays: { type: integer }
        lateMin: { type: integer }
        breakMin: { type: integer }
        fieldMin: { type: integer }
        distanceKm: { type: number }
        soloVisits: { type: integer, description: 'Visits recorded alone (1.9.0)' }
        coWorkVisits: { type: integer, description: 'Joint visits this person took part in, as recorder or as partner; one joint visit counts once per person (1.9.0)' }
        visitCredit: { type: number, description: 'soloVisits + coWorkVisits × setting cowork.visitCredit; the figure visit targets use (1.9.0)' }
        visitTarget: { type: number, description: 'Sum of daily visit targets over the working days of the period (1.10.0)' }
