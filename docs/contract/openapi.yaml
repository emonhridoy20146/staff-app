        - $ref: '#/components/schemas/TargetValue'
        - type: object
          required: [userId, source, workingDay]
          properties:
            userId: { type: string }
            name: { type: string }
            employeeCode: { type: string }
            source: { type: string, enum: [personal, branch], description: 'personal = a personal target is in force; branch = the branch default (possibly 0)' }
            workingDay: { type: boolean, description: 'false on weekly off, holiday or approved leave; the target is then 0' }
    BranchTargets:
      type: object
      properties:
        branchId: { type: string }
