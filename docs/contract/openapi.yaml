        rank: { type: [integer, 'null'], description: 'null while nothing of the person is posted in the period' }
        userId: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        employeeCode: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        branchId: { type: [string, 'null'], description: 'The person''s home branch' }
        postedPoisha: { type: integer, description: 'Sum of the person''s field collections the ERP has accepted in the period' }
        count: { type: integer, description: 'How many collections that is' }
        me: { type: boolean, description: 'The caller' }
    CollectionBoard:
      type: object
      description: 1.26.0
      required: [period, month, scope, branchId, generatedAt, items, me]
      properties:
        period: { type: string, enum: [month, all] }
        month: { type: [string, 'null'], description: 'YYYY-MM; null for all time' }
        scope: { type: string, enum: [all, branch], description: 'Setting reports.leaderboardScope' }
        branchId: { type: [string, 'null'], description: 'The branch asked for; null when not narrowed' }
        generatedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/CollectionBoardRow' } }
        me: { type: [object, 'null'], description: 'The caller''s place; null when the caller is not on the board', properties: { rank: { type: [integer, 'null'] }, of: { type: integer, description: 'How many people are ranked' }, postedPoisha: { type: integer } } }
    DataQualityIssue: { type: string, enum: [no_location, invalid_location, suspect_swapped, far_from_branch, missing_phone, invalid_phone, shared_phone, plan_without_schedule, unassigned] }
    DataQualitySummary:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        maxBranchKm: { type: number, description: 'System default of reports.dataQualityMaxBranchKm; a branch may override it (see branches[].maxBranchKm)' }
        branches:
          type: array
          items:
            type: object
            properties:
              branchId: { type: string }
              branchName: { $ref: '#/components/schemas/I18nText' }
              maxBranchKm: { type: number, description: 'Distance used for far_from_branch in this branch' }
              customers: { type: integer, description: 'Active customers checked' }
              withIssues: { type: integer, description: 'Customers with at least one issue' }
              issues: { type: object, additionalProperties: { type: integer }, description: 'Count per DataQualityIssue; every issue key is present' }
    DataQualityItem:
      type: object
      properties:
        customerId: { type: string }
        code: { type: string }
        name: { $ref: '#/components/schemas/I18nText' }
        branchId: { type: string }
        areaCode: { type: [string, 'null'] }
        assignee: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
        issue: { $ref: '#/components/schemas/DataQualityIssue' }
        detail: { type: string, description: 'What is wrong, e.g. the invalid number or the distance in km' }
        issues: { type: array, items: { $ref: '#/components/schemas/DataQualityIssue' }, description: 'All issues of this customer' }
    OverdueBucket:
      type: object
      properties: { count: { type: integer }, amountPoisha: { type: integer } }
    BranchTrends:
      type: object
      description: 'Overdue figures are cached ERP values frozen nightly per branch (today is live); never an official balance.'
      properties:
        from: { type: string }
        to: { type: string }
        granularity: { type: string, enum: [day, week, month] }
        collection:
          type: array
          items: { type: object, properties: { period: { type: string, description: 'YYYY-MM-DD (day, or the Saturday a week starts) or YYYY-MM' }, totalPoisha: { type: integer }, cashPoisha: { type: integer }, mobilePoisha: { type: integer }, count: { type: integer }, visits: { type: integer } } }
        overdue:
          type: array
          description: 'One entry per day that has a snapshot (always daily, whatever the granularity)'
          items:
            type: object
            properties:
              date: { type: string }
              buckets: { type: object, properties: { d1_30: { $ref: '#/components/schemas/OverdueBucket' }, d31_60: { $ref: '#/components/schemas/OverdueBucket' }, d61_90: { $ref: '#/components/schemas/OverdueBucket' }, d90p: { $ref: '#/components/schemas/OverdueBucket' } } }
              totalOverdue: { $ref: '#/components/schemas/OverdueBucket' }
              badSuggested: { type: integer }
              tagged: { type: integer }
    ReconciliationReport:
      type: object
      properties:
        date: { type: string }
        balanced: { type: boolean }
        erpFetchedAt: { type: [string, 'null'], description: 'Oldest ERP copy used; null when the ERP reported no field payment for the day' }
        totals: { type: object, properties: { fosPostedCount: { type: integer }, fosPostedPoisha: { type: integer }, fosWaitingCount: { type: integer }, fosWaitingPoisha: { type: integer }, erpCount: { type: integer }, erpPoisha: { type: integer }, matchedCount: { type: integer } } }
        mismatches:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [not_posted, missing_in_erp, missing_in_fos, amount_differs, reversed_in_erp, voided_in_fos] }
              collectionId: { type: [string, 'null'] }
              receiptNo: { type: [string, 'null'] }
              erpPaymentId: { type: [string, 'null'] }
              fosAmountPoisha: { type: [integer, 'null'] }
              erpAmountPoisha: { type: [integer, 'null'] }
              status: { type: [string, 'null'] }
              customer: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string }, code: { type: string } } }
              collector: { type: [object, 'null'], properties: { id: { type: string }, name: { type: string } } }
    AuditEntry:
      type: object
      properties: { id: { type: string }, at: { type: string }, actor: { type: object, properties: { id: { type: string }, name: { type: string }, role: { type: string } } }, action: { type: string, example: rbac.override.set }, entity: { type: string }, entityId: { type: string }, branchId: { type: string }, before: { type: object, additionalProperties: true }, after: { type: object, additionalProperties: true }, reason: { type: string }, ip: { type: string }, deviceId: { type: string }, requestId: { type: string } }
