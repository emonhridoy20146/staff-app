    SyncChange:
      type: object
      properties:
        seq: { type: integer }
        entity: { type: string, enum: [customer, collection, visit, note, promise, tag, handover, assignment, area, deposit, attendance_day, notification, broadcast, setting, contact_attempt, location_proposal, cowork_session, task, place] }
        op: { type: string, enum: [upsert, delete] }
        id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: |
            Present for op=upsert. Shape per entity (1.2.0 documents the mapping; values unchanged):
            customer → CustomerDetail · collection → Collection · visit → Visit · note → Note · promise → Promise ·
            tag → Tag (with customerId) · handover → Handover · assignment → Assignment · area → Area · deposit → Deposit ·
            attendance_day → AttendanceDay · notification → Notification · broadcast → Broadcast · setting → { key, value } ·
            contact_attempt → ContactAttempt · location_proposal → OwnLocationProposal (1.7.0; sent only to the staff member who proposed, on create and on the manager's decision) ·
            cowork_session → CoworkSession (1.9.0; sent to every invited or member user on each change)
            task → Task (1.20.0; sent to the assignee on every change; the bootstrap snapshot holds open tasks and those closed in the last 30 days)
            place → Place (1.38.0; sent to every device of the place's branch on every change; a deleted place arrives as op=delete reason=deleted; the bootstrap snapshot holds the active places of the user's branches)
        reason: { type: string }
