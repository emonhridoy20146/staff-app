    SyncMutation:
      type: object
      required: [mutationId, entity, op, payload]
      properties:
        mutationId: { type: string, format: uuid }
        entity: { type: string, enum: [visit, collection, note, promise, promise_cancel, deposit, attendance_event, tag, location_proposal, visit_checkout, handover_decision, cash_closing, contact_attempt, broadcast_ack, task_resolve_request, attendance_selfie, customer_phone, collection_withdraw, collection_edit, place, place_edit, place_move_request, prospect, request, request_comment], description: 'request (1.48.0) payload RequestCreate (same as POST /requests; needs request.create and module.requests; idempotent by clientId). request_comment (1.48.0) payload RequestComment plus `requestId` (server id) or `requestClientId` (the clientId of a request sent before; send it after that request, dependsOn); needs module.requests; idempotent by the comment clientId. prospect (1.45.0) payload ProspectCreate (same as POST /prospects; needs prospect.create and module.prospects; idempotent by clientId). promise (1.45.0) may carry followUpOf. place, place_edit, place_move_request (1.38.0): see the payload description. collection_withdraw (1.32.0) payload { collectionId | clientId, reason? }: same as POST /collections/{id}/withdraw; needs collection.withdraw; send it after the collection (dependsOn). collection_edit (1.32.0) payload { collectionId | clientId, amountPoisha?, note?, payerName? }: same as PATCH /collections/{id}; needs collection.edit; a repeat with the same values is a replay. customer_phone (1.23.0) payload { customerId, phones: [{ number, label? }] }: same body as POST /customers/{id}/phones; needs permission customer.phone.manage; a repeat adds nothing. attendance_selfie (1.21.0) payload { eventClientId, selfieMediaId }: adds the photo to an attendance event that was sent before its photo uploaded; send it after that event (dependsOn).' }
        op: { type: string, enum: [create, update] }
        payload:
          type: object
          additionalProperties: true
          description: |
            Same body as the matching REST call (1.2.0 documents the mapping):
            collection → CollectionCreate (+ idempotencyKey) · visit → VisitCreate · note → POST /customers/{id}/notes body (+ customerId) ·
            promise → POST /promises body · deposit → DepositCreate · attendance_event → POST /attendance/events body ·
            tag → PUT /customers/{id}/tag body (+ customerId) · location_proposal → POST /customers/{id}/location-proposals body (+ customerId) ·
            contact_attempt → ContactAttemptCreate
            Declared in 1.5.0: collection and deposit may carry `idempotencyKey` (uuid); without it the mutationId is the key ·
            visit_checkout → { visitId | visitClientId, checkOutAt, outcome? } · promise_cancel → { promiseId, reason } ·
            cash_closing → { businessDate, note? } · handover_decision → { handoverId, decision: accept|reject, reason? (required to reject) } ·
            tag payload may carry `ifMatch` (customer version).
            1.12.0: broadcast_ack → { broadcastId, at? } (when the staff tapped "read"; kept between sending and now).
            1.20.0: task_resolve_request → { taskId, note?, requestedAt? } (the staff member says the task is done; idempotent, a repeat is a replay). Needs permission task.work.
            1.38.0: place → PlaceCreate (same as POST /places; needs place.create; the result entityId is the server id) ·
            place_edit → { placeId | placeClientId, name?, icon?, note?, location? } (same as PATCH /places/{id} without If-Match; placeClientId = the clientId of a place this user created, for edits made before the create was synced).
            1.43.0 (ADR-055): `location` { lat, lng } is a direct move by the office, applied only for place.manage with the PATCH rules: outside Bangladesh → rejected BUSINESS_RULE OUTSIDE_BANGLADESH;
            deleted place → INVALID_STATE PLACE_DELETED; an open move request is closed as rejected ("Moved by the office"). Without place.manage an item with `location` is rejected
            as a whole with FORBIDDEN (details.reason MOVE_NEEDS_MANAGE) and nothing in it is applied; send word edits as a separate item. Unknown payload fields are VALIDATION_FAILED.
            The same point again changes nothing (no version bump). The device's capture time is the mutation's `createdAt`, as for every kind; the server does not use it for places ·
            place_move_request → { placeId | placeClientId, clientId, location, reason? } (same as POST /places/{id}/move-request). Both need place.create.
            Every mutation is idempotent by mutationId; the same id with a different payload is rejected with IDEMPOTENCY_MISMATCH.
        createdAt: { type: string, format: date-time }
    SyncPushRequest:
      type: object
      required: [deviceId, mutations]
      properties:
        deviceId: { type: string }
        lastPullCursor: { type: string }
        pendingCount: { type: integer, minimum: 0, description: 'Mutations still queued on the device after this batch; shown in sync health (1.5.0)' }
        mutations: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SyncMutation' } }
    SyncPushResponse:
      type: object
      properties:
        serverTime: { type: string, format: date-time }
        results:
          type: array
          items:
            type: object
            properties:
              mutationId: { type: string }
              result: { type: string, enum: [applied, replayed, conflict, rejected] }
              entityId: { type: string }
              status: { type: string }
              conflict: { type: object, properties: { code: { type: string }, message: { $ref: '#/components/schemas/I18nText' } } }
              error: { $ref: '#/components/schemas/Problem' }
              retryable: { type: boolean, description: 'Only on rejected: true means a transient server failure, keep the item queued (1.5.0)' }
              receiptNo: { type: string }
              eventId: { type: string }
    SyncChange:
      type: object
      properties:
        seq: { type: integer }
        entity: { type: string, enum: [customer, collection, visit, note, promise, tag, handover, assignment, area, deposit, attendance_day, notification, broadcast, setting, contact_attempt, location_proposal, cowork_session, task, place, prospect, request] }
        op: { type: string, enum: [upsert, delete] }
        id: { type: string }
        data:
          type: object
          additionalProperties: true
          description: |
            Present for op=upsert. Shape per entity (1.2.0 documents the mapping; values unchanged):
            customer → CustomerDetail (1.50.0: `plans` is the full list without returned invoices; `returnedPlanIds` = ids to delete;
            1.53.0: `returnedPlans` = the returned invoices to store flagged and never count, `returnedInvoiceCount`, `onlyReturned`) · collection → Collection · visit → Visit · note → Note · promise → Promise ·
            tag → Tag (with customerId) · handover → Handover · assignment → Assignment · area → Area · deposit → Deposit ·
            attendance_day → AttendanceDay · notification → Notification · broadcast → Broadcast · setting → { key, value } ·
            contact_attempt → ContactAttempt · location_proposal → OwnLocationProposal (1.7.0; sent only to the staff member who proposed, on create and on the manager's decision) ·
            cowork_session → CoworkSession (1.9.0; sent to every invited or member user on each change)
            task → Task (1.20.0; sent to the assignee on every change; the bootstrap snapshot holds open tasks and those closed in the last 30 days)
            request → Request (1.48.0; sent to the creator and to everyone it is or was assigned to, on every change; a request no longer assigned to the user arrives as op=delete; the bootstrap snapshot holds the user's requests and the ones assigned to them that are not closed, plus those closed in the last 30 days)
            prospect → Prospect (1.45.0; sent to the staff member who created it, on create and on every office change; the bootstrap snapshot holds their prospects of the last 90 days and every one not converted or dropped)
            place → Place (1.38.0; since 1.42.0 (ADR-054) sent to every device of every branch on every change; a deleted place arrives as op=delete reason=deleted; the bootstrap snapshot holds the active places of all branches. Devices whose cursor predates 1.42.0 get CURSOR_EXPIRED once and take a fresh snapshot)
        reason: { type: string }
