      properties: { sessionId: { type: string }, participantIds: { type: array, items: { type: string } }, participants: { type: array, description: 'Names, on list rows only', items: { type: object, properties: { id: { type: string }, name: { type: string } } } } }
    CoworkColleague:
      type: object
