name: staff_app
description: "Howlader Field Operations — staff app (offline-first, Android first)."
publish_to: 'none'
version: 0.11.0+13

environment:
  sdk: ^3.14.0

dependencies:
  camera: ^0.12.2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.0.1
  go_router: ^18.1.4
  image: ^4.13.1
  intl: ^0.20.3
  latlong2: ^0.10.1
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-600.ttf
          weight: 600

# Encrypted local DB (ADR-M02 amended): package:sqlite3 v3 bundles
# SQLite3MultipleCiphers when selected here; key set via PRAGMA key.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
